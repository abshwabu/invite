    <g transform="translate(26, 18) rotate(-15)">
      <path d="M0,0 C12,-7 26,-3 30,5 C20,10 8,6 0,0 Z" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1" />
    </g>

    <!-- Left Olives / Berries -->
    <circle cx="114" cy="112" r="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.9" />
    <circle cx="88" cy="80" r="3.2" fill="{{c1}}" />
    <circle cx="92" cy="86" r="2.4" fill="{{c3}}" />
    <circle cx="62" cy="50" r="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.9" />

    <!-- Right Branch Leaves (Symmetrical) -->
    <!-- Leaf 1 -->
    <g transform="translate(140, 125) rotate(-40)">
      <path d="M0,0 C-12,-8 -28,-4 -32,6 C-22,12 -8,8 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,0 C-10,0 -20,2 -32,6" stroke="{{c1}}" stroke-width="0.6" />
