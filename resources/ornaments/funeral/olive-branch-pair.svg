    <g transform="translate(152, 92) rotate(135)">
      <path d="M0,0 C-12,-8 -28,-4 -32,6 C-22,12 -8,8 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    </g>
    <!-- Leaf 3 -->
    <g transform="translate(182, 68) rotate(-105)">
      <path d="M0,0 C-15,-10 -35,-6 -40,6 C-26,14 -10,10 0,0 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.1" />
      <path d="M0,0 C-14,0 -26,2 -40,6" stroke="{{c3}}" stroke-width="0.7" />
    </g>
    <g transform="translate(175, 60) rotate(110)">
      <path d="M0,0 C-14,-9 -30,-5 -35,6 C-24,13 -10,9 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    </g>
    <!-- Leaf 4 -->
    <g transform="translate(206, 42) rotate(-135)">
      <path d="M0,0 C-14,-10 -32,-6 -36,6 C-24,14 -10,10 0,0 Z" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
    </g>
    <g transform="translate(202, 35) rotate(85)">
      <path d="M0,0 C-12,-8 -28,-4 -32,6 C-22,12 -8,8 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
    </g>
    <!-- Leaf 5 (Tip) -->
    <g transform="translate(234, 18) rotate(-165)">
      <path d="M0,0 C-12,-7 -26,-3 -30,5 C-20,10 -8,6 0,0 Z" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1" />
    </g>

    <!-- Right Olives / Berries -->
    <circle cx="146" cy="112" r="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.9" />
    <circle cx="172" cy="80" r="3.2" fill="{{c1}}" />
    <circle cx="168" cy="86" r="2.4" fill="{{c3}}" />
    <circle cx="198" cy="50" r="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.9" />
