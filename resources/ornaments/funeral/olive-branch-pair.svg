    <g transform="translate(158, 100) rotate(-70)">
      <path d="M0,0 C-14,-10 -32,-6 -36,6 C-24,14 -10,10 0,0 Z" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.1" />
