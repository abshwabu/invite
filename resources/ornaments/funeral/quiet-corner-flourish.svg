<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gentle outer framing curve -->
    <path d="M170,18 C110,18 45,35 24,75 C16,92 16,130 18,170" stroke="{{c1}}" stroke-width="2" />
    <path d="M165,24 C112,24 54,40 32,78 C25,94 24,130 26,165" stroke="{{c2}}" stroke-width="1" stroke-dasharray="2,3" opacity="0.6" />

    <!-- Corner scroll coil / eye (around 45, 45) -->
    <path d="M24,75 C22,60 30,42 45,38 C60,34 72,44 68,58 C64,70 50,72 42,64 C36,58 38,48 46,46" stroke="{{c1}}" stroke-width="1.6" />

    <!-- Soft accent leaf inside the scroll -->
    <g transform="translate(44, 46)">
      <path d="M0,0 C10,-8 20,-4 22,5 C14,10 6,8 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- Top arm leaf fronds -->
    <g transform="translate(100, 20) rotate(-15)">
      <path d="M0,0 C12,-10 26,-6 30,5 C20,11 8,8 0,0 Z" fill="{{c3}}" opacity="0.55" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,0 C10,-1 20,1 30,5" stroke="{{c1}}" stroke-width="0.6" />
    </g>
    <g transform="translate(135, 18) rotate(-5)">
      <path d="M0,0 C12,-8 24,-4 26,4 C18,8 8,6 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- Left arm leaf fronds -->
    <g transform="translate(20, 100) rotate(75)">
      <path d="M0,0 C12,-10 26,-6 30,5 C20,11 8,8 0,0 Z" fill="{{c3}}" opacity="0.55" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,0 C10,-1 20,1 30,5" stroke="{{c1}}" stroke-width="0.6" />
    </g>
    <g transform="translate(18, 135) rotate(85)">
      <path d="M0,0 C12,-8 24,-4 26,4 C18,8 8,6 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- Quiet floral bud at corner junction -->
    <g transform="translate(70, 70)">
      <path d="M0,0 C-10,10 -12,22 -2,26 C8,30 20,20 18,8 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.1" />
      <path d="M2,4 C-4,11 -5,18 2,21 C9,24 16,16 14,8 Z" fill="{{c3}}" opacity="0.7" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="6" cy="12" r="1.8" fill="{{c1}}" />
    </g>

    <!-- Terminal finial beads -->
    <circle cx="170" cy="18" r="2.5" fill="{{c1}}" />
    <circle cx="18" cy="170" r="2.5" fill="{{c1}}" />
    <circle cx="160" cy="18" r="1.6" fill="{{c2}}" />
    <circle cx="18" cy="160" r="1.6" fill="{{c2}}" />
  </g>
</svg>
