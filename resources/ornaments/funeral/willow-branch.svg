<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Arching Willow Branch Stem (Starts top right 180, 15 and curves down left) -->
    <path d="M195,15 C145,18 90,45 60,95 C40,130 35,175 42,230" stroke="{{c1}}" stroke-width="2.5" />
    <path d="M190,12 C148,15 98,40 70,88 C50,122 45,168 50,225" stroke="{{c2}}" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.6" />

    <!-- Secondary drooping branchlet 1 (Mid upper) -->
    <path d="M110,48 C105,75 108,110 115,160 C118,185 115,210 112,235" stroke="{{c1}}" stroke-width="1.6" />

    <!-- Secondary drooping branchlet 2 (Right side) -->
    <path d="M155,24 C162,55 168,90 165,140 C162,175 158,205 162,230" stroke="{{c1}}" stroke-width="1.4" opacity="0.85" />

    <!-- Cascading Slender Willow Leaves (Gracefully drooping) -->
    <!-- On main left stem -->
    <g transform="translate(68, 80) rotate(55)">
      <path d="M0,0 C12,18 16,42 12,65 C6,45 2,22 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,0 C8,22 10,44 12,65" stroke="{{c1}}" stroke-width="0.6" />
    </g>
    <g transform="translate(52, 115) rotate(70)">
      <path d="M0,0 C10,20 12,45 8,68 C4,48 0,25 0,0 Z" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
    </g>
    <g transform="translate(42, 150) rotate(80)">
      <path d="M0,0 C12,18 14,44 10,70 C5,50 1,26 0,0 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,0 C8,22 9,45 10,70" stroke="{{c3}}" stroke-width="0.6" />
    </g>
    <g transform="translate(38, 185) rotate(85)">
      <path d="M0,0 C8,15 10,35 6,52 C3,38 0,20 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- On middle branchlet -->
    <g transform="translate(108, 65) rotate(72)">
      <path d="M0,0 C10,18 14,40 10,60 C5,42 1,22 0,0 Z" fill="{{c3}}" opacity="0.55" stroke="{{c1}}" stroke-width="1" />
    </g>
    <g transform="translate(110, 105) rotate(82)">
      <path d="M0,0 C10,20 12,46 8,72 C4,50 0,26 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,0 C6,24 8,48 8,72" stroke="{{c1}}" stroke-width="0.6" />
    </g>
    <g transform="translate(114, 145) rotate(85)">
      <path d="M0,0 C12,18 12,42 8,66 C4,46 0,24 0,0 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />
    </g>
    <g transform="translate(116, 185) rotate(88)">
      <path d="M0,0 C8,16 9,36 6,55 C3,40 0,20 0,0 Z" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- On right branchlet -->
    <g transform="translate(158, 48) rotate(75)">
      <path d="M0,0 C9,16 11,38 8,56 C4,38 0,20 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="0.9" />
    </g>
    <g transform="translate(164, 90) rotate(84)">
      <path d="M0,0 C10,20 12,44 8,68 C4,48 0,25 0,0 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,0 C6,22 8,45 8,68" stroke="{{c3}}" stroke-width="0.6" />
    </g>
    <g transform="translate(164, 135) rotate(86)">
      <path d="M0,0 C10,18 11,40 7,62 C3,44 0,22 0,0 Z" fill="{{c3}}" opacity="0.55" stroke="{{c1}}" stroke-width="0.9" />
    </g>
    <g transform="translate(160, 175) rotate(88)">
      <path d="M0,0 C8,15 9,35 6,52 C3,38 0,20 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- Delicate morning dew / tear drops -->
    <circle cx="50" cy="225" r="2" fill="{{c2}}" />
    <circle cx="120" cy="232" r="1.8" fill="{{c1}}" />
    <circle cx="168" cy="228" r="1.6" fill="{{c2}}" />
    <circle cx="78" cy="140" r="1.4" fill="{{c3}}" />
    <circle cx="128" cy="170" r="1.5" fill="{{c3}}" />
  </g>
</svg>
