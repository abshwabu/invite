<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Light Origin at Top Center (150, 0) -->

    <!-- Heavenly Sun/Light Core at top edge -->
    <ellipse cx="150" cy="0" rx="36" ry="20" fill="{{c1}}" opacity="0.8" />
    <ellipse cx="150" cy="0" rx="55" ry="32" fill="{{c2}}" opacity="0.4" />
    <ellipse cx="150" cy="0" rx="80" ry="46" fill="{{c3}}" opacity="0.25" />

    <!-- Broad radiating light beams (c3, c2, c1 with varying opacities) -->
    <!-- Far Left Beams -->
    <polygon points="144,0 15,145 42,150 148,0" fill="{{c3}}" opacity="0.3" />
    <polygon points="146,0 52,148 78,150 148,0" fill="{{c2}}" opacity="0.35" />

    <!-- Mid Left Beams -->
    <polygon points="147,0 88,148 112,150 149,0" fill="{{c1}}" opacity="0.25" />
    <polygon points="148,0 120,150 138,150 150,0" fill="{{c2}}" opacity="0.45" />

    <!-- Center Direct Beam -->
    <polygon points="149,0 142,150 158,150 151,0" fill="{{c1}}" opacity="0.5" />

    <!-- Mid Right Beams -->
    <polygon points="150,0 162,150 180,150 152,0" fill="{{c2}}" opacity="0.45" />
    <polygon points="151,0 188,150 212,148 153,0" fill="{{c1}}" opacity="0.25" />

    <!-- Far Right Beams -->
    <polygon points="152,0 222,150 248,148 154,0" fill="{{c2}}" opacity="0.35" />
    <polygon points="152,0 258,150 285,145 156,0" fill="{{c3}}" opacity="0.3" />

    <!-- Fine radiating accent ray lines -->
    <line x1="150" y1="0" x2="30" y2="135" stroke="{{c1}}" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4" />
    <line x1="150" y1="0" x2="70" y2="145" stroke="{{c2}}" stroke-width="1.4" opacity="0.7" />
    <line x1="150" y1="0" x2="105" y2="150" stroke="{{c1}}" stroke-width="1" opacity="0.6" stroke-dasharray="3,3" />
    <line x1="150" y1="0" x2="135" y2="150" stroke="{{c2}}" stroke-width="1.6" opacity="0.8" />
    <line x1="150" y1="0" x2="150" y2="150" stroke="{{c1}}" stroke-width="2" opacity="0.8" />
    <line x1="150" y1="0" x2="165" y2="150" stroke="{{c2}}" stroke-width="1.6" opacity="0.8" />
    <line x1="150" y1="0" x2="195" y2="150" stroke="{{c1}}" stroke-width="1" opacity="0.6" stroke-dasharray="3,3" />
    <line x1="150" y1="0" x2="230" y2="145" stroke="{{c2}}" stroke-width="1.4" opacity="0.7" />
    <line x1="150" y1="0" x2="270" y2="135" stroke="{{c1}}" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4" />

    <!-- Soft ethereal cloud puffs framing top origin -->
    <path d="M100,0 C100,16 112,26 128,24 C132,32 144,38 156,34 C164,40 178,38 186,28 C198,26 206,14 204,0 Z" fill="{{c3}}" opacity="0.35" stroke="{{c2}}" stroke-width="0.8" />
    <path d="M115,0 C115,12 126,20 138,18 C144,24 154,26 162,22 C170,26 182,22 188,14 C192,10 194,4 194,0 Z" fill="{{c1}}" opacity="0.15" />

    <!-- Shimmering dust motes floating in beams -->
    <circle cx="150" cy="55" r="2" fill="{{c1}}" />
    <circle cx="138" cy="85" r="1.6" fill="{{c2}}" />
    <circle cx="165" cy="78" r="1.8" fill="{{c2}}" />
    <circle cx="122" cy="115" r="1.4" fill="{{c1}}" />
    <circle cx="178" cy="118" r="1.5" fill="{{c1}}" />
    <circle cx="95" cy="128" r="1.2" fill="{{c3}}" />
    <circle cx="205" cy="125" r="1.2" fill="{{c3}}" />
  </g>
</svg>
