<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stems gathering down to (120, 225) -->
    <path d="M120,225 C122,185 108,145 90,110" stroke="{{c1}}" stroke-width="2" />
    <path d="M120,225 C120,185 132,145 150,110" stroke="{{c1}}" stroke-width="2" />
    <path d="M120,225 C118,170 120,120 120,70" stroke="{{c1}}" stroke-width="1.6" />

    <!-- Ribbon tie at base (120, 205) -->
    <ellipse cx="120" cy="205" rx="10" ry="4" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.2" />
    <path d="M112,206 C105,215 98,225 94,228" stroke="{{c1}}" stroke-width="1.2" />
    <path d="M128,206 C135,215 142,225 146,228" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Cascading background greenery fronds (c3) -->
    <g transform="translate(70, 160) rotate(-60)">
      <path d="M0,0 C20,-15 45,-10 52,6 C35,16 14,12 0,0 Z" fill="{{c3}}" opacity="0.45" stroke="{{c1}}" stroke-width="1" />
    </g>
    <g transform="translate(170, 160) rotate(60)">
      <path d="M0,0 C-20,-15 -45,-10 -52,6 C-35,16 -14,12 0,0 Z" fill="{{c3}}" opacity="0.45" stroke="{{c1}}" stroke-width="1" />
    </g>
    <g transform="translate(50, 95) rotate(-35)">
      <path d="M0,0 C18,-12 38,-8 42,6 C28,14 10,10 0,0 Z" fill="{{c3}}" opacity="0.4" stroke="{{c1}}" stroke-width="0.9" />
    </g>
    <g transform="translate(190, 95) rotate(35)">
      <path d="M0,0 C-18,-12 -38,-8 -42,6 C-28,14 -10,10 0,0 Z" fill="{{c3}}" opacity="0.4" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- Center Upper Lily Bud (120, 60) -->
    <g transform="translate(120, 60)">
      <path d="M0,25 C-10,12 -12,-6 0,-20 C12,-6 10,12 0,25 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,25 C-4,10 -4,-5 0,-18" stroke="{{c1}}" stroke-width="0.8" />
      <path d="M-8,15 C-12,5 -6,-5 0,-15" stroke="{{c3}}" stroke-width="0.8" />
    </g>

    <!-- Left Blooming Lily (85, 105) -->
    <g transform="translate(85, 105) rotate(-22)">
      <!-- Outer petal silhouette (c3) -->
      <path d="M0,30 C-26,22 -40,-2 -34,-26 C-28,-50 -4,-56 4,-58 C12,-56 36,-50 42,-26 C48,-2 32,22 0,30 Z" fill="{{c3}}" opacity="0.4" stroke="{{c1}}" stroke-width="1.3" />
      <!-- Left petal flange -->
      <path d="M0,30 C-16,22 -30,2 -26,-22 C-22,-46 -4,-54 4,-58 C-4,-42 -8,-16 0,8 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1.1" />
      <!-- Right overlapping petal flange -->
      <path d="M0,30 C16,22 30,2 26,-22 C22,-46 4,-54 -4,-58 C4,-42 8,-16 0,8 Z" fill="{{c1}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.1" />
      <!-- Spadix -->
      <line x1="0" y1="10" x2="3" y2="-34" stroke="{{c1}}" stroke-width="1.5" />
      <circle cx="3" cy="-36" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
    </g>

    <!-- Right Blooming Lily (155, 105) -->
    <g transform="translate(155, 105) rotate(22)">
      <!-- Outer petal silhouette (c3) -->
      <path d="M0,30 C-32,22 -48,-2 -42,-26 C-36,-50 -12,-56 -4,-58 C4,-56 28,-50 34,-26 C40,-2 26,22 0,30 Z" fill="{{c3}}" opacity="0.4" stroke="{{c1}}" stroke-width="1.3" />
      <!-- Left petal flange -->
      <path d="M0,30 C-16,22 -30,2 -26,-22 C-22,-46 -4,-54 4,-58 C-4,-42 -8,-16 0,8 Z" fill="{{c1}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.1" />
      <!-- Right overlapping petal flange -->
      <path d="M0,30 C16,22 30,2 26,-22 C22,-46 4,-54 -4,-58 C4,-42 8,-16 0,8 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1.1" />
      <!-- Spadix -->
      <line x1="0" y1="10" x2="-3" y2="-34" stroke="{{c1}}" stroke-width="1.5" />
      <circle cx="-3" cy="-36" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
    </g>

    <!-- Delicate pollen dots floating peacefully -->
    <circle cx="120" cy="30" r="1.4" fill="{{c2}}" />
    <circle cx="114" cy="40" r="1.2" fill="{{c1}}" />
    <circle cx="126" cy="42" r="1.2" fill="{{c1}}" />
  </g>
</svg>
