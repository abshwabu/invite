<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Smooth curved stem -->
    <path d="M80,120 C76,165 86,210 80,255" stroke="{{c1}}" stroke-width="2.5" />
    <path d="M82,120 C78,165 88,210 82,255" stroke="{{c2}}" stroke-width="1" opacity="0.6" stroke-dasharray="2,3" />

    <!-- Stem base leaf frond -->
    <g transform="translate(80, 200) rotate(35)">
      <path d="M0,0 C20,-15 45,-12 55,5 C38,18 16,14 0,0 Z" fill="{{c3}}" opacity="0.45" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C18,-2 36,1 55,5" stroke="{{c1}}" stroke-width="0.7" />
    </g>

    <!-- Lily Blossom Spathe (Flowing trumpet flower) -->
    <!-- Background outer petal wing (c3 shadow) -->
    <path d="M80,120 C50,110 32,80 38,50 C44,20 72,12 80,10 C88,12 116,20 122,50 C128,80 110,110 80,120 Z" fill="{{c3}}" opacity="0.4" stroke="{{c1}}" stroke-width="1.4" />

    <!-- Left Spathe Flange (c2 accent) -->
    <path d="M80,120 C60,112 40,88 44,58 C48,28 70,16 80,10 C70,28 66,60 76,95 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Right Overlapping Spathe Flange (c1 main) -->
    <path d="M80,120 C100,112 120,88 116,58 C112,28 90,16 80,10 C90,28 94,60 84,95 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Graceful curled petal tip pointing to sky -->
    <path d="M80,10 C78,6 80,2 84,4 C88,6 84,10 80,10 Z" fill="{{c1}}" />

    <!-- Central Spadix (Stamen spike - c1 main with c2 highlight) -->
    <path d="M80,95 C78,72 78,48 80,32 C82,48 82,72 80,95 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
    <line x1="80" y1="36" x2="80" y2="88" stroke="{{c2}}" stroke-width="1.8" />
    <circle cx="80" cy="30" r="2.8" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />

    <!-- Inner Throat Shading / Fold Lines -->
    <path d="M72,98 C70,112 75,118 80,120 C85,118 90,112 88,98" stroke="{{c1}}" stroke-width="1.6" />
    <path d="M60,65 C62,85 70,105 80,120" stroke="{{c1}}" stroke-width="1" opacity="0.7" />
    <path d="M100,65 C98,85 90,105 80,120" stroke="{{c1}}" stroke-width="1" opacity="0.7" />

    <!-- Subtle gentle pollen dots -->
    <circle cx="75" cy="45" r="1.2" fill="{{c2}}" />
    <circle cx="85" cy="42" r="1.2" fill="{{c2}}" />
    <circle cx="76" cy="58" r="1" fill="{{c1}}" />
    <circle cx="84" cy="55" r="1" fill="{{c1}}" />
  </g>
</svg>
