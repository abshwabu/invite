<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none">
  <!-- Precision concentric technical rings with telemetry tick marks and arc segments -->
  <g class="circle-rings" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center coordinate: (140, 140) -->

    <!-- Outer Precision Tick Ring (Radius 125) -->
    <circle cx="140" cy="140" r="125" stroke="{{c3}}" stroke-width="1.2" opacity="0.4"/>
    <circle cx="140" cy="140" r="120" stroke="{{c2}}" stroke-width="2" stroke-dasharray="2 6"/>
    
    <!-- Quadrant Major Tick Marks -->
    <line x1="140" y1="10" x2="140" y2="25" stroke="{{c1}}" stroke-width="2.5"/>
    <line x1="270" y1="140" x2="255" y2="140" stroke="{{c1}}" stroke-width="2.5"/>
    <line x1="140" y1="270" x2="140" y2="255" stroke="{{c1}}" stroke-width="2.5"/>
    <line x1="10" y1="140" x2="25" y2="140" stroke="{{c1}}" stroke-width="2.5"/>

    <!-- 45-degree ticks -->
    <line x1="48" y1="48" x2="58" y2="58" stroke="{{c2}}" stroke-width="1.8"/>
    <line x1="232" y1="48" x2="222" y2="58" stroke="{{c2}}" stroke-width="1.8"/>
    <line x1="232" y1="232" x2="222" y2="222" stroke="{{c2}}" stroke-width="1.8"/>
    <line x1="48" y1="232" x2="58" y2="222" stroke="{{c2}}" stroke-width="1.8"/>

    <!-- Heavy Segmented Radar Arc (Radius 104) -->
    <path d="M66 140 A74 74 0 0 1 140 66" stroke="{{c1}}" stroke-width="5" fill="none"/>
    <path d="M214 140 A74 74 0 0 1 140 214" stroke="{{c1}}" stroke-width="5" fill="none"/>
    <!-- Companion thin dash arc -->
    <path d="M140 66 A74 74 0 0 1 214 140" stroke="{{c2}}" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <path d="M140 214 A74 74 0 0 1 66 140" stroke="{{c2}}" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

    <!-- Middle Technical Compass Ring (Radius 88) -->
    <circle cx="140" cy="140" r="88" stroke="{{c1}}" stroke-width="1.5"/>
    <circle cx="140" cy="140" r="82" stroke="{{c3}}" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Inner Segmented Rotating Gear-notched Ring (Radius 64) -->
    <circle cx="140" cy="140" r="64" stroke="{{c2}}" stroke-width="3" stroke-dasharray="16 8"/>
    
    <!-- Gyro / Telemetry Crosshairs -->
    <line x1="85" y1="140" x2="195" y2="140" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="140" y1="85" x2="140" y2="195" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Inner Data Disc (Radius 44) -->
    <circle cx="140" cy="140" r="44" fill="{{c1}}" opacity="0.1" stroke="{{c1}}" stroke-width="2"/>
    <circle cx="140" cy="140" r="36" stroke="{{c2}}" stroke-width="1.5"/>
    <circle cx="140" cy="140" r="30" stroke="{{c3}}" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Core Target Bullseye -->
    <circle cx="140" cy="140" r="14" fill="{{c2}}" stroke="{{c1}}" stroke-width="2"/>
    <circle cx="140" cy="140" r="6" fill="{{c1}}"/>
    <circle cx="140" cy="140" r="2" fill="#FFFFFF"/>

    <!-- Satellite Orbital Nodes -->
    <circle cx="140" cy="52" r="4" fill="{{c1}}" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="228" cy="140" r="4" fill="{{c2}}" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="140" cy="228" r="4" fill="{{c1}}" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="52" cy="140" r="4" fill="{{c2}}" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Precision Degree Coordinates -->
    <circle cx="196" cy="84" r="2.5" fill="{{c3}}"/>
    <circle cx="84" cy="196" r="2.5" fill="{{c3}}"/>
    <circle cx="84" cy="84" r="2.5" fill="{{c1}}"/>
    <circle cx="196" cy="196" r="2.5" fill="{{c1}}"/>
  </g>
</svg>
