<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <!-- Elegant algorithmic tech data wave lines with harmonic curves and peak nodes -->
  <g class="wave-lines" stroke-linecap="round" stroke-linejoin="round">
    <!-- Baseline Reference Rules -->
    <line x1="20" y1="130" x2="340" y2="130" stroke="{{c3}}" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.4"/>
    <line x1="20" y1="90" x2="340" y2="90" stroke="{{c3}}" stroke-width="1" stroke-dasharray="2 8" opacity="0.3"/>

    <!-- Wave 1: Soft Shaded Underflow Basin -->
    <path d="M20 130 C70 130 90 60 140 60 C190 60 210 110 260 110 C310 110 320 80 340 80 L340 130 Z" fill="{{c1}}" opacity="0.08"/>

    <!-- Wave 2: Harmonic Background Wave -->
    <path d="M20 115 C60 115 80 50 130 50 C180 50 200 120 250 120 C290 120 310 70 340 70" stroke="{{c3}}" stroke-width="2" stroke-dasharray="4 4" opacity="0.75" fill="none"/>

    <!-- Wave 3: Secondary Resonant Wave -->
    <path d="M20 100 C70 120 90 40 150 40 C210 40 220 105 270 105 C310 105 325 55 340 55" stroke="{{c2}}" stroke-width="2.5" fill="none"/>

    <!-- Wave 4: Hero Primary Data Wave (Crisp Thick Spine) -->
    <path d="M20 125 C65 125 95 30 145 30 C195 30 215 95 265 95 C305 95 320 45 340 45" stroke="{{c1}}" stroke-width="3.5" fill="none"/>

    <!-- Peak Indicator Nodes & Coordinate Pointers -->
    <!-- Peak 1 at (145, 30) -->
    <line x1="145" y1="30" x2="145" y2="130" stroke="{{c2}}" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="145" cy="30" r="6" fill="{{c1}}" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="145" cy="30" r="10" stroke="{{c2}}" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="145" cy="30" r="2" fill="{{c2}}"/>

    <!-- Peak 2 at (150, 40) -->
    <circle cx="150" cy="40" r="3.5" fill="{{c2}}"/>

    <!-- Trough at (265, 95) -->
    <line x1="265" y1="95" x2="265" y2="130" stroke="{{c3}}" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="265" cy="95" r="4.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5"/>
    <circle cx="265" cy="95" r="1.5" fill="#FFFFFF"/>

    <!-- Secondary Node at (250, 120) -->
    <circle cx="250" cy="120" r="3" fill="{{c3}}"/>

    <!-- End Peak at (340, 45) -->
    <circle cx="340" cy="45" r="4" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.2"/>

    <!-- Start Node at (20, 125) -->
    <circle cx="20" cy="125" r="3" fill="{{c1}}"/>

    <!-- Precision Scale Ticks at bottom -->
    <g stroke="{{c1}}" stroke-width="1.5">
      <line x1="60" y1="126" x2="60" y2="134"/>
      <line x1="145" y1="124" x2="145" y2="136" stroke="{{c2}}" stroke-width="2"/>
      <line x1="205" y1="126" x2="205" y2="134"/>
      <line x1="265" y1="124" x2="265" y2="136" stroke="{{c2}}" stroke-width="2"/>
      <line x1="320" y1="126" x2="320" y2="134"/>
    </g>
  </g>
</svg>
