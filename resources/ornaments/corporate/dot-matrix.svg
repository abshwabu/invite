<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <!-- Precision digital halftone dot matrix field with density falloff wave -->
  <g class="dot-matrix">
    <!-- Grid 12 columns x 8 rows -->
    <!-- Column x: 20, 42, 64, 86, 108, 130, 152, 174, 196, 218, 240, 260 -->
    <!-- Row y: 20, 42, 64, 86, 108, 130, 152, 174 -->

    <!-- Row 1 (y=20) -->
    <circle cx="20" cy="20" r="1.5" fill="{{c1}}" opacity="0.3"/>
    <circle cx="42" cy="20" r="1.8" fill="{{c1}}" opacity="0.4"/>
    <circle cx="64" cy="20" r="2.2" fill="{{c1}}" opacity="0.5"/>
    <circle cx="86" cy="20" r="2.8" fill="{{c2}}" opacity="0.6"/>
    <circle cx="108" cy="20" r="3.2" fill="{{c2}}" opacity="0.7"/>
    <circle cx="130" cy="20" r="3.8" fill="{{c1}}" opacity="0.8"/>
    <circle cx="152" cy="20" r="3.5" fill="{{c1}}" opacity="0.75"/>
    <circle cx="174" cy="20" r="3.0" fill="{{c2}}" opacity="0.65"/>
    <circle cx="196" cy="20" r="2.5" fill="{{c2}}" opacity="0.55"/>
    <circle cx="218" cy="20" r="2.0" fill="{{c3}}" opacity="0.45"/>
    <circle cx="240" cy="20" r="1.6" fill="{{c3}}" opacity="0.35"/>
    <circle cx="260" cy="20" r="1.2" fill="{{c3}}" opacity="0.25"/>

    <!-- Row 2 (y=42) -->
    <circle cx="20" cy="42" r="1.8" fill="{{c1}}" opacity="0.35"/>
    <circle cx="42" cy="42" r="2.2" fill="{{c1}}" opacity="0.45"/>
    <circle cx="64" cy="42" r="2.8" fill="{{c2}}" opacity="0.6"/>
    <circle cx="86" cy="42" r="3.5" fill="{{c2}}" opacity="0.75"/>
    <circle cx="108" cy="42" r="4.2" fill="{{c1}}" opacity="0.9"/>
    <circle cx="130" cy="42" r="4.8" fill="{{c1}}"/>
    <circle cx="152" cy="42" r="4.2" fill="{{c1}}" opacity="0.85"/>
    <circle cx="174" cy="42" r="3.6" fill="{{c2}}" opacity="0.75"/>
    <circle cx="196" cy="42" r="3.0" fill="{{c2}}" opacity="0.6"/>
    <circle cx="218" cy="42" r="2.4" fill="{{c3}}" opacity="0.5"/>
    <circle cx="240" cy="42" r="1.8" fill="{{c3}}" opacity="0.4"/>
    <circle cx="260" cy="42" r="1.4" fill="{{c3}}" opacity="0.3"/>

    <!-- Row 3 (y=64) -->
    <circle cx="20" cy="64" r="2.2" fill="{{c1}}" opacity="0.45"/>
    <circle cx="42" cy="64" r="2.8" fill="{{c2}}" opacity="0.6"/>
    <circle cx="64" cy="64" r="3.5" fill="{{c2}}" opacity="0.75"/>
    <circle cx="86" cy="64" r="4.4" fill="{{c1}}" opacity="0.9"/>
    <circle cx="108" cy="64" r="5.2" fill="{{c1}}"/>
    <circle cx="130" cy="64" r="5.8" fill="{{c1}}"/>
    <circle cx="152" cy="64" r="5.0" fill="{{c1}}" opacity="0.9"/>
    <circle cx="174" cy="64" r="4.2" fill="{{c2}}" opacity="0.8"/>
    <circle cx="196" cy="64" r="3.4" fill="{{c2}}" opacity="0.65"/>
    <circle cx="218" cy="64" r="2.8" fill="{{c3}}" opacity="0.55"/>
    <circle cx="240" cy="64" r="2.2" fill="{{c3}}" opacity="0.45"/>
    <circle cx="260" cy="64" r="1.6" fill="{{c3}}" opacity="0.35"/>

    <!-- Row 4 (y=86) Peak Wave -->
    <circle cx="20" cy="86" r="2.6" fill="{{c1}}" opacity="0.5"/>
    <circle cx="42" cy="86" r="3.2" fill="{{c2}}" opacity="0.7"/>
    <circle cx="64" cy="86" r="4.0" fill="{{c2}}" opacity="0.85"/>
    <circle cx="86" cy="86" r="5.0" fill="{{c1}}"/>
    <circle cx="108" cy="86" r="6.0" fill="{{c1}}"/>
    <!-- Highlighted center node with halo -->
    <circle cx="130" cy="86" r="9" stroke="{{c2}}" stroke-width="1.5" stroke-dasharray="2 3"/>
    <circle cx="130" cy="86" r="6.5" fill="{{c2}}"/>
    <circle cx="130" cy="86" r="2" fill="#FFFFFF"/>
    
    <circle cx="152" cy="86" r="5.8" fill="{{c1}}"/>
    <circle cx="174" cy="86" r="4.8" fill="{{c2}}" opacity="0.85"/>
    <circle cx="196" cy="86" r="3.8" fill="{{c2}}" opacity="0.7"/>
    <circle cx="218" cy="86" r="3.0" fill="{{c3}}" opacity="0.6"/>
    <circle cx="240" cy="86" r="2.4" fill="{{c3}}" opacity="0.5"/>
    <circle cx="260" cy="86" r="1.8" fill="{{c3}}" opacity="0.35"/>

    <!-- Row 5 (y=108) -->
    <circle cx="20" cy="108" r="2.2" fill="{{c1}}" opacity="0.45"/>
    <circle cx="42" cy="108" r="2.8" fill="{{c2}}" opacity="0.6"/>
    <circle cx="64" cy="108" r="3.5" fill="{{c2}}" opacity="0.75"/>
    <circle cx="86" cy="108" r="4.4" fill="{{c1}}" opacity="0.9"/>
    <circle cx="108" cy="108" r="5.2" fill="{{c1}}"/>
    <circle cx="130" cy="108" r="5.8" fill="{{c1}}"/>
    <circle cx="152" cy="108" r="5.0" fill="{{c1}}" opacity="0.9"/>
    <circle cx="174" cy="108" r="4.2" fill="{{c2}}" opacity="0.8"/>
    <circle cx="196" cy="108" r="3.4" fill="{{c2}}" opacity="0.65"/>
    <circle cx="218" cy="108" r="2.8" fill="{{c3}}" opacity="0.55"/>
    <circle cx="240" cy="108" r="2.2" fill="{{c3}}" opacity="0.45"/>
    <circle cx="260" cy="108" r="1.6" fill="{{c3}}" opacity="0.35"/>

    <!-- Row 6 (y=130) -->
    <circle cx="20" cy="130" r="1.8" fill="{{c1}}" opacity="0.35"/>
    <circle cx="42" cy="130" r="2.2" fill="{{c1}}" opacity="0.45"/>
    <circle cx="64" cy="130" r="2.8" fill="{{c2}}" opacity="0.6"/>
    <circle cx="86" cy="130" r="3.5" fill="{{c2}}" opacity="0.75"/>
    <circle cx="108" cy="130" r="4.2" fill="{{c1}}" opacity="0.9"/>
    <circle cx="130" cy="130" r="4.8" fill="{{c1}}"/>
    <circle cx="152" cy="130" r="4.2" fill="{{c1}}" opacity="0.85"/>
    <circle cx="174" cy="130" r="3.6" fill="{{c2}}" opacity="0.75"/>
    <circle cx="196" cy="130" r="3.0" fill="{{c2}}" opacity="0.6"/>
    <circle cx="218" cy="130" r="2.4" fill="{{c3}}" opacity="0.5"/>
    <circle cx="240" cy="130" r="1.8" fill="{{c3}}" opacity="0.4"/>
    <circle cx="260" cy="130" r="1.4" fill="{{c3}}" opacity="0.3"/>

    <!-- Row 7 (y=152) -->
    <circle cx="20" cy="152" r="1.5" fill="{{c1}}" opacity="0.3"/>
    <circle cx="42" cy="152" r="1.8" fill="{{c1}}" opacity="0.4"/>
    <circle cx="64" cy="152" r="2.2" fill="{{c1}}" opacity="0.5"/>
    <circle cx="86" cy="152" r="2.8" fill="{{c2}}" opacity="0.6"/>
    <circle cx="108" cy="152" r="3.2" fill="{{c2}}" opacity="0.7"/>
    <circle cx="130" cy="152" r="3.8" fill="{{c1}}" opacity="0.8"/>
    <circle cx="152" cy="152" r="3.5" fill="{{c1}}" opacity="0.75"/>
    <circle cx="174" cy="152" r="3.0" fill="{{c2}}" opacity="0.65"/>
    <circle cx="196" cy="152" r="2.5" fill="{{c2}}" opacity="0.55"/>
    <circle cx="218" cy="152" r="2.0" fill="{{c3}}" opacity="0.45"/>
    <circle cx="240" cy="152" r="1.6" fill="{{c3}}" opacity="0.35"/>
    <circle cx="260" cy="152" r="1.2" fill="{{c3}}" opacity="0.25"/>

    <!-- Row 8 (y=174) -->
    <circle cx="20" cy="174" r="1.2" fill="{{c1}}" opacity="0.25"/>
    <circle cx="42" cy="174" r="1.4" fill="{{c1}}" opacity="0.3"/>
    <circle cx="64" cy="174" r="1.8" fill="{{c1}}" opacity="0.4"/>
    <circle cx="86" cy="174" r="2.2" fill="{{c2}}" opacity="0.5"/>
    <circle cx="108" cy="174" r="2.6" fill="{{c2}}" opacity="0.6"/>
    <circle cx="130" cy="174" r="3.0" fill="{{c1}}" opacity="0.7"/>
    <circle cx="152" cy="174" r="2.8" fill="{{c1}}" opacity="0.65"/>
    <circle cx="174" cy="174" r="2.4" fill="{{c2}}" opacity="0.55"/>
    <circle cx="196" cy="174" r="2.0" fill="{{c2}}" opacity="0.45"/>
    <circle cx="218" cy="174" r="1.6" fill="{{c3}}" opacity="0.35"/>
    <circle cx="240" cy="174" r="1.2" fill="{{c3}}" opacity="0.25"/>
    <circle cx="260" cy="174" r="1.0" fill="{{c3}}" opacity="0.2"/>
  </g>
</svg>
