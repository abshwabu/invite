<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <!-- Precision corporate ticket / badge pass frame with side notches and lanyard hole -->
  <g class="ticket-notch-frame" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Lanyard Slot -->
    <rect x="130" y="16" width="60" height="12" rx="6" fill="{{c3}}" stroke="{{c1}}" stroke-width="2"/>
    <circle cx="160" cy="22" r="3" fill="{{c2}}"/>

    <!-- Main Ticket Pass Outer Border with Side Inverted Notches -->
    <!-- Notches at y=280 on left and right for tear-off stub effect -->
    <path d="M 30 40 
      H 290 
      A 10 10 0 0 1 300 50 
      V 265 
      A 15 15 0 0 0 300 295 
      V 390 
      A 10 10 0 0 1 290 400 
      H 30 
      A 10 10 0 0 1 20 390 
      V 295 
      A 15 15 0 0 0 20 265 
      V 50 
      A 10 10 0 0 1 30 40 Z" 
      fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>

    <!-- Inner Nested Precision Border -->
    <path d="M 38 48 
      H 282 
      A 4 4 0 0 1 286 52 
      V 263 
      A 21 21 0 0 0 286 297 
      V 388 
      A 4 4 0 0 1 282 392 
      H 38 
      A 4 4 0 0 1 34 388 
      V 297 
      A 21 21 0 0 0 34 263 
      V 52 
      A 4 4 0 0 1 38 48 Z" 
      stroke="{{c2}}" stroke-width="1.8" fill="none"/>

    <!-- Hairline Dashed Perforation Tear Line across y=280 -->
    <line x1="20" y1="280" x2="300" y2="280" stroke="{{c1}}" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Header Banner Accent Area -->
    <rect x="36" y="50" width="248" height="32" fill="{{c1}}" opacity="0.08"/>
    <line x1="36" y1="82" x2="284" y2="82" stroke="{{c2}}" stroke-width="1.5"/>

    <!-- Security Micro-Hatch Pattern in Bottom Stub -->
    <g stroke="{{c3}}" stroke-width="1" opacity="0.4">
      <line x1="45" y1="365" x2="65" y2="385"/>
      <line x1="55" y1="365" x2="75" y2="385"/>
      <line x1="65" y1="365" x2="85" y2="385"/>
      <line x1="75" y1="365" x2="95" y2="385"/>
    </g>

    <!-- Stub Barcode / Line art representation -->
    <g stroke="{{c1}}" stroke-width="2">
      <line x1="180" y1="360" x2="180" y2="385"/>
      <line x1="186" y1="360" x2="186" y2="385" stroke-width="1"/>
      <line x1="192" y1="360" x2="192" y2="385" stroke-width="3"/>
      <line x1="200" y1="360" x2="200" y2="385" stroke-width="1.5"/>
      <line x1="206" y1="360" x2="206" y2="385" stroke-width="2.5"/>
      <line x1="214" y1="360" x2="214" y2="385" stroke-width="1"/>
      <line x1="220" y1="360" x2="220" y2="385" stroke-width="3"/>
      <line x1="228" y1="360" x2="228" y2="385" stroke-width="1.5"/>
      <line x1="236" y1="360" x2="236" y2="385"/>
      <line x1="244" y1="360" x2="244" y2="385" stroke-width="2.5"/>
      <line x1="252" y1="360" x2="252" y2="385" stroke-width="1"/>
      <line x1="258" y1="360" x2="258" y2="385" stroke-width="3"/>
    </g>

    <!-- Corner Alignment Crosshairs -->
    <g stroke="{{c2}}" stroke-width="1.2">
      <!-- Top Left -->
      <line x1="48" y1="58" x2="58" y2="58"/>
      <line x1="53" y1="53" x2="53" y2="63"/>
      <!-- Top Right -->
      <line x1="262" y1="58" x2="272" y2="58"/>
      <line x1="267" y1="53" x2="267" y2="63"/>
      <!-- Bottom Left -->
      <line x1="48" y1="310" x2="58" y2="310"/>
      <line x1="53" y1="305" x2="53" y2="315"/>
      <!-- Bottom Right -->
      <line x1="262" y1="310" x2="272" y2="310"/>
      <line x1="267" y1="305" x2="267" y2="315"/>
    </g>

    <!-- VIP / Official Crest Dot in stub -->
    <circle cx="130" cy="372" r="9" stroke="{{c2}}" stroke-width="1.5" fill="none"/>
    <circle cx="130" cy="372" r="5" fill="{{c1}}"/>
    <circle cx="130" cy="372" r="2" fill="{{c2}}"/>
  </g>
</svg>
