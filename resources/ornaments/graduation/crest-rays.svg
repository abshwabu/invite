<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- Heraldic Academic Achievement Crest with Radiating Sunburst Rays -->
  <g class="crest-rays" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Point: (160, 160) -->
    
    <!-- Radiating Sunburst Beam Rays in the background -->
    <g class="rays" opacity="0.75">
      <!-- 16 Sunburst spikes -->
      <!-- Top / Cardinal rays -->
      <polygon points="160,160 156,25 160,16 164,25" fill="{{c2}}"/>
      <polygon points="160,160 295,156 304,160 295,164" fill="{{c2}}"/>
      <polygon points="160,160 164,295 160,304 156,295" fill="{{c2}}"/>
      <polygon points="160,160 25,164 16,160 25,156" fill="{{c2}}"/>
      
      <!-- Diagonal rays -->
      <polygon points="160,160 252,60 262,58 258,68" fill="{{c3}}"/>
      <polygon points="160,160 258,252 262,262 252,258" fill="{{c3}}"/>
      <polygon points="160,160 68,258 58,262 60,252" fill="{{c3}}"/>
      <polygon points="160,160 60,68 58,58 68,60" fill="{{c3}}"/>

      <!-- Secondary intermediate rays -->
      <polygon points="160,160 208,40 214,36 214,44" fill="{{c2}}" opacity="0.6"/>
      <polygon points="160,160 280,106 284,106 280,114" fill="{{c2}}" opacity="0.6"/>
      <polygon points="160,160 280,214 284,214 280,206" fill="{{c2}}" opacity="0.6"/>
      <polygon points="160,160 214,280 214,284 208,280" fill="{{c2}}" opacity="0.6"/>
      <polygon points="160,160 112,280 106,284 106,280" fill="{{c2}}" opacity="0.6"/>
      <polygon points="160,160 40,214 36,214 40,206" fill="{{c2}}" opacity="0.6"/>
      <polygon points="160,160 40,106 36,106 40,114" fill="{{c2}}" opacity="0.6"/>
      <polygon points="160,160 106,40 106,36 112,40" fill="{{c2}}" opacity="0.6"/>
    </g>

    <!-- Outer Decorative Concentric Rings -->
    <circle cx="160" cy="160" r="112" stroke="{{c2}}" stroke-width="2" stroke-dasharray="3 6"/>
    <circle cx="160" cy="160" r="102" stroke="{{c1}}" stroke-width="1.8"/>

    <!-- Academic Shield / Escutcheon -->
    <g class="shield">
      <!-- Shadow -->
      <path d="M106 100 C106 172 134 206 162 222 C190 206 218 172 218 100 L162 82 Z" fill="{{c3}}" opacity="0.35"/>
      <!-- Main Shield Face -->
      <path d="M104 96 C104 168 132 202 160 218 C188 202 216 168 216 96 L160 78 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>
      <!-- Inner Gold Rim border -->
      <path d="M112 102 C112 164 136 194 160 208 C184 194 208 164 208 102 L160 88 Z" stroke="{{c2}}" stroke-width="2" fill="none"/>

      <!-- Shield Division (Quartered / Chevron) -->
      <!-- Left half shaded -->
      <path d="M160 88 L112 102 C112 164 136 194 160 208 Z" fill="{{c1}}" opacity="0.12"/>
      
      <!-- Mortarboard Icon Inside Shield -->
      <polygon points="160,115 186,128 160,141 134,128" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.5"/>
      <path d="M148 136 C148 144 154 148 160 148 C166 148 172 144 172 136" stroke="{{c1}}" stroke-width="1.5" fill="none"/>
      <!-- Tiny tassel inside shield -->
      <path d="M160 128 C168 128 174 132 176 138 L176 144" stroke="{{c2}}" stroke-width="1.2" fill="none"/>
      <circle cx="176" cy="144" r="1" fill="{{c1}}"/>

      <!-- Three Stars of Excellence in bottom of shield -->
      <polygon points="160,166 162,171 167,171 163,174 165,179 160,176 155,179 157,174 153,171 158,171" fill="{{c2}}"/>
      <polygon points="144,158 145.5,162 149.5,162 146.5,164.5 148,168.5 144,166 140,168.5 141.5,164.5 138.5,162 142.5,162" fill="{{c2}}" opacity="0.8"/>
      <polygon points="176,158 177.5,162 181.5,162 178.5,164.5 180,168.5 176,166 172,168.5 173.5,164.5 170.5,162 174.5,162" fill="{{c2}}" opacity="0.8"/>
    </g>

    <!-- Star Crown / Coronet atop shield -->
    <g class="crown" transform="translate(160, 68)">
      <path d="M-28 6 L-24 -8 L-10 0 L0 -14 L10 0 L24 -8 L28 6 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5"/>
      <circle cx="-24" cy="-8" r="2.5" fill="{{c1}}"/>
      <circle cx="0" cy="-14" r="3" fill="{{c1}}"/>
      <circle cx="24" cy="-8" r="2.5" fill="{{c1}}"/>
      <rect x="-28" y="6" width="56" height="4" rx="2" fill="{{c1}}"/>
    </g>

    <!-- Bottom Ribbon Scroll Banner -->
    <g class="banner" transform="translate(160, 230)">
      <path d="M-60 0 C-20 6 20 6 60 0 L54 16 C18 22 -18 22 -54 16 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="2"/>
      <!-- Banner swallowtails left/right -->
      <path d="M-60 0 L-76 -4 L-68 8 L-78 18 L-54 16 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.5"/>
      <path d="M60 0 L76 -4 L68 8 L78 18 L54 16 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.5"/>
      <!-- Central Laurel Knot -->
      <circle cx="0" cy="9" r="4" fill="{{c1}}"/>
    </g>
  </g>
</svg>
