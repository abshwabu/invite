<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" fill="none">
  <!-- Angled academic diploma scroll roll with ribbon and medallion -->
  <g class="diploma-roll" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shadow beneath roll -->
    <ellipse cx="140" cy="180" rx="90" ry="12" fill="{{c3}}" opacity="0.3" transform="rotate(-15 140 180)"/>

    <g class="roll-body" transform="rotate(-15 140 120)">
      <!-- Left Rolled End (Parchment lip) -->
      <g class="left-edge">
        <ellipse cx="50" cy="120" rx="12" ry="40" fill="{{c3}}" stroke="{{c1}}" stroke-width="2.5"/>
        <ellipse cx="50" cy="120" rx="8" ry="32" fill="#FFFFFF" stroke="{{c2}}" stroke-width="1.5"/>
        <path d="M48 95 C52 95 54 105 54 120 C54 135 52 145 48 145" stroke="{{c1}}" stroke-width="1.5" fill="none"/>
      </g>

      <!-- Main Cylinder -->
      <path d="M50 80 L230 80 C238 80 244 98 244 120 C244 142 238 160 230 160 L50 160 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
      <!-- Soft shading on cylinder -->
      <path d="M50 148 L230 148 C236 148 242 136 242 120 C242 104 236 92 230 92 L50 92 Z" fill="{{c2}}" opacity="0.12"/>

      <!-- Right Rolled Edge -->
      <path d="M230 80 C238 80 244 98 244 120 C244 142 238 160 230 160" stroke="{{c1}}" stroke-width="2.5" fill="none"/>

      <!-- Certificate Script / Text line indications -->
      <line x1="75" y1="102" x2="115" y2="102" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="2 3"/>
      <line x1="75" y1="112" x2="105" y2="112" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="2 3"/>
      <line x1="165" y1="102" x2="205" y2="102" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="2 3"/>
      <line x1="170" y1="112" x2="210" y2="112" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="2 3"/>

      <!-- Ribbon Band around the center of the roll -->
      <rect x="128" y="79" width="24" height="82" rx="2" fill="{{c1}}" stroke="{{c2}}" stroke-width="2"/>
      <line x1="134" y1="80" x2="134" y2="160" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>

      <!-- Tied Ribbon Tail Streams -->
      <path d="M136 130 C125 152 110 174 105 192 L114 189 L122 198 C128 178 138 152 142 132 Z" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.5"/>
      <path d="M144 130 C155 152 170 174 175 192 L166 189 L158 198 C152 178 142 152 138 132 Z" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.5"/>

      <!-- Central Seal Medallion -->
      <circle cx="140" cy="120" r="16" fill="{{c2}}" stroke="{{c1}}" stroke-width="2"/>
      <circle cx="140" cy="120" r="12" fill="{{c1}}"/>
      <circle cx="140" cy="120" r="10" stroke="{{c3}}" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
      <!-- Star on Medallion -->
      <polygon points="140,113 142,118 147,118 143,121 145,126 140,123 135,126 137,121 133,118 138,118" fill="{{c2}}"/>
    </g>

    <!-- Academic achievement rays / sparkles -->
    <path d="M50 45 Q50 52 56 52 Q50 52 50 58 Q50 52 44 52 Q50 52 50 45 Z" fill="{{c2}}"/>
    <path d="M230 45 Q230 52 236 52 Q230 52 230 58 Q230 52 224 52 Q230 52 230 45 Z" fill="{{c2}}"/>
    <circle cx="72" cy="36" r="2.5" fill="{{c1}}"/>
    <circle cx="210" cy="36" r="2.5" fill="{{c1}}"/>
  </g>
</svg>
