<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center base origin at (120, 150) -->

    <!-- Base stepped pedestal brackets (c1, c2, c3) -->
    <path d="M96,150 L96,144 L144,144 L144,150 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
    <path d="M102,144 L102,138 L138,138 L138,144 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.2" />
    <path d="M108,138 L108,132 L132,132 L132,138 Z" fill="{{c3}}" opacity="0.8" stroke="{{c1}}" stroke-width="1" />
    <polygon points="120,118 126,132 114,132" fill="{{c1}}" />

    <!-- Outermost Fan Plumes (Radiating from 120, 135) -->
    <!-- Far Left Plume (-72 deg) -->
    <path d="M120,135 L30,130 C45,115 65,108 85,112 Z" fill="{{c3}}" opacity="0.45" stroke="{{c1}}" stroke-width="1.3" />
    <!-- Far Right Plume (+72 deg) -->
    <path d="M120,135 L210,130 C195,115 175,108 155,112 Z" fill="{{c3}}" opacity="0.45" stroke="{{c1}}" stroke-width="1.3" />

    <!-- Outer-Mid Left Plume (-54 deg) -->
    <path d="M120,135 L42,92 C60,78 82,75 100,86 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.3" />
    <!-- Outer-Mid Right Plume (+54 deg) -->
    <path d="M120,135 L198,92 C180,78 158,75 140,86 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.3" />

    <!-- Mid Left Plume (-36 deg) -->
    <path d="M120,135 L65,58 C84,48 102,52 112,68 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.4" />
    <path d="M120,135 L75,68" stroke="{{c3}}" stroke-width="1" />
    <!-- Mid Right Plume (+36 deg) -->
    <path d="M120,135 L175,58 C156,48 138,52 128,68 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.4" />
    <path d="M120,135 L165,68" stroke="{{c3}}" stroke-width="1" />

    <!-- Inner Left Plume (-18 deg) -->
    <path d="M120,135 L94,32 C108,26 122,28 122,46 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.4" />
    <!-- Inner Right Plume (+18 deg) -->
    <path d="M120,135 L146,32 C132,26 118,28 118,46 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.4" />

    <!-- Central Majestic Center Plume (0 deg vertical) -->
    <path d="M112,135 L112,42 C112,24 120,14 120,14 C120,14 128,24 128,42 L128,135 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.8" />
    <line x1="120" y1="18" x2="120" y2="120" stroke="{{c3}}" stroke-width="1.4" />

    <!-- Stepped Chevron Inlays across the fan -->
    <path d="M80,120 L120,85 L160,120" stroke="{{c1}}" stroke-width="2" />
    <path d="M88,124 L120,95 L152,124" stroke="{{c2}}" stroke-width="1.4" />
    <path d="M96,128 L120,105 L144,128" stroke="{{c3}}" stroke-width="1.2" />

    <!-- Concentric Sunburst Arc Rays -->
    <path d="M50,135 C50,96 81,65 120,65 C159,65 190,96 190,135" stroke="{{c2}}" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
    <path d="M35,135 C35,88 73,50 120,50 C167,50 205,88 205,135" stroke="{{c1}}" stroke-width="1" stroke-dasharray="2,4" opacity="0.5" />

    <!-- Diamond Finials on Plume Tips -->
    <polygon points="120,10 124,14 120,18 116,14" fill="{{c1}}" />
    <polygon points="94,28 97,32 94,36 91,32" fill="{{c2}}" />
    <polygon points="146,28 149,32 146,36 143,32" fill="{{c2}}" />
    <polygon points="65,54 68,58 65,62 62,58" fill="{{c1}}" />
    <polygon points="175,54 178,58 175,62 172,58" fill="{{c1}}" />
    <polygon points="42,88 45,92 42,96 39,92" fill="{{c2}}" />
    <polygon points="198,88 201,92 198,96 195,92" fill="{{c2}}" />
    <polygon points="28,127 31,130 28,133 25,130" fill="{{c3}}" />
    <polygon points="212,127 215,130 212,133 209,130" fill="{{c3}}" />
  </g>
</svg>
