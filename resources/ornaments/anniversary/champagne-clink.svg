<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Glass tilted right at ~18 deg -->
    <g transform="translate(80, 120) rotate(16)">
      <!-- Champagne liquid (c2) -->
      <path d="M-14,-50 C-14,-20 -8,-2 0,10 C8,-2 14,-20 14,-50 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="0.8" />
      <ellipse cx="0" cy="-50" rx="14" ry="4" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="0.8" />

      <!-- Crystal glass bowl outline -->
      <path d="M-16,-75 C-16,-30 -10,0 0,15 C10,0 16,-30 16,-75" stroke="{{c1}}" stroke-width="2" />
      <ellipse cx="0" cy="-75" rx="16" ry="4.5" stroke="{{c1}}" stroke-width="1.8" />

      <!-- Highlight reflection -->
      <path d="M-12,-70 C-12,-35 -8,-5 -1,8" stroke="{{c3}}" stroke-width="1.2" opacity="0.8" />

      <!-- Stem -->
      <line x1="0" y1="15" x2="0" y2="70" stroke="{{c1}}" stroke-width="2.5" />
      <!-- Base foot -->
      <ellipse cx="0" cy="72" rx="22" ry="6" fill="{{c3}}" opacity="0.3" stroke="{{c1}}" stroke-width="2" />
      <ellipse cx="0" cy="72" rx="14" ry="3.5" stroke="{{c2}}" stroke-width="0.8" />

      <!-- Ribbon Bow on stem -->
      <path d="M0,35 C-8,30 -14,35 -10,40 C-6,44 0,38 0,35 Z" fill="{{c1}}" />
      <path d="M0,35 C8,30 14,35 10,40 C6,44 0,38 0,35 Z" fill="{{c1}}" />
      <circle cx="0" cy="36" r="2" fill="{{c2}}" />
    </g>

    <!-- Right Glass tilted left at ~18 deg -->
    <g transform="translate(140, 120) rotate(-16)">
      <!-- Champagne liquid (c2) -->
      <path d="M-14,-50 C-14,-20 -8,-2 0,10 C8,-2 14,-20 14,-50 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="0.8" />
      <ellipse cx="0" cy="-50" rx="14" ry="4" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="0.8" />

      <!-- Crystal glass bowl outline -->
      <path d="M-16,-75 C-16,-30 -10,0 0,15 C10,0 16,-30 16,-75" stroke="{{c1}}" stroke-width="2" />
      <ellipse cx="0" cy="-75" rx="16" ry="4.5" stroke="{{c1}}" stroke-width="1.8" />

      <!-- Highlight reflection -->
      <path d="M12,-70 C12,-35 8,-5 1,8" stroke="{{c3}}" stroke-width="1.2" opacity="0.8" />

      <!-- Stem -->
      <line x1="0" y1="15" x2="0" y2="70" stroke="{{c1}}" stroke-width="2.5" />
      <!-- Base foot -->
      <ellipse cx="0" cy="72" rx="22" ry="6" fill="{{c3}}" opacity="0.3" stroke="{{c1}}" stroke-width="2" />
      <ellipse cx="0" cy="72" rx="14" ry="3.5" stroke="{{c2}}" stroke-width="0.8" />

      <!-- Ribbon Bow on stem -->
      <path d="M0,35 C-8,30 -14,35 -10,40 C-6,44 0,38 0,35 Z" fill="{{c1}}" />
      <path d="M0,35 C8,30 14,35 10,40 C6,44 0,38 0,35 Z" fill="{{c1}}" />
      <circle cx="0" cy="36" r="2" fill="{{c2}}" />
    </g>

    <!-- Clink Sparkle at contact point (around x=110, y=55) -->
    <path d="M110,38 L112,48 L122,50 L112,52 L110,62 L108,52 L98,50 L108,48 Z" fill="{{c1}}" />
    <path d="M110,44 L111.5,48.5 L116,50 L111.5,51.5 L110,56 L108.5,51.5 L104,50 L108.5,48.5 Z" fill="{{c2}}" />
    <circle cx="110" cy="50" r="3" fill="{{c3}}" />

    <!-- Effervescent bubbles erupting upwards -->
    <circle cx="104" cy="30" r="2.2" fill="{{c1}}" />
    <circle cx="116" cy="24" r="1.8" fill="{{c2}}" />
    <circle cx="110" cy="16" r="2.5" fill="{{c1}}" />
    <circle cx="98" cy="20" r="1.4" fill="{{c3}}" />
    <circle cx="124" cy="18" r="1.5" fill="{{c2}}" />
    <circle cx="112" cy="6" r="1.8" fill="{{c1}}" />
    <circle cx="106" cy="2" r="1.2" fill="{{c3}}" />

    <!-- Bubbles rising inside glasses -->
    <circle cx="82" cy="75" r="1.5" fill="{{c1}}" />
    <circle cx="85" cy="85" r="1.2" fill="{{c3}}" />
    <circle cx="78" cy="95" r="1.6" fill="{{c2}}" />
    <circle cx="138" cy="75" r="1.5" fill="{{c1}}" />
    <circle cx="135" cy="85" r="1.2" fill="{{c3}}" />
    <circle cx="142" cy="95" r="1.6" fill="{{c2}}" />
  </g>
</svg>
