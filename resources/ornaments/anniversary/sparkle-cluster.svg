<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Soft radiant halo rings (c3) -->
    <circle cx="100" cy="100" r="42" stroke="{{c3}}" stroke-width="1" stroke-dasharray="2,4" opacity="0.5" />
    <circle cx="100" cy="100" r="68" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="1.5,4" opacity="0.35" />

    <!-- Center Primary 8-Point Faceted Diamond Star (cx=100, cy=100) -->
    <!-- Vertical and Horizontal primary spikes -->
    <path d="M100,45 L104,88 L147,92 L106,100 L147,108 L104,112 L100,155 L96,112 L53,108 L94,100 L53,92 L96,88 Z" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Diagonal secondary spikes -->
    <path d="M100,70 L108,92 L130,100 L108,108 L100,130 L92,108 L70,100 L92,92 Z" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="0.8" />
    <!-- Inner diamond facet core -->
    <path d="M100,88 L112,100 L100,112 L88,100 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
    <circle cx="100" cy="100" r="3.5" fill="{{c1}}" />

    <!-- Secondary Star Upper-Right (cx=150, cy=55) -->
    <g transform="translate(150, 55)">
      <path d="M0,-30 L3,-8 L25,-4 L5,3 L20,24 L0,7 L-20,24 L-5,3 L-25,-4 L-3,-8 Z" fill="{{c2}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.1" />
      <path d="M0,-15 L4,-4 L15,0 L4,4 L0,15 L-4,4 L-15,0 L-4,-4 Z" fill="{{c1}}" />
      <circle cx="0" cy="0" r="2.2" fill="{{c3}}" />
    </g>

    <!-- Secondary Star Lower-Left (cx=50, cy=145) -->
    <g transform="translate(50, 145)">
      <path d="M0,-28 L3,-7 L24,-3 L5,3 L18,22 L0,6 L-18,22 L-5,3 L-24,-3 L-3,-7 Z" fill="{{c2}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.1" />
      <path d="M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4 Z" fill="{{c1}}" />
      <circle cx="0" cy="0" r="2.2" fill="{{c3}}" />
    </g>

    <!-- 4-Point Accent Star Upper-Left (cx=45, cy=48) -->
    <path d="M45,28 L47.5,43 L62.5,45.5 L47.5,48 L45,63 L42.5,48 L27.5,45.5 L42.5,43 Z" fill="{{c1}}" />
    <circle cx="45" cy="45.5" r="1.8" fill="{{c2}}" />

    <!-- 4-Point Accent Star Lower-Right (cx=155, cy=150) -->
    <path d="M155,132 L157.5,147 L172.5,149.5 L157.5,152 L155,167 L152.5,152 L137.5,149.5 L152.5,147 Z" fill="{{c1}}" />
    <circle cx="155" cy="149.5" r="1.8" fill="{{c2}}" />

    <!-- Mid-size 4-Point Star (cx=115, cy=25) -->
    <path d="M115,14 L116.5,23.5 L126,25 L116.5,26.5 L115,36 L113.5,26.5 L104,25 L113.5,23.5 Z" fill="{{c2}}" />

    <!-- Mid-size 4-Point Star (cx=85, cy=175) -->
    <path d="M85,164 L86.5,173.5 L96,175 L86.5,176.5 L85,186 L83.5,176.5 L74,175 L83.5,173.5 Z" fill="{{c2}}" />

    <!-- Shimmering satellite diamonds and spark dots -->
    <path d="M72,68 L74,64 L76,68 L80,70 L76,72 L74,76 L72,72 L68,70 Z" fill="{{c1}}" />
    <path d="M128,132 L130,128 L132,132 L136,134 L132,136 L130,140 L128,136 L124,134 Z" fill="{{c1}}" />
    <path d="M168,105 L170,102 L172,105 L175,106.5 L172,108 L170,111 L168,108 L165,106.5 Z" fill="{{c3}}" />
    <path d="M32,95 L34,92 L36,95 L39,96.5 L36,98 L34,101 L32,98 L29,96.5 Z" fill="{{c3}}" />

    <!-- Tiny glowing round dust dots -->
    <circle cx="82" cy="40" r="2.2" fill="{{c1}}" />
    <circle cx="132" cy="42" r="1.6" fill="{{c2}}" />
    <circle cx="180" cy="78" r="2" fill="{{c1}}" />
    <circle cx="172" cy="128" r="1.5" fill="{{c2}}" />
    <circle cx="138" cy="172" r="2" fill="{{c1}}" />
    <circle cx="62" cy="162" r="1.8" fill="{{c2}}" />
    <circle cx="22" cy="120" r="1.6" fill="{{c1}}" />
    <circle cx="34" cy="72" r="1.5" fill="{{c2}}" />
    <circle cx="95" cy="15" r="1.4" fill="{{c3}}" />
    <circle cx="105" cy="188" r="1.6" fill="{{c3}}" />
  </g>
</svg>
