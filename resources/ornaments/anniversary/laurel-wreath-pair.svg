    <g transform="translate(254, 75) rotate(110)">
      <path d="M0,0 C-15,-12 -32,-8 -36,6 C-24,14 -10,10 0,0 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.1" />
