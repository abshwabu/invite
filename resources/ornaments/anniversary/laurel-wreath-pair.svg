    <g transform="translate(225, 180) rotate(40)">
      <path d="M0,0 C-15,-12 -32,-8 -36,6 C-24,14 -10,10 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.1" />
