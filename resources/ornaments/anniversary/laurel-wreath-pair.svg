    <path d="M140,215 C102,214 46,182 42,125 C38,80 80,36 120,24" stroke="{{c2}}" stroke-width="1" opacity="0.6" stroke-dasharray="2,3" />

    <!-- Left branch leaves (curved pairs along the stem) -->
