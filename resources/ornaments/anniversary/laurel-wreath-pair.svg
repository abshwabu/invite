    <g transform="translate(118, 205) rotate(165)">
      <path d="M0,0 C12,-10 28,-6 32,6 C22,12 10,10 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.1" />
      <path d="M0,0 C12,-1 22,2 32,6" stroke="{{c1}}" stroke-width="0.7" />
    </g>
    <g transform="translate(105, 195) rotate(-160)">
      <path d="M0,0 C14,-10 30,-6 34,6 C22,12 10,8 0,0 Z" fill="{{c3}}" opacity="0.55" stroke="{{c1}}" stroke-width="1.1" />
