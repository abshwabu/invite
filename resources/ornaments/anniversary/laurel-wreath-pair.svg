      <path d="M-6,8 C-16,18 -32,22 -44,20 C-36,14 -22,12 -12,4" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M6,8 C16,18 32,22 44,20 C36,14 22,12 12,4" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1.2" />
      <!-- Ribbon loops -->
      <path d="M0,0 C-12,-16 -30,-12 -32,0 C-32,10 -16,12 0,4 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.3" />
      <path d="M0,0 C12,-16 30,-12 32,0 C32,10 16,12 0,4 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.3" />
