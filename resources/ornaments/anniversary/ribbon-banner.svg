<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shaded Underfolds / Back Folds (c3 shadow) -->
    <!-- Left underfold triangle -->
    <path d="M55,48 L80,48 L80,68 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Right underfold triangle -->
    <path d="M305,48 L280,48 L280,68 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Left Tail (Behind center banner) -->
    <path d="M80,48 L20,48 L38,65 L15,82 L80,82 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.6" />
    <path d="M78,54 L32,54 L44,65 L28,76 L78,76" stroke="{{c1}}" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6" />

    <!-- Right Tail (Behind center banner) -->
    <path d="M280,48 L340,48 L322,65 L345,82 L280,82 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.6" />
    <path d="M282,54 L328,54 L316,65 L332,76 L282,76" stroke="{{c1}}" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6" />

    <!-- Main Front Banner (Gently arched ribbon body) -->
    <!-- Top arch: (70, 36) -> (180, 26) -> (290, 36) -->
    <!-- Bottom arch: (70, 68) -> (180, 58) -> (290, 68) -->
    <path d="M70,36 C120,24 240,24 290,36 L290,68 C240,56 120,56 70,68 Z" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="2.2" />
    <path d="M73,39 C122,27 238,27 287,39 L287,65 C238,53 122,53 73,65 Z" fill="{{c2}}" opacity="0.25" stroke="{{c3}}" stroke-width="1" />

    <!-- Inner decorative border line -->
    <path d="M78,42 C125,31 235,31 282,42" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="3,2" />
    <path d="M78,62 C125,51 235,51 282,62" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="3,2" />

    <!-- Corner fold creases -->
    <path d="M70,36 L80,48" stroke="{{c1}}" stroke-width="1.8" />
    <path d="M290,36 L280,48" stroke="{{c1}}" stroke-width="1.8" />

    <!-- Decorative flourishes on ribbon tips -->
    <circle cx="180" cy="30" r="2.2" fill="{{c3}}" />
    <circle cx="180" cy="64" r="2.2" fill="{{c3}}" />
    <circle cx="120" cy="33" r="1.6" fill="{{c3}}" />
    <circle cx="240" cy="33" r="1.6" fill="{{c3}}" />
  </g>
</svg>
