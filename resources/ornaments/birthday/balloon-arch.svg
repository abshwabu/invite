    <circle cx="170" cy="40" r="2.5" fill="{{c3}}" />

    <!-- Upper Right (220, 68) -->
    <ellipse cx="220" cy="68" rx="25" ry="30" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="2" />
    <path d="M206,52 C212,44 226,42 234,46" stroke="{{c3}}" stroke-width="2.2" />

