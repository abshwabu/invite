    <path d="M85,42 L86.5,38 L88,42 L92,43.5 L88,45 L86.5,49 L85,45 L81,43.5 Z" fill="{{c1}}" />
    <path d="M275,42 L276.5,38 L278,42 L282,43.5 L278,45 L276.5,49 L275,45 L271,43.5 Z" fill="{{c1}}" />
