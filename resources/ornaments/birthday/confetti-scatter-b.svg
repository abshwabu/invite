<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center of burst at (100, 100) -->

    <!-- Radial Burst Dash Lines (radiating outward) -->
    <line x1="100" y1="75" x2="100" y2="55" stroke="{{c1}}" stroke-width="2" />
    <line x1="118" y1="82" x2="135" y2="65" stroke="{{c2}}" stroke-width="2" />
    <line x1="125" y1="100" x2="145" y2="100" stroke="{{c3}}" stroke-width="2" />
    <line x1="118" y1="118" x2="135" y2="135" stroke="{{c1}}" stroke-width="2" />
    <line x1="100" y1="125" x2="100" y2="145" stroke="{{c2}}" stroke-width="2" />
    <line x1="82" y1="118" x2="65" y2="135" stroke="{{c3}}" stroke-width="2" />
    <line x1="75" y1="100" x2="55" y2="100" stroke="{{c1}}" stroke-width="2" />
    <line x1="82" y1="82" x2="65" y2="65" stroke="{{c2}}" stroke-width="2" />

    <!-- Center Exploding 8-Point Star Core (100, 100) -->
    <path d="M100,86 L103,96 L114,100 L103,104 L100,114 L97,104 L86,100 L97,96 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
    <circle cx="100" cy="100" r="3" fill="{{c3}}" />

    <!-- Radiating Serpentine Streamers -->
    <path d="M125,55 C140,42 135,28 152,24 C165,20 162,35 174,32" stroke="{{c1}}" stroke-width="2.2" />
    <path d="M75,55 C60,42 65,28 48,24 C35,20 38,35 26,32" stroke="{{c2}}" stroke-width="2.2" />
    <path d="M145,120 C162,130 155,148 170,160 C182,170 172,182 185,188" stroke="{{c2}}" stroke-width="2" />
    <path d="M55,120 C38,130 45,148 30,160 C18,170 28,182 15,188" stroke="{{c3}}" stroke-width="2" />

    <!-- Tilted Confetti Diamonds -->
    <polygon points="100,28 106,36 100,44 94,36" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="172,94 178,100 172,106 166,100" fill="{{c1}}" stroke="{{c2}}" stroke-width="0.8" />
    <polygon points="100,156 106,164 100,172 94,164" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="28,94 34,100 28,106 22,100" fill="{{c2}}" stroke="{{c3}}" stroke-width="0.8" />

    <polygon points="145,75 151,80 147,87 141,82" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="55,125 61,130 57,137 51,132" fill="{{c1}}" stroke="{{c2}}" stroke-width="0.8" />

    <!-- Sparkle Stars -->
    <path d="M50,45 L51.5,40 L53,45 L58,46.5 L53,48 L51.5,53 L50,48 L45,46.5 Z" fill="{{c1}}" />
    <path d="M150,145 L151.5,140 L153,145 L158,146.5 L153,148 L151.5,153 L150,148 L145,146.5 Z" fill="{{c1}}" />
    <path d="M155,50 L156.5,46 L158,50 L162,51.5 L158,53 L156.5,57 L155,53 L151,51.5 Z" fill="{{c3}}" />
    <path d="M45,150 L46.5,146 L48,150 L52,151.5 L48,153 L46.5,157 L45,153 L41,151.5 Z" fill="{{c2}}" />

    <!-- Exploding Confetti Circular Beads -->
    <circle cx="100" cy="18" r="2.8" fill="{{c1}}" />
    <circle cx="182" cy="100" r="2.8" fill="{{c3}}" />
    <circle cx="100" cy="182" r="2.8" fill="{{c2}}" />
    <circle cx="18" cy="100" r="2.8" fill="{{c1}}" />
    <circle cx="70" cy="40" r="2.2" fill="{{c3}}" />
    <circle cx="130" cy="40" r="2.2" fill="{{c2}}" />
    <circle cx="160" cy="70" r="2.5" fill="{{c1}}" />
    <circle cx="160" cy="130" r="2.5" fill="{{c3}}" />
    <circle cx="130" cy="160" r="2.2" fill="{{c1}}" />
    <circle cx="70" cy="160" r="2.2" fill="{{c2}}" />
    <circle cx="40" cy="130" r="2.5" fill="{{c1}}" />
    <circle cx="40" cy="70" r="2.5" fill="{{c3}}" />
