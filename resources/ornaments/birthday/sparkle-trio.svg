<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- STAR 1: Large Primary 8-Point Star (Center 70, 70, radius 46) -->
    <!-- Soft Aura Ring -->
    <circle cx="70" cy="70" r="38" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.45" />

    <!-- Faceted Cardinal Spikes -->
    <!-- Top Spike -->
    <polygon points="70,24 74,62 70,70" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="70,24 66,62 70,70" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Bottom Spike -->
    <polygon points="70,116 74,78 70,70" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="70,116 66,78 70,70" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Right Spike -->
    <polygon points="116,70 78,66 70,70" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="116,70 78,74 70,70" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Left Spike -->
    <polygon points="24,70 62,66 70,70" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="24,70 62,74 70,70" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Diagonal Spikes for Star 1 (radius 30) -->
    <polygon points="91,49 76,64 70,70 76,76" fill="{{c3}}" opacity="0.75" />
    <polygon points="91,91 76,76 70,70 64,76" fill="{{c3}}" opacity="0.75" />
    <polygon points="49,91 64,76 70,70 64,64" fill="{{c3}}" opacity="0.75" />
    <polygon points="49,49 64,64 70,70 76,64" fill="{{c3}}" opacity="0.75" />

    <!-- Star 1 Center Core -->
    <circle cx="70" cy="70" r="10" fill="{{c1}}" stroke="{{c3}}" stroke-width="1.2" />
    <circle cx="70" cy="70" r="4.5" fill="{{c2}}" />
    <circle cx="70" cy="70" r="1.8" fill="{{c3}}" />

    <!-- STAR 2: Medium 4-Point Star (Upper-Right: Center 125, 38, radius 28) -->
    <g transform="translate(125, 38)">
      <polygon points="0,-26 3,-8 26,0 3,8 0,26 -3,8 -26,0 -3,-8" fill="{{c2}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.2" />
      <!-- Star 2 Facets -->
      <polygon points="0,-26 0,0 26,0" fill="{{c1}}" opacity="0.4" />
      <polygon points="0,26 0,0 -26,0" fill="{{c1}}" opacity="0.4" />
      <circle cx="0" cy="0" r="5" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
      <circle cx="0" cy="0" r="2" fill="{{c1}}" />
    </g>

    <!-- STAR 3: Small 4-Point Star (Lower-Right: Center 120, 122, radius 20) -->
    <g transform="translate(120, 122)">
      <polygon points="0,-18 2.5,-6 18,0 2.5,6 0,18 -2.5,6 -18,0 -2.5,-6" fill="{{c3}}" opacity="0.95" stroke="{{c1}}" stroke-width="1" />
      <circle cx="0" cy="0" r="3.5" fill="{{c2}}" />
      <circle cx="0" cy="0" r="1.5" fill="{{c1}}" />
    </g>

    <!-- Radiating Sparkle Dots & Pearls around the trio -->
    <circle cx="28" cy="30" r="2" fill="{{c1}}" />
    <circle cx="140" cy="80" r="2.2" fill="{{c1}}" />
    <circle cx="35" cy="115" r="1.8" fill="{{c2}}" />
    <circle cx="95" cy="140" r="2" fill="{{c2}}" />
    <circle cx="145" cy="145" r="1.5" fill="{{c3}}" />
    <circle cx="85" cy="20" r="1.5" fill="{{c3}}" />
    <circle cx="110" cy="18" r="1.8" fill="{{c2}}" />
  </g>
</svg>
