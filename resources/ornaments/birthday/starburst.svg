<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Radiant Halo Circles (Center 100, 100) -->
    <circle cx="100" cy="100" r="85" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.4" />
    <circle cx="100" cy="100" r="68" stroke="{{c2}}" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />
    <circle cx="100" cy="100" r="42" fill="{{c3}}" opacity="0.25" />

    <!-- 12-POINT FACETED STARBURST (Center 100, 100) -->
    <!-- 4 Cardinal Primary Long Spikes (Radius 88) -->
    <!-- Top Spike (100, 12) -->
    <polygon points="100,12 105,72 100,100" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="100,12 95,72 100,100" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Bottom Spike (100, 188) -->
    <polygon points="100,188 105,128 100,100" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="100,188 95,128 100,100" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Right Spike (188, 100) -->
    <polygon points="188,100 128,95 100,100" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="188,100 128,105 100,100" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Left Spike (12, 100) -->
    <polygon points="12,100 72,95 100,100" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="12,100 72,105 100,100" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />

    <!-- 4 Diagonal Medium Spikes (45, 135, 225, 315 deg, Radius 68) -->
    <!-- Top-Right (148, 52) -->
    <polygon points="148,52 118,80 100,100" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    <polygon points="148,52 128,90 100,100" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />

    <!-- Bottom-Right (148, 148) -->
    <polygon points="148,148 128,110 100,100" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    <polygon points="148,148 118,120 100,100" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />

    <!-- Bottom-Left (52, 148) -->
    <polygon points="52,148 82,120 100,100" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    <polygon points="52,148 72,110 100,100" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />

    <!-- Top-Left (52, 52) -->
    <polygon points="52,52 72,90 100,100" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    <polygon points="52,52 82,80 100,100" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />

    <!-- 4 Intermediate Short Spikes (30, 60, 120, 150 deg, Radius 50) -->
    <!-- 30 deg (135, 75) -->
    <polygon points="135,75 115,92 100,100 122,85" fill="{{c1}}" opacity="0.8" />
    <!-- 60 deg (125, 135) -->
    <polygon points="125,135 110,115 100,100 118,122" fill="{{c1}}" opacity="0.8" />
    <!-- 210 deg (65, 125) -->
    <polygon points="65,125 85,108 100,100 78,115" fill="{{c1}}" opacity="0.8" />
    <!-- 330 deg (75, 65) -->
    <polygon points="75,65 90,85 100,100 82,78" fill="{{c1}}" opacity="0.8" />

    <!-- Central Diamond Rosette Core (Center 100, 100) -->
    <circle cx="100" cy="100" r="22" fill="{{c1}}" stroke="{{c3}}" stroke-width="1.8" />
    <circle cx="100" cy="100" r="14" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.2" />
    <circle cx="100" cy="100" r="6" fill="{{c3}}" />
    <circle cx="100" cy="100" r="2.5" fill="{{c1}}" />

    <!-- Satellite Diamond Pearls on Star Tips -->
    <polygon points="100,6 103,10 100,14 97,10" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="100,194 103,190 100,186 97,190" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="194,100 190,103 186,100 190,97" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="6,100 10,103 14,100 10,97" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />

    <!-- Floating Stardust Flecks -->
    <circle cx="130" cy="35" r="2" fill="{{c1}}" />
    <circle cx="70" cy="35" r="2" fill="{{c1}}" />
    <circle cx="165" cy="135" r="2" fill="{{c2}}" />
    <circle cx="35" cy="135" r="2" fill="{{c2}}" />
  </g>
</svg>
