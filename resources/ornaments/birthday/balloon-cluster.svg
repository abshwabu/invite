<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Balloon Strings (Gathering down to 110, 245) -->
    <!-- String 1 (to left back balloon) -->
    <path d="M68,140 C75,170 95,210 110,245" stroke="{{c1}}" stroke-width="1.2" />
    <!-- String 2 (to right back balloon) -->
    <path d="M152,140 C145,170 125,210 110,245" stroke="{{c1}}" stroke-width="1.2" />
    <!-- String 3 (to center top balloon) -->
    <path d="M110,118 L110,245" stroke="{{c2}}" stroke-width="1.4" />
    <!-- String 4 (to left front balloon) -->
    <path d="M86,165 C92,188 102,218 110,245" stroke="{{c1}}" stroke-width="1.4" />
    <!-- String 5 (to right front balloon) -->
    <path d="M134,165 C128,188 118,218 110,245" stroke="{{c1}}" stroke-width="1.4" />

    <!-- Curling Ribbon Streamers dangling below knot -->
    <path d="M110,245 C102,248 98,255 104,258 C110,260 112,252 108,250" stroke="{{c2}}" stroke-width="1.2" />
    <path d="M110,245 C118,248 124,254 118,258 C112,260 114,252 118,250" stroke="{{c3}}" stroke-width="1.2" />

    <!-- Ribbon Knot at Base -->
    <ellipse cx="110" cy="245" rx="5" ry="3.5" fill="{{c1}}" stroke="{{c1}}" stroke-width="1" />
    <circle cx="110" cy="245" r="1.5" fill="{{c3}}" />

    <!-- BALLOONS -->
    <!-- 1. Background Left Balloon (68, 85, c3 shadow) -->
    <g transform="translate(68, 85)">
      <!-- Balloon Knot -->
      <polygon points="0,50 -4,56 4,56" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
      <!-- Balloon Body -->
      <path d="M0,-45 C28,-45 42,-20 40,15 C38,40 15,50 0,50 C-15,50 -38,40 -40,15 C-42,-20 -28,-45 0,-45 Z" fill="{{c3}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.6" />
      <!-- Specular Highlight Arc -->
      <path d="M-22,-25 C-18,-35 -5,-40 5,-40" stroke="{{c2}}" stroke-width="2.5" opacity="0.8" />
    </g>

    <!-- 2. Background Right Balloon (152, 85, c3 shadow) -->
    <g transform="translate(152, 85)">
      <polygon points="0,50 -4,56 4,56" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,-45 C28,-45 42,-20 40,15 C38,40 15,50 0,50 C-15,50 -38,40 -40,15 C-42,-20 -28,-45 0,-45 Z" fill="{{c3}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.6" />
      <path d="M-22,-25 C-18,-35 -5,-40 5,-40" stroke="{{c2}}" stroke-width="2.5" opacity="0.8" />
    </g>

    <!-- 3. Top Center Balloon (110, 60, c2 accent) -->
    <g transform="translate(110, 60)">
      <polygon points="0,52 -4,58 4,58" fill="{{c2}}" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,-48 C30,-48 45,-22 42,16 C40,42 16,52 0,52 C-16,52 -40,42 -42,16 C-45,-22 -30,-48 0,-48 Z" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="2" />
      <!-- Highlight -->
      <path d="M-24,-28 C-20,-38 -6,-42 6,-42" stroke="{{c3}}" stroke-width="3" opacity="0.9" />
      <circle cx="-16" cy="-34" r="2.5" fill="{{c3}}" />
    </g>

    <!-- 4. Foreground Left Balloon (86, 110, c1 main) -->
    <g transform="translate(86, 110)">
      <polygon points="0,48 -4,54 4,54" fill="{{c1}}" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,-42 C26,-42 38,-18 36,14 C34,36 14,48 0,48 C-14,48 -34,36 -36,14 C-38,-18 -26,-42 0,-42 Z" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="2" />
      <path d="M-20,-24 C-16,-32 -4,-36 4,-36" stroke="{{c2}}" stroke-width="2.5" opacity="0.8" />
      <circle cx="-12" cy="-30" r="2" fill="{{c3}}" />
    </g>

    <!-- 5. Foreground Right Balloon (134, 110, c2 main) -->
    <g transform="translate(134, 110)">
      <polygon points="0,48 -4,54 4,54" fill="{{c2}}" stroke="{{c1}}" stroke-width="1" />
      <path d="M0,-42 C26,-42 38,-18 36,14 C34,36 14,48 0,48 C-14,48 -34,36 -36,14 C-38,-18 -26,-42 0,-42 Z" fill="{{c2}}" opacity="0.9" stroke="{{c1}}" stroke-width="2" />
      <path d="M-20,-24 C-16,-32 -4,-36 4,-36" stroke="{{c3}}" stroke-width="2.5" opacity="0.9" />
      <circle cx="-12" cy="-30" r="2" fill="{{c3}}" />
    </g>

    <!-- Floating Confetti Stars -->
    <path d="M34,45 L35.5,41 L37,45 L41,46.5 L37,48 L35.5,52 L34,48 L30,46.5 Z" fill="{{c1}}" />
    <path d="M185,55 L186.5,51 L188,55 L192,56.5 L188,58 L186.5,62 L185,58 L181,56.5 Z" fill="{{c2}}" />
    <circle cx="28" cy="85" r="2" fill="{{c2}}" />
    <circle cx="192" cy="115" r="2" fill="{{c1}}" />
    <circle cx="48" cy="155" r="1.5" fill="{{c3}}" />
    <circle cx="178" cy="165" r="1.5" fill="{{c3}}" />
  </g>
</svg>
