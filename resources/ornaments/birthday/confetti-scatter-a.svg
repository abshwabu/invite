<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Coiled serpentine party ribbon streamers -->
    <!-- Ribbon 1 (Left to center) -->
    <path d="M25,35 C38,20 48,45 35,62 C22,78 45,95 58,82 C72,70 65,110 50,118" stroke="{{c1}}" stroke-width="2.4" />
    <path d="M24,36 C37,22 47,46 34,63 C21,79 44,96 57,83 C71,71 64,111 49,119" stroke="{{c2}}" stroke-width="0.8" opacity="0.6" />

    <!-- Ribbon 2 (Top right to center) -->
    <path d="M175,25 C158,40 178,62 160,78 C142,95 168,115 152,130" stroke="{{c2}}" stroke-width="2.2" />

    <!-- Ribbon 3 (Bottom center sweep) -->
    <path d="M85,140 C105,128 120,155 138,142 C155,130 162,165 178,172" stroke="{{c3}}" stroke-width="2" />

    <!-- Floating Rectangular Ticker-Tape Pieces (Rotated) -->
    <!-- Piece 1 -->
    <g transform="translate(45, 145) rotate(25)">
      <rect x="-8" y="-3.5" width="16" height="7" rx="1.5" fill="{{c1}}" stroke="{{c1}}" stroke-width="0.8" />
    </g>
    <!-- Piece 2 -->
    <g transform="translate(110, 40) rotate(-35)">
      <rect x="-9" y="-4" width="18" height="8" rx="1.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    </g>
    <!-- Piece 3 -->
    <g transform="translate(135, 95) rotate(55)">
      <rect x="-8" y="-3.5" width="16" height="7" rx="1.5" fill="{{c3}}" opacity="0.8" stroke="{{c1}}" stroke-width="0.8" />
    </g>
    <!-- Piece 4 -->
    <g transform="translate(80, 85) rotate(-60)">
      <rect x="-7" y="-3" width="14" height="6" rx="1.5" fill="{{c1}}" opacity="0.9" stroke="{{c2}}" stroke-width="0.8" />
    </g>
    <!-- Piece 5 -->
    <g transform="translate(125, 175) rotate(15)">
      <rect x="-9" y="-4" width="18" height="8" rx="1.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    </g>
    <!-- Piece 6 -->
    <g transform="translate(165, 60) rotate(-15)">
      <rect x="-7" y="-3" width="14" height="6" rx="1.5" fill="{{c3}}" stroke="{{c2}}" stroke-width="0.8" />
    </g>

    <!-- Diamond Sparkle Stars -->
    <path d="M95,20 L97,14 L99,20 L105,22 L99,24 L97,30 L95,24 L89,22 Z" fill="{{c1}}" />
    <path d="M150,45 L151.5,40 L153,45 L158,46.5 L153,48 L151.5,53 L150,48 L145,46.5 Z" fill="{{c2}}" />
    <path d="M28,105 L29.5,100 L31,105 L36,106.5 L31,108 L29.5,113 L28,108 L23,106.5 Z" fill="{{c3}}" />
    <path d="M105,115 L107,109 L109,115 L115,117 L109,119 L107,125 L105,119 L99,117 Z" fill="{{c1}}" />
    <path d="M65,170 L66.5,165 L68,170 L73,171.5 L68,173 L66.5,178 L65,173 L60,171.5 Z" fill="{{c2}}" />

    <!-- Round Confetti Dots of varying sizes -->
    <circle cx="65" cy="40" r="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
    <circle cx="130" cy="22" r="2.2" fill="{{c1}}" />
    <circle cx="185" cy="95" r="3.2" fill="{{c1}}" stroke="{{c2}}" stroke-width="0.7" />
    <circle cx="170" cy="140" r="2.4" fill="{{c2}}" />
    <circle cx="100" cy="65" r="2.5" fill="{{c3}}" />
    <circle cx="22" cy="70" r="2.2" fill="{{c2}}" />
    <circle cx="40" cy="180" r="2.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.7" />
    <circle cx="95" cy="185" r="2" fill="{{c1}}" />
    <circle cx="145" cy="155" r="2.5" fill="{{c1}}" />
    <circle cx="180" cy="185" r="1.8" fill="{{c2}}" />
  </g>
</svg>
