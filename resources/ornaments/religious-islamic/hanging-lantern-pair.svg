<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Hanging Bar / Ceiling Chain Mount -->
    <line x1="20" y1="8" x2="200" y2="8" stroke="{{c2}}" stroke-width="1.2" opacity="0.6" stroke-dasharray="3,3" />

    <!-- LANTERN 1: Higher / Left Lantern (Center x=70, hangs to y=190) -->
    <!-- Hanging Chain (x=70, y=8 to 65) -->
    <line x1="70" y1="8" x2="70" y2="65" stroke="{{c1}}" stroke-width="1.6" />
    <circle cx="70" cy="20" r="1.8" fill="{{c2}}" />
    <circle cx="70" cy="35" r="1.8" fill="{{c2}}" />
    <circle cx="70" cy="50" r="1.8" fill="{{c2}}" />

    <!-- Left Lantern Spire & Dome (x=70, y=65 to 105) -->
    <circle cx="70" cy="62" r="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="1" />
    <polygon points="70,65 74,74 66,74" fill="{{c1}}" stroke="{{c1}}" stroke-width="1" />
    <!-- Ogee Cupola -->
    <path d="M46,105 C48,86 60,74 70,72 C80,74 92,86 94,105 Z" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.8" />
    <circle cx="70" cy="90" r="2.5" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.7" />
    <!-- Eaves Rim -->
    <rect x="42" y="105" width="56" height="7" rx="1.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.4" />

    <!-- Left Lantern Glass Chamber (y=112 to 168) -->
    <polygon points="46,112 36,155 46,168 94,168 104,155 94,112" fill="{{c3}}" opacity="0.3" stroke="{{c1}}" stroke-width="1.8" />
    <!-- Center glass panel dividers -->
    <line x1="60" y1="112" x2="55" y2="168" stroke="{{c1}}" stroke-width="1.2" />
    <line x1="80" y1="112" x2="85" y2="168" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Glass Lattice Arabesque -->
    <circle cx="70" cy="140" r="8" stroke="{{c2}}" stroke-width="1" />
    <!-- Flame inside -->
    <ellipse cx="70" cy="142" rx="4" ry="8" fill="{{c1}}" />
    <circle cx="70" cy="144" r="1.8" fill="{{c3}}" />

    <!-- Left Lantern Base & Tassel (y=168 to 195) -->
    <rect x="44" y="168" width="52" height="7" rx="1.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.4" />
    <polygon points="50,175 58,185 82,185 90,175" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
    <circle cx="70" cy="192" r="2.8" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <line x1="70" y1="195" x2="70" y2="202" stroke="{{c3}}" stroke-width="1.2" />

    <!-- LANTERN 2: Lower / Right Lantern (Center x=155, hangs to y=255) -->
    <!-- Hanging Chain (x=155, y=8 to 110) -->
    <line x1="155" y1="8" x2="155" y2="110" stroke="{{c1}}" stroke-width="1.6" />
    <circle cx="155" cy="20" r="1.8" fill="{{c2}}" />
    <circle cx="155" cy="40" r="1.8" fill="{{c2}}" />
    <circle cx="155" cy="60" r="1.8" fill="{{c2}}" />
    <circle cx="155" cy="80" r="1.8" fill="{{c2}}" />
    <circle cx="155" cy="100" r="1.8" fill="{{c2}}" />

    <!-- Right Lantern Spire & Dome (x=155, y=110 to 155) -->
    <circle cx="155" cy="106" r="3.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1" />
    <polygon points="155,110 160,120 150,120" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Ogee Cupola -->
    <path d="M128,155 C130,132 144,118 155,116 C166,118 180,132 182,155 Z" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="2" />
    <circle cx="155" cy="138" r="3" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <!-- Eaves Rim -->
    <rect x="124" y="155" width="62" height="8" rx="2" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5" />

    <!-- Right Lantern Glass Chamber (y=163 to 225) -->
    <polygon points="128,163 116,210 128,225 182,225 194,210 182,163" fill="{{c3}}" opacity="0.3" stroke="{{c1}}" stroke-width="2" />
    <!-- Glass panel dividers -->
    <line x1="144" y1="163" x2="138" y2="225" stroke="{{c1}}" stroke-width="1.4" />
    <line x1="166" y1="163" x2="172" y2="225" stroke="{{c1}}" stroke-width="1.4" />
    <!-- Glass Lattice Arabesque -->
    <circle cx="155" cy="194" r="10" stroke="{{c2}}" stroke-width="1.2" />
    <!-- Flame inside -->
    <ellipse cx="155" cy="196" rx="5" ry="10" fill="{{c1}}" />
    <circle cx="155" cy="198" r="2.2" fill="{{c3}}" />

    <!-- Right Lantern Base & Tassel (y=225 to 258) -->
    <rect x="126" y="225" width="58" height="8" rx="2" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5" />
    <polygon points="132,233 142,245 168,245 178,233" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.3" />
    <circle cx="155" cy="252" r="3.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="1" />
    <line x1="155" y1="256" x2="155" y2="265" stroke="{{c3}}" stroke-width="1.5" />

    <!-- Celebratory Sparkle Stars & Light Flecks -->
    <path d="M108,80 L109.5,76 L111,80 L115,81.5 L111,83 L109.5,87 L108,83 L104,81.5 Z" fill="{{c1}}" />
    <path d="M195,140 L196.5,136 L198,140 L202,141.5 L198,143 L196.5,147 L195,143 L191,141.5 Z" fill="{{c2}}" />
    <circle cx="28" cy="120" r="1.8" fill="{{c1}}" />
    <circle cx="112" cy="165" r="2.2" fill="{{c2}}" />
    <circle cx="202" cy="200" r="1.6" fill="{{c1}}" />
    <circle cx="115" cy="225" r="1.4" fill="{{c3}}" />
  </g>
</svg>
