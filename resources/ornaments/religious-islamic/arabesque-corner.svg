<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Geometric Corner Guidelines / Border Frame (c3 guide) -->
    <path d="M190,14 L24,14 C18,14 14,18 14,24 L14,190" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.5" />
    <path d="M190,20 L30,20 C24,20 20,24 20,30 L20,190" stroke="{{c2}}" stroke-width="1.2" opacity="0.6" />

    <!-- Primary Swirling Islimi Vine Spiral (Originates from 185, 20 and spirals into corner) -->
    <path d="M185,20 C120,20 65,45 38,82 C22,106 20,140 20,185" stroke="{{c1}}" stroke-width="2.6" />
    <path d="M180,24 C122,24 72,48 46,84 C30,108 26,140 26,180" stroke="{{c2}}" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.6" />

    <!-- Secondary Counter-Spiral (Dancing toward center 75, 75) -->
    <path d="M38,82 C52,65 80,55 105,68 C124,78 126,102 112,118 C98,132 75,126 68,110 C62,96 72,82 85,84" stroke="{{c1}}" stroke-width="1.8" />

    <!-- Central Palmette Blossom at spiral eye (85, 84) -->
    <g transform="translate(85, 84) rotate(-45)">
      <!-- Symmetrical Arabesque Palmette (c1, c2, c3) -->
      <path d="M0,0 C-18,-12 -28,-32 0,-42 C28,-32 18,-12 0,0 Z" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.4" />
      <!-- Inner Rumi Leaf Core -->
      <path d="M0,-5 C-12,-15 -18,-28 0,-35 C18,-28 12,-15 0,-5 Z" fill="{{c2}}" opacity="0.75" stroke="{{c3}}" stroke-width="1" />
      <circle cx="0" cy="-20" r="3.5" fill="{{c3}}" />
      <!-- Side Leaf Wings -->
      <path d="M-6,-12 C-22,-14 -32,-2 -28,8 C-20,12 -12,2 -6,-12" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
      <path d="M6,-12 C22,-14 32,-2 28,8 C20,12 12,2 6,-12" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
    </g>

    <!-- Rumi Split Leaves along the main stem -->
    <!-- Leaf 1 (Top horizontal arm, near 135, 22) -->
    <g transform="translate(135, 20) rotate(-15)">
      <path d="M0,0 C15,-16 35,-12 42,4 C28,14 12,10 0,0 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C15,-2 28,2 42,4" stroke="{{c1}}" stroke-width="0.8" />
      <path d="M12,-6 C24,-12 30,-2 28,2" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="0.8" />
    </g>

    <!-- Leaf 2 (Left vertical arm, near 22, 135) -->
    <g transform="translate(20, 135) rotate(75)">
      <path d="M0,0 C15,-16 35,-12 42,4 C28,14 12,10 0,0 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C15,-2 28,2 42,4" stroke="{{c1}}" stroke-width="0.8" />
      <path d="M12,-6 C24,-12 30,-2 28,2" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="0.8" />
    </g>

    <!-- Leaf 3 (Corner crest at 36, 46) -->
    <g transform="translate(36, 46) rotate(35)">
      <path d="M0,0 C-14,-14 -28,-8 -32,6 C-22,14 -8,10 0,0 Z" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.2" />
    </g>

    <!-- Outer Tendril Flourishes -->
    <path d="M150,20 C165,12 178,16 175,26 C172,36 158,34 162,24" stroke="{{c1}}" stroke-width="1.2" />
    <path d="M20,150 C12,165 16,178 26,175 C36,172 34,158 24,162" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Corner Inset Medallion Star (32, 32) -->
    <circle cx="32" cy="32" r="7" fill="{{c1}}" stroke="{{c3}}" stroke-width="1" />
    <circle cx="32" cy="32" r="3.5" fill="{{c2}}" />
    <circle cx="32" cy="32" r="1.5" fill="{{c3}}" />

    <!-- Terminal Beads and Dots -->
    <circle cx="185" cy="20" r="2.8" fill="{{c1}}" />
    <circle cx="20" cy="185" r="2.8" fill="{{c1}}" />
    <circle cx="110" cy="42" r="2" fill="{{c2}}" />
    <circle cx="42" cy="110" r="2" fill="{{c2}}" />
    <circle cx="132" cy="98" r="1.6" fill="{{c3}}" />
    <circle cx="98" cy="132" r="1.6" fill="{{c3}}" />
  </g>
</svg>
