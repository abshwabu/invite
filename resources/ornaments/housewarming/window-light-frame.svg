<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" fill="none">
  <!-- Architectural arched home window with warm glowing light and planter box sill -->
  <g class="window-light-frame" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cast Shadow beneath Window -->
    <ellipse cx="140" cy="326" rx="95" ry="8" fill="{{c3}}" opacity="0.3"/>

    <!-- Brickwork / Masonry Lintel Arch above window -->
    <path d="M48 130 C48 70 88 32 140 32 C192 32 232 70 232 130" stroke="{{c2}}" stroke-width="6" fill="none"/>
    <path d="M42 130 C42 66 84 24 140 24 C196 24 238 66 238 130" stroke="{{c1}}" stroke-width="1.8" stroke-dasharray="6 8" fill="none"/>

    <!-- Main Outer Window Frame (Arched Top) -->
    <path d="M54 280 V130 A86 86 0 0 1 226 130 V280 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>
    
    <!-- Warm Golden Light / Inner Glow within the window panes -->
    <path d="M62 276 V130 A78 78 0 0 1 218 130 V276 Z" fill="{{c2}}" opacity="0.2"/>

    <!-- Soft Draped Curtains (Left and Right) -->
    <!-- Left Curtain -->
    <path d="M62 130 C62 88 88 64 110 56 C90 90 92 180 62 230 Z" fill="{{c3}}" opacity="0.4"/>
    <path d="M62 130 C62 90 86 66 106 58 C88 92 90 180 62 230 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="1.5"/>
    <!-- Curtain Tieback Left -->
    <ellipse cx="80" cy="180" rx="6" ry="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.2" transform="rotate(20 80 180)"/>

    <!-- Right Curtain -->
    <path d="M218 130 C218 88 192 64 170 56 C190 90 188 180 218 230 Z" fill="{{c3}}" opacity="0.4"/>
    <path d="M218 130 C218 90 194 66 174 58 C192 92 190 180 218 230 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="1.5"/>
    <!-- Curtain Tieback Right -->
    <ellipse cx="200" cy="180" rx="6" ry="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.2" transform="rotate(-20 200 180)"/>

    <!-- Window Mullions & Transoms (Crossbars) -->
    <!-- Vertical Center Bar -->
    <line x1="140" y1="52" x2="140" y2="276" stroke="{{c1}}" stroke-width="3"/>
    <!-- Horizontal Crossbars -->
    <line x1="62" y1="130" x2="218" y2="130" stroke="{{c1}}" stroke-width="2.5"/>
    <line x1="62" y1="185" x2="218" y2="185" stroke="{{c1}}" stroke-width="2.5"/>
    <line x1="62" y1="235" x2="218" y2="235" stroke="{{c1}}" stroke-width="2"/>

    <!-- Fanlight Arch Bars (Sunburst Spiders in top arch) -->
    <line x1="140" y1="130" x2="88" y2="76" stroke="{{c1}}" stroke-width="1.8"/>
    <line x1="140" y1="130" x2="192" y2="76" stroke="{{c1}}" stroke-width="1.8"/>

    <!-- Star of Hope shining in top pane -->
    <polygon points="140,84 142,88 147,88 143,91 145,95 140,92 135,95 137,91 133,88 138,88" fill="{{c2}}"/>

    <!-- Substantial Window Sill Ledge -->
    <rect x="42" y="278" width="196" height="14" rx="3" fill="{{c1}}" stroke="{{c2}}" stroke-width="2"/>
    <line x1="44" y1="282" x2="236" y2="282" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

    <!-- Window Flower Box with Blooming Flora on the Sill -->
    <g class="planter-sill">
      <!-- Planter Box Trough -->
      <path d="M52 292 L60 322 C60 324 220 324 220 322 L228 292 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="2"/>
      <!-- Planter Lattice / Slats -->
      <line x1="68" y1="300" x2="212" y2="300" stroke="{{c1}}" stroke-width="1.5"/>
      <line x1="72" y1="312" x2="208" y2="312" stroke="{{c1}}" stroke-width="1.5"/>

      <!-- Lush Leaves and Blooms spilling over -->
      <!-- Left foliage -->
      <path d="M68 288 C58 276 72 268 80 274 C80 286 72 292 68 288 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.2"/>
      <circle cx="76" cy="272" r="5" fill="{{c1}}"/>
      <circle cx="76" cy="272" r="2" fill="{{c2}}"/>

      <!-- Center foliage -->
      <path d="M120 286 C114 274 130 268 136 276 C134 286 126 292 120 286 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.2"/>
      <circle cx="126" cy="270" r="6" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.2"/>
      <circle cx="126" cy="270" r="2.5" fill="#FFFFFF"/>

      <path d="M152 286 C146 274 162 268 168 276 C166 286 158 292 152 286 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.2"/>
      <circle cx="158" cy="270" r="6" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.2"/>
      <circle cx="158" cy="270" r="2.5" fill="{{c2}}"/>

      <!-- Right foliage -->
      <path d="M204 288 C194 276 208 268 216 274 C216 286 208 292 204 288 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.2"/>
      <circle cx="210" cy="272" r="5" fill="{{c2}}"/>
      <circle cx="210" cy="272" r="2" fill="{{c1}}"/>

      <!-- Trailing Ivy Tendril -->
      <path d="M96 292 C92 308 98 322 94 330" stroke="{{c1}}" stroke-width="1.5" fill="none"/>
      <circle cx="94" cy="315" r="2.5" fill="{{c3}}"/>
      <path d="M184 292 C188 308 182 322 186 330" stroke="{{c1}}" stroke-width="1.5" fill="none"/>
      <circle cx="185" cy="315" r="2.5" fill="{{c3}}"/>
    </g>

    <!-- Warm Starlight Accents -->
    <path d="M24 100 Q24 106 30 106 Q24 106 24 112 Q24 106 18 106 Q24 106 24 100 Z" fill="{{c2}}"/>
    <path d="M256 100 Q256 106 262 106 Q256 106 256 112 Q256 106 250 106 Q256 106 256 100 Z" fill="{{c2}}"/>
    <circle cx="34" cy="50" r="2" fill="{{c3}}"/>
    <circle cx="246" cy="50" r="2" fill="{{c3}}"/>
  </g>
</svg>
