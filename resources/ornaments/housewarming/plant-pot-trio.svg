<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" fill="none">
  <!-- Trio of stylish indoor housewarming potted plants with lush botanical foliage -->
  <g class="plant-pot-trio" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground / Shelf Shadow Line -->
    <ellipse cx="170" cy="205" rx="145" ry="8" fill="{{c3}}" opacity="0.25"/>
    <line x1="20" y1="206" x2="320" y2="206" stroke="{{c2}}" stroke-width="1.5" opacity="0.5"/>

    <!-- Plant 1: Left - Compact Succulent Rosette in Ribbed Pot -->
    <g class="pot-left">
      <!-- Succulent Petals / Rosette -->
      <g class="succulent-leaves">
        <path d="M75 125 C60 115 56 95 72 88 C82 100 80 115 75 125 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.5"/>
        <path d="M75 125 C90 115 94 95 78 88 C68 100 70 115 75 125 Z" fill="{{c3}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.5"/>
        <path d="M75 120 C64 100 72 80 82 82 C88 95 82 110 75 120 Z" fill="{{c1}}" opacity="0.85" stroke="{{c2}}" stroke-width="1.5"/>
        <path d="M75 120 C86 100 78 80 68 82 C62 95 68 110 75 120 Z" fill="{{c2}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.5"/>
        <!-- Apex Leaf -->
        <path d="M75 115 C70 95 80 75 75 70 C70 75 80 95 75 115 Z" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.5"/>
      </g>
      <!-- Pot Rim -->
      <ellipse cx="75" cy="130" rx="30" ry="7" fill="{{c2}}" stroke="{{c1}}" stroke-width="2"/>
      <!-- Pot Body (Ribbed Tapered) -->
      <path d="M48 132 L56 198 C56 202 94 202 94 198 L102 132 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
      <!-- Vertical Grooves on pot -->
      <line x1="64" y1="135" x2="68" y2="198" stroke="{{c3}}" stroke-width="1.5"/>
      <line x1="75" y1="137" x2="75" y2="200" stroke="{{c1}}" stroke-width="1.5"/>
      <line x1="86" y1="135" x2="82" y2="198" stroke="{{c3}}" stroke-width="1.5"/>
    </g>

    <!-- Plant 2: Center (Hero) - Monstera / Tropical Leaf in Large Planter -->
    <g class="pot-center">
      <!-- Stems -->
      <path d="M170 145 C150 100 130 70 120 45" stroke="{{c1}}" stroke-width="2.5" fill="none"/>
      <path d="M170 145 C175 90 180 60 175 32" stroke="{{c1}}" stroke-width="2.5" fill="none"/>
      <path d="M170 145 C190 110 215 80 226 55" stroke="{{c1}}" stroke-width="2.5" fill="none"/>

      <!-- Left Monstera Leaf -->
      <g class="monstera-left">
        <path d="M120 45 C98 52 90 85 115 95 C132 100 142 80 120 45 Z" fill="{{c2}}" opacity="0.9" stroke="{{c1}}" stroke-width="2"/>
        <!-- Cutouts / Fenestrations -->
        <ellipse cx="108" cy="72" rx="3" ry="8" fill="#FFFFFF" transform="rotate(-30 108 72)"/>
        <ellipse cx="120" cy="80" rx="3" ry="7" fill="#FFFFFF" transform="rotate(-15 120 80)"/>
      </g>

      <!-- Center Hero Leaf -->
      <g class="monstera-center">
        <path d="M175 32 C150 42 148 76 172 88 C196 76 194 42 175 32 Z" fill="{{c1}}" opacity="0.9" stroke="{{c2}}" stroke-width="2"/>
        <line x1="175" y1="35" x2="175" y2="86" stroke="{{c2}}" stroke-width="1.5"/>
        <ellipse cx="162" cy="62" rx="3" ry="7" fill="#FFFFFF" transform="rotate(-20 162 62)"/>
        <ellipse cx="188" cy="62" rx="3" ry="7" fill="#FFFFFF" transform="rotate(20 188 62)"/>
      </g>

      <!-- Right Monstera Leaf -->
      <g class="monstera-right">
        <path d="M226 55 C248 62 250 95 228 102 C210 102 205 82 226 55 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="2"/>
        <ellipse cx="236" cy="78" rx="3" ry="8" fill="#FFFFFF" transform="rotate(30 236 78)"/>
        <ellipse cx="224" cy="85" rx="3" ry="7" fill="#FFFFFF" transform="rotate(15 224 85)"/>
      </g>

      <!-- Center Large Ceramic Pot -->
      <!-- Rim -->
      <ellipse cx="170" cy="138" rx="42" ry="9" fill="{{c1}}" stroke="{{c2}}" stroke-width="2.5"/>
      <!-- Body -->
      <path d="M132 142 L142 200 C142 206 198 206 198 200 L208 142 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="2.5"/>
      <!-- Pot Geo Diamond Pattern band -->
      <path d="M142 165 L152 155 L162 165 L172 155 L182 165 L192 155 L202 165 L192 175 L182 165 L172 175 L162 165 L152 175 L142 165 Z" fill="{{c1}}" opacity="0.6"/>
    </g>

    <!-- Plant 3: Right - Trailing Ivy / String-of-Pearls in Footed Bowl -->
    <g class="pot-right">
      <!-- Trailing Vines cascading over pot edge -->
      <path d="M245 145 C235 165 240 185 232 202" stroke="{{c1}}" stroke-width="1.8" fill="none"/>
      <path d="M265 145 C260 170 270 190 262 214" stroke="{{c1}}" stroke-width="1.8" fill="none"/>
      <path d="M285 145 C295 165 285 185 292 205" stroke="{{c1}}" stroke-width="1.8" fill="none"/>

      <!-- Cascading Pearl / Ivy Beads -->
      <circle cx="238" cy="162" r="3.5" fill="{{c2}}"/>
      <circle cx="234" cy="178" r="3.5" fill="{{c3}}"/>
      <circle cx="232" cy="195" r="3.5" fill="{{c1}}"/>
      
      <circle cx="262" cy="160" r="3.5" fill="{{c1}}"/>
      <circle cx="266" cy="176" r="3.5" fill="{{c2}}"/>
      <circle cx="264" cy="192" r="3.5" fill="{{c3}}"/>
      <circle cx="262" cy="208" r="3.5" fill="{{c1}}"/>

      <circle cx="288" cy="162" r="3.5" fill="{{c2}}"/>
      <circle cx="288" cy="178" r="3.5" fill="{{c1}}"/>
      <circle cx="292" cy="196" r="3.5" fill="{{c3}}"/>

      <!-- Bushy top foliage -->
      <ellipse cx="265" cy="132" rx="30" ry="14" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="2"/>
      <circle cx="252" cy="126" r="6" fill="{{c1}}"/>
      <circle cx="278" cy="126" r="6" fill="{{c3}}"/>

      <!-- Footed Bowl Pot -->
      <ellipse cx="265" cy="138" rx="28" ry="7" fill="{{c3}}" stroke="{{c1}}" stroke-width="2"/>
      <path d="M240 140 C240 182 290 182 290 140 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
      <!-- Foot Stand -->
      <rect x="256" y="174" width="18" height="24" rx="2" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.5"/>
      <line x1="250" y1="198" x2="280" y2="198" stroke="{{c1}}" stroke-width="2"/>
    </g>

    <!-- Floating cozy room sparkles -->
    <path d="M28 65 Q28 72 35 72 Q28 72 28 79 Q28 72 21 72 Q28 72 28 65 Z" fill="{{c2}}"/>
    <path d="M305 60 Q305 67 312 67 Q305 67 305 74 Q305 67 298 67 Q305 67 305 60 Z" fill="{{c2}}"/>
    <circle cx="170" cy="18" r="2.5" fill="{{c2}}"/>
  </g>
</svg>
