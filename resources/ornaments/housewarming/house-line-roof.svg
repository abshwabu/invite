<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" fill="none">
  <!-- Cozy housewarming gable roof line art with chimney smoke and welcoming porch door -->
  <g class="house-line-roof" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chimney Smoke Swirls -->
    <path d="M210 55 C210 40 220 32 216 20 C212 12 222 4 230 6" stroke="{{c3}}" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M205 60 C205 48 214 42 212 32 C210 24 218 18 224 20" stroke="{{c2}}" stroke-width="1.8" stroke-dasharray="3 3" fill="none" opacity="0.6"/>

    <!-- Chimney Brickwork -->
    <rect x="200" y="52" width="22" height="42" fill="{{c1}}" stroke="{{c2}}" stroke-width="2"/>
    <rect x="196" y="48" width="30" height="6" rx="2" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5"/>
    <line x1="200" y1="65" x2="222" y2="65" stroke="{{c2}}" stroke-width="1.2"/>
    <line x1="200" y1="78" x2="222" y2="78" stroke="{{c2}}" stroke-width="1.2"/>

    <!-- Gable Roof (Triangular Peak) -->
    <!-- Roof Shadow / Overhang Facet -->
    <polygon points="150,56 276,140 268,144 150,68 32,144 24,140" fill="{{c3}}" opacity="0.4"/>
    
    <!-- Main Roof Fascia -->
    <polygon points="150,52 284,136 274,146 150,66 26,146 16,136" fill="{{c1}}" stroke="{{c2}}" stroke-width="2.5"/>
    
    <!-- Roof Ridge Crest & Finial Accent -->
    <polygon points="150,42 154,52 146,52" fill="{{c2}}"/>
    <circle cx="150" cy="40" r="3.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5"/>

    <!-- Attic Gable Trim / Shingle Hatching -->
    <polygon points="150,72 246,134 54,134" fill="{{c2}}" opacity="0.15"/>
    <!-- Attic Round Window -->
    <circle cx="150" cy="106" r="16" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
    <circle cx="150" cy="106" r="13" stroke="{{c2}}" stroke-width="1.2" fill="{{c2}}" opacity="0.2"/>
    <line x1="150" y1="92" x2="150" y2="120" stroke="{{c1}}" stroke-width="1.8"/>
    <line x1="136" y1="106" x2="164" y2="106" stroke="{{c1}}" stroke-width="1.8"/>

    <!-- House Front Wall Base -->
    <rect x="54" y="136" width="192" height="110" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
    
    <!-- Weatherboard Horizontal Siding Grooves -->
    <line x1="54" y1="155" x2="246" y2="155" stroke="{{c3}}" stroke-width="1" opacity="0.35"/>
    <line x1="54" y1="175" x2="246" y2="175" stroke="{{c3}}" stroke-width="1" opacity="0.35"/>
    <line x1="54" y1="195" x2="246" y2="195" stroke="{{c3}}" stroke-width="1" opacity="0.35"/>
    <line x1="54" y1="215" x2="246" y2="215" stroke="{{c3}}" stroke-width="1" opacity="0.35"/>
    <line x1="54" y1="235" x2="246" y2="235" stroke="{{c3}}" stroke-width="1" opacity="0.35"/>

    <!-- Welcoming Center Front Door -->
    <g class="front-door">
      <!-- Door Frame -->
      <path d="M124 246 V172 A26 26 0 0 1 176 172 V246 Z" fill="{{c1}}" stroke="{{c2}}" stroke-width="2"/>
      <!-- Inner Door Leaf -->
      <path d="M129 246 V174 A21 21 0 0 1 171 174 V246 Z" fill="{{c2}}" opacity="0.35" stroke="{{c1}}" stroke-width="1.5"/>
      <!-- Door Panels -->
      <rect x="134" y="200" width="14" height="20" rx="2" stroke="{{c1}}" stroke-width="1.5" fill="none"/>
      <rect x="152" y="200" width="14" height="20" rx="2" stroke="{{c1}}" stroke-width="1.5" fill="none"/>
      <rect x="134" y="224" width="14" height="18" rx="2" stroke="{{c1}}" stroke-width="1.5" fill="none"/>
      <rect x="152" y="224" width="14" height="18" rx="2" stroke="{{c1}}" stroke-width="1.5" fill="none"/>
      
      <!-- Welcome Door Wreath -->
      <circle cx="150" cy="180" r="9" stroke="{{c1}}" stroke-width="2.5" fill="none"/>
      <circle cx="150" cy="180" r="7" stroke="{{c2}}" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
      <!-- Tiny Wreath Bow -->
      <circle cx="150" cy="173" r="2" fill="{{c2}}"/>
      
      <!-- Brass Door Knob -->
      <circle cx="137" cy="214" r="2" fill="{{c2}}"/>
      
      <!-- Porch Lantern above door -->
      <path d="M146 150 L154 150 L152 160 L148 160 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.2"/>
      <circle cx="150" cy="155" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Flanking Windows -->
    <!-- Left Window -->
    <g class="window-left">
      <rect x="74" y="165" width="34" height="42" rx="3" fill="{{c2}}" opacity="0.25" stroke="{{c1}}" stroke-width="2"/>
      <line x1="91" y1="165" x2="91" y2="207" stroke="{{c1}}" stroke-width="1.5"/>
      <line x1="74" y1="186" x2="108" y2="186" stroke="{{c1}}" stroke-width="1.5"/>
      <!-- Planter Box with Blooms -->
      <rect x="70" y="206" width="42" height="10" rx="2" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.5"/>
      <circle cx="78" cy="204" r="3.5" fill="{{c2}}"/>
      <circle cx="91" cy="203" r="3.5" fill="{{c3}}"/>
      <circle cx="104" cy="204" r="3.5" fill="{{c2}}"/>
    </g>

    <!-- Right Window -->
    <g class="window-right">
      <rect x="192" y="165" width="34" height="42" rx="3" fill="{{c2}}" opacity="0.25" stroke="{{c1}}" stroke-width="2"/>
      <line x1="209" y1="165" x2="209" y2="207" stroke="{{c1}}" stroke-width="1.5"/>
      <line x1="192" y1="186" x2="226" y2="186" stroke="{{c1}}" stroke-width="1.5"/>
      <!-- Planter Box with Blooms -->
      <rect x="188" y="206" width="42" height="10" rx="2" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.5"/>
      <circle cx="196" cy="204" r="3.5" fill="{{c2}}"/>
      <circle cx="209" cy="203" r="3.5" fill="{{c3}}"/>
      <circle cx="222" cy="204" r="3.5" fill="{{c2}}"/>
    </g>

    <!-- Front Stone Steps / Porch Landing -->
    <rect x="110" y="246" width="80" height="8" rx="2" fill="{{c2}}" stroke="{{c1}}" stroke-width="2"/>

    <!-- Cheerful floating warmth stars -->
    <path d="M46 70 Q46 76 52 76 Q46 76 46 82 Q46 76 40 76 Q46 76 46 70 Z" fill="{{c2}}"/>
    <path d="M254 70 Q254 76 260 76 Q254 76 254 82 Q254 76 248 76 Q254 76 254 70 Z" fill="{{c2}}"/>
    <circle cx="68" cy="54" r="2.5" fill="{{c3}}"/>
    <circle cx="236" cy="54" r="2.5" fill="{{c3}}"/>
  </g>
</svg>
