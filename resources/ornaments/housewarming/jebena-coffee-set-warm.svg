<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" fill="none">
  <!-- Traditional Ethiopian warm housewarming coffee gathering (Jebena & Sini set) -->
  <g class="jebena-coffee-set-warm" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cast Shadow Line Base -->
    <ellipse cx="160" cy="236" rx="135" ry="10" fill="{{c3}}" opacity="0.3"/>

    <!-- Aromatic Steam Swirls rising from Jebena Spout -->
    <path d="M125 58 C120 42 135 30 130 16 C126 8 136 2 144 4" stroke="{{c2}}" stroke-width="2.5" fill="none"/>
    <path d="M132 64 C128 50 142 40 138 28 C135 20 144 14 150 16" stroke="{{c3}}" stroke-width="1.8" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
    
    <!-- Steam from Sini cups -->
    <path d="M205 168 C202 154 210 146 206 136" stroke="{{c2}}" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
    <path d="M235 168 C232 154 240 146 236 136" stroke="{{c2}}" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
    <path d="M265 174 C262 160 270 152 266 142" stroke="{{c2}}" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>

    <!-- Left: Traditional Ethiopian Jebena (Coffee Pot) -->
    <g class="jebena">
      <!-- Straw Ring Mat / Woven Base (Mat) beneath Jebena -->
      <ellipse cx="105" cy="225" rx="34" ry="10" fill="{{c2}}" stroke="{{c1}}" stroke-width="2"/>
      <ellipse cx="105" cy="225" rx="26" ry="6" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

      <!-- Jebena Round Clay Belly -->
      <ellipse cx="105" cy="168" rx="46" ry="44" fill="{{c1}}" stroke="{{c2}}" stroke-width="2.5"/>
      <!-- Clay luster highlight -->
      <path d="M80 140 C70 155 72 185 86 200" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4" fill="none"/>
      <!-- Etched Traditional Clay Line Pattern on Belly -->
      <circle cx="105" cy="168" r="30" stroke="{{c2}}" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
      <circle cx="105" cy="168" r="16" stroke="{{c3}}" stroke-width="1.5" fill="{{c3}}" opacity="0.3"/>

      <!-- Jebena Neck -->
      <path d="M94 130 C96 100 98 80 102 62 L116 62 C118 80 120 100 124 130 Z" fill="{{c1}}" stroke="{{c2}}" stroke-width="2"/>
      <!-- Neck Band Ring -->
      <rect x="96" y="92" width="26" height="6" rx="2" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5"/>

      <!-- Neck Rim / Funnel Top -->
      <ellipse cx="109" cy="62" rx="14" ry="5" fill="{{c2}}" stroke="{{c1}}" stroke-width="2"/>
      <!-- Straw Plug / Stopper (Kork) in the neck top -->
      <path d="M106 60 L112 60 L114 48 L104 48 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.5"/>

      <!-- Jebena Spout (Pointing right towards the cups) -->
      <path d="M128 140 C140 125 152 105 142 85 L135 88 C140 105 130 122 120 134 Z" fill="{{c1}}" stroke="{{c2}}" stroke-width="2"/>
      <ellipse cx="138" cy="86" rx="4" ry="2.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5"/>

      <!-- Jebena Curved Handle (on the left) -->
      <path d="M80 134 C44 140 44 185 76 195" stroke="{{c1}}" stroke-width="6" fill="none"/>
      <path d="M80 134 C44 140 44 185 76 195" stroke="{{c2}}" stroke-width="2" fill="none"/>
    </g>

    <!-- Right: Rekebot Tray with Three Sini Cups -->
    <g class="rekebot-set">
      <!-- Rekebot Coffee Tray Table -->
      <path d="M170 200 L295 200 C302 200 306 205 304 212 L298 226 C296 230 166 230 164 226 L160 212 C158 205 164 200 170 200 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
      <!-- Tray Front Traditional Diamond Lattice Panel -->
      <path d="M170 208 L176 218 L182 208 L188 218 L194 208 L200 218 L206 208 L212 218 L218 208 L224 218 L230 208 L236 218 L242 208 L248 218 L254 208 L260 218 L266 208 L272 218 L278 208 L284 218 L290 208" stroke="{{c2}}" stroke-width="1.5" fill="none"/>
      <line x1="162" y1="206" x2="302" y2="206" stroke="{{c3}}" stroke-width="1.2"/>

      <!-- Sini Cup 1 (Left) -->
      <g class="sini-1">
        <!-- Cup Body -->
        <path d="M192 178 C192 196 218 196 218 178 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2"/>
        <ellipse cx="205" cy="178" rx="13" ry="4" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.2"/>
        <!-- Golden Coffee Surface Inside Sini -->
        <ellipse cx="205" cy="178" rx="10" ry="2.5" fill="{{c2}}"/>
        <!-- Decorative Traditional Floral Print on Sini -->
        <circle cx="205" cy="188" r="2.5" fill="{{c1}}"/>
        <circle cx="201" cy="188" r="1.5" fill="{{c2}}"/>
        <circle cx="209" cy="188" r="1.5" fill="{{c2}}"/>
        <!-- Sini Foot Ring -->
        <rect x="201" y="196" width="8" height="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="1"/>
      </g>

      <!-- Sini Cup 2 (Center) -->
      <g class="sini-2">
        <path d="M222 178 C222 196 248 196 248 178 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2"/>
        <ellipse cx="235" cy="178" rx="13" ry="4" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.2"/>
        <ellipse cx="235" cy="178" rx="10" ry="2.5" fill="{{c2}}"/>
        <!-- Decorative Print -->
        <circle cx="235" cy="188" r="2.5" fill="{{c1}}"/>
        <circle cx="231" cy="188" r="1.5" fill="{{c2}}"/>
        <circle cx="239" cy="188" r="1.5" fill="{{c2}}"/>
        <rect x="231" y="196" width="8" height="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="1"/>
      </g>

      <!-- Sini Cup 3 (Right) -->
      <g class="sini-3">
        <path d="M252 178 C252 196 278 196 278 178 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2"/>
        <ellipse cx="265" cy="178" rx="13" ry="4" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.2"/>
        <ellipse cx="265" cy="178" rx="10" ry="2.5" fill="{{c2}}"/>
        <!-- Decorative Print -->
        <circle cx="265" cy="188" r="2.5" fill="{{c1}}"/>
        <circle cx="261" cy="188" r="1.5" fill="{{c2}}"/>
        <circle cx="269" cy="188" r="1.5" fill="{{c2}}"/>
        <rect x="261" y="196" width="8" height="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="1"/>
      </g>

      <!-- Scattered Roasted Coffee Beans on Tray -->
      <g fill="{{c1}}" opacity="0.85">
        <ellipse cx="180" cy="196" rx="3" ry="2" transform="rotate(20 180 196)"/>
        <ellipse cx="186" cy="198" rx="3" ry="2" transform="rotate(-30 186 198)"/>
        <ellipse cx="286" cy="196" rx="3" ry="2" transform="rotate(40 286 196)"/>
        <ellipse cx="292" cy="198" rx="3" ry="2" transform="rotate(-15 292 198)"/>
      </g>
    </g>

    <!-- Warm Hospitality Heart Swirl -->
    <path d="M165 60 C160 52 150 54 150 62 C150 70 165 80 165 80 C165 80 180 70 180 62 C180 54 170 52 165 60 Z" fill="{{c2}}" opacity="0.8"/>
    <path d="M40 75 Q40 82 46 82 Q40 82 40 89 Q40 82 34 82 Q40 82 40 75 Z" fill="{{c2}}"/>
    <circle cx="280" cy="50" r="2.5" fill="{{c2}}"/>
  </g>
</svg>
