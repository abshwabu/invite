<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fluffy Cloud Pillow at Base (Center 100, 165) -->
    <path d="M45,175 C36,175 28,168 32,158 C34,148 46,145 52,150 C58,138 76,134 88,142 C98,128 122,130 130,144 C142,140 156,150 152,162 C160,170 154,175 145,175 Z" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.8" />
    <circle cx="58" cy="162" r="3" fill="{{c2}}" opacity="0.5" />
    <circle cx="138" cy="160" r="3" fill="{{c2}}" opacity="0.5" />

    <!-- SLEEPY CRESCENT MOON (Center x=100, y=95) -->
    <!-- Main Crescent Body -->
    <path d="M125,25 C82,28 48,65 48,110 C48,148 76,178 115,182 C78,168 62,140 62,110 C62,75 84,40 125,25 Z" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="2.2" />

    <!-- Moon Inner Soft Gradient Tone -->
    <path d="M118,34 C84,42 60,72 60,110 C60,142 74,162 105,172 C78,160 68,136 68,110 C68,80 84,52 118,34 Z" fill="{{c2}}" opacity="0.5" stroke="{{c3}}" stroke-width="1" />

    <!-- Sleeping Moon Face Details -->
    <!-- Closed peaceful curved eyelid with eyelashes -->
    <path d="M74,102 C78,108 86,108 90,102" stroke="{{c3}}" stroke-width="2.2" />
    <line x1="77" y1="106" x2="75" y2="109" stroke="{{c3}}" stroke-width="1.2" />
    <line x1="82" y1="107" x2="82" y2="111" stroke="{{c3}}" stroke-width="1.2" />
    <line x1="87" y1="106" x2="89" y2="109" stroke="{{c3}}" stroke-width="1.2" />

    <!-- Cute little curved button nose -->
    <path d="M68,112 C72,114 74,116 72,118" stroke="{{c1}}" stroke-width="1.6" />

    <!-- Rosy cheek blush -->
    <ellipse cx="88" cy="115" rx="5" ry="3" fill="{{c2}}" opacity="0.8" />

    <!-- Sweet gentle smile -->
    <path d="M78,124 C82,128 86,128 90,124" stroke="{{c3}}" stroke-width="1.6" />

    <!-- NIGHTCAP ON MOON APEX (Cozy striped sleeping cap: 125, 25) -->
    <!-- Cap Rim / Brim -->
    <ellipse cx="124" cy="28" rx="14" ry="6" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5" />
    <!-- Cap Cone folding over to the right -->
    <path d="M112,28 C120,8 140,4 158,15 C172,25 168,45 162,55" stroke="{{c1}}" stroke-width="2" />
    <path d="M136,28 C144,14 155,12 165,22 C172,30 166,45 162,55" stroke="{{c1}}" stroke-width="1.8" />
    <!-- Cap Body Fill -->
    <path d="M112,28 C120,8 140,4 158,15 C172,25 168,45 162,55 C166,45 172,30 165,22 C155,12 144,14 136,28 Z" fill="{{c2}}" opacity="0.8" />
    <!-- Stripes on Nightcap -->
    <path d="M125,18 C132,15 138,20 142,26" stroke="{{c3}}" stroke-width="1.6" />
    <path d="M142,12 C150,14 154,22 156,30" stroke="{{c1}}" stroke-width="1.6" />
    <!-- Fluffy Pom-Pom at Cap Tip (162, 58) -->
    <circle cx="162" cy="58" r="6.5" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.2" />
    <circle cx="162" cy="58" r="2.5" fill="{{c1}}" />

    <!-- SLEEPY LITTLE STAR (Embraced inside moon arc at 135, 95) -->
    <g transform="translate(132, 95)">
      <!-- 5-Point Cute Star -->
      <polygon points="0,-18 5,-5 18,-4 8,5 11,18 0,10 -11,18 -8,5 -18,-4 -5,-5" fill="{{c2}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.5" />
      <!-- Star Sleeping Eyes -->
      <path d="M-6,-2 C-4,1 -2,1 0,-2" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M2,-2 C4,1 6,1 8,-2" stroke="{{c1}}" stroke-width="1.2" />
      <!-- Star Rosy Cheeks -->
      <circle cx="-6" cy="3" r="1.5" fill="{{c3}}" />
      <circle cx="8" cy="3" r="1.5" fill="{{c3}}" />
    </g>

    <!-- Hanging Thread and Tiny Star Dropping from Cloud -->
    <line x1="88" y1="175" x2="88" y2="190" stroke="{{c1}}" stroke-width="1" stroke-dasharray="2,2" />
    <polygon points="88,188 90,192 94,192 91,195 92,199 88,197 84,199 85,195 82,192 86,192" fill="{{c1}}" />

    <!-- Ambient Sparkle Stars -->
    <path d="M30,55 L31.5,50 L33,55 L38,56.5 L33,58 L31.5,63 L30,58 L25,56.5 Z" fill="{{c3}}" />
    <circle cx="175" cy="115" r="2" fill="{{c1}}" />
    <circle cx="36" cy="85" r="1.5" fill="{{c2}}" />
    <circle cx="165" cy="140" r="1.8" fill="{{c2}}" />
  </g>
</svg>
