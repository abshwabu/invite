<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" fill="none">
  <!-- Vintage baby pram carriage with wheels and ruffle blanket -->
  <g class="pram-line" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground / Cast Shadow -->
    <ellipse cx="140" cy="254" rx="100" ry="8" fill="{{c3}}" opacity="0.2"/>

    <!-- Pushing Handle -->
    <path d="M42 90 C34 94 30 106 38 116 L88 174" stroke="{{c1}}" stroke-width="3"/>
    <ellipse cx="38" cy="98" rx="6" ry="12" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5" transform="rotate(-30 38 98)"/>

    <!-- Undercarriage Chassis / Springs -->
    <path d="M88 174 L198 174" stroke="{{c1}}" stroke-width="2.5"/>
    <!-- Curved suspension leaf springs -->
    <path d="M78 184 C84 206 106 206 112 184" stroke="{{c3}}" stroke-width="2" fill="none"/>
    <path d="M168 184 C174 206 196 206 202 184" stroke="{{c3}}" stroke-width="2" fill="none"/>
    <line x1="95" y1="184" x2="95" y2="216" stroke="{{c1}}" stroke-width="2.5"/>
    <line x1="185" y1="184" x2="185" y2="216" stroke="{{c1}}" stroke-width="2.5"/>
    <line x1="95" y1="216" x2="185" y2="216" stroke="{{c1}}" stroke-width="2"/>

    <!-- Bassinet / Tub Body -->
    <path d="M80 120 C76 156 94 176 142 176 C190 176 216 160 218 120 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>
    <!-- Decorative side panel emboss -->
    <path d="M96 134 C94 154 108 164 142 164 C176 164 196 156 202 134" stroke="{{c3}}" stroke-width="2" fill="{{c2}}" opacity="0.25"/>

    <!-- Hood / Canopy -->
    <g class="canopy">
      <!-- Shadow backing -->
      <path d="M136 120 C136 68 178 54 216 54 C224 54 228 60 228 70 L228 120 Z" fill="{{c3}}" opacity="0.3"/>
      <!-- Main shell segments -->
      <path d="M136 120 C136 68 178 56 218 56 C226 56 230 62 230 72 L230 120 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>
      <!-- Hood ribs radiating from hinge -->
      <path d="M136 120 C146 80 180 64 224 64" stroke="{{c2}}" stroke-width="2"/>
      <path d="M136 120 C160 92 196 82 228 86" stroke="{{c2}}" stroke-width="2"/>
      <path d="M136 120 C175 106 205 100 230 106" stroke="{{c3}}" stroke-width="2"/>
      <!-- Scalloped rim of the hood -->
      <path d="M228 58 C234 64 234 72 230 78 C234 84 234 92 230 98 C234 104 234 112 230 118" stroke="{{c1}}" stroke-width="2" fill="none"/>
      <!-- Hinge rosette -->
      <circle cx="136" cy="120" r="5" fill="{{c1}}"/>
      <circle cx="136" cy="120" r="2.5" fill="{{c2}}"/>
    </g>

    <!-- Quilted Blanket Ruffle edge -->
    <path d="M80 120 C88 114 96 124 104 118 C112 112 120 122 128 116 C136 112 144 120 148 116" stroke="{{c2}}" stroke-width="2.5" fill="none"/>
    <circle cx="92" cy="132" r="2" fill="{{c1}}"/>
    <circle cx="116" cy="132" r="2" fill="{{c1}}"/>

    <!-- Big Spoked Wheels -->
    <!-- Left Wheel -->
    <g class="wheel-left">
      <circle cx="95" cy="216" r="30" fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>
      <circle cx="95" cy="216" r="26" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Spokes -->
      <line x1="95" y1="188" x2="95" y2="244" stroke="{{c2}}" stroke-width="1.8"/>
      <line x1="67" y1="216" x2="123" y2="216" stroke="{{c2}}" stroke-width="1.8"/>
      <line x1="75" y1="196" x2="115" y2="236" stroke="{{c2}}" stroke-width="1.8"/>
      <line x1="75" y1="236" x2="115" y2="196" stroke="{{c2}}" stroke-width="1.8"/>
      <!-- Hub -->
      <circle cx="95" cy="216" r="6" fill="{{c1}}"/>
      <circle cx="95" cy="216" r="3" fill="{{c2}}"/>
    </g>

    <!-- Right Wheel -->
    <g class="wheel-right">
      <circle cx="185" cy="216" r="30" fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>
      <circle cx="185" cy="216" r="26" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Spokes -->
      <line x1="185" y1="188" x2="185" y2="244" stroke="{{c2}}" stroke-width="1.8"/>
      <line x1="157" y1="216" x2="213" y2="216" stroke="{{c2}}" stroke-width="1.8"/>
      <line x1="165" y1="196" x2="205" y2="236" stroke="{{c2}}" stroke-width="1.8"/>
      <line x1="165" y1="236" x2="205" y2="196" stroke="{{c2}}" stroke-width="1.8"/>
      <!-- Hub -->
      <circle cx="185" cy="216" r="6" fill="{{c1}}"/>
      <circle cx="185" cy="216" r="3" fill="{{c2}}"/>
    </g>

    <!-- Little Hearts and Stars above carriage -->
    <path d="M216 32 C212 26 204 28 204 36 C204 44 216 52 216 52 C216 52 228 44 228 36 C228 28 220 26 216 32 Z" fill="{{c1}}" opacity="0.8"/>
    <path d="M168 36 Q168 42 174 42 Q168 42 168 48 Q168 42 162 42 Q168 42 168 36 Z" fill="{{c2}}"/>
    <circle cx="246" cy="46" r="2.5" fill="{{c3}}"/>
  </g>
</svg>
