    <path d="M40,68 C32,68 25,60 28,50 C30,40 42,38 48,42 C54,32 68,30 76,36 C84,26 102,28 108,38 C118,36 128,46 124,56 C128,64 120,68 114,68 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />

    <!-- CLOUD 2: Background Right Cloud (c2 soft tone: center 165, 50) -->
    <path d="M135,62 C128,62 122,54 125,45 C128,36 138,34 144,38 C150,28 162,26 170,32 C178,22 195,24 200,34 C210,32 218,42 215,50 C218,58 212,62 205,62 Z" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.2" />

    <!-- CLOUD 3: Main Foreground Grand Cloud (c1 outline, c2/c3 fill: center 115, 88) -->
