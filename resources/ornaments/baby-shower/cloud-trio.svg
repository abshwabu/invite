    <path d="M155,122 C153,128 151,132 151,135 C151,138 153,140 155,140 C157,140 159,138 159,135 C159,132 157,128 155,122 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />

    <!-- Little Sleeping Stars Floating around clouds -->
    <path d="M22,35 L23,31 L24,35 L28,36 L24,37 L23,41 L22,37 L18,36 Z" fill="{{c1}}" />
    <path d="M142,22 L143,18 L144,22 L148,23 L144,24 L143,28 L142,24 L138,23 Z" fill="{{c2}}" />
    <path d="M218,68 L219,65 L220,68 L223,69 L220,70 L219,73 L218,70 L215,69 Z" fill="{{c1}}" />
    <circle cx="205" cy="85" r="1.8" fill="{{c3}}" />
    <circle cx="32" cy="115" r="1.5" fill="{{c3}}" />
