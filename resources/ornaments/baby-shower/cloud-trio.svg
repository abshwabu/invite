    <ellipse cx="78" cy="88" rx="4" ry="2.5" fill="{{c2}}" opacity="0.8" />
    <ellipse cx="132" cy="88" rx="4" ry="2.5" fill="{{c2}}" />
    <!-- Sweet little smile -->
    <path d="M102,90 C105,94 107,94 110,90" stroke="{{c3}}" stroke-width="1.5" />

    <!-- Gentle Raindrops / Hanging Stars Falling Below Clouds (y=118 to 155) -->
    <!-- Drop 1 (x=55) -->
    <path d="M55,122 C53,128 50,132 50,135 C50,138 53,140 55,140 C57,140 60,138 60,135 C60,132 57,128 55,122 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <!-- Drop 2 (x=80) -->
    <path d="M80,128 C78,134 76,138 76,141 C76,144 78,146 80,146 C82,146 84,144 84,141 C84,138 82,134 80,128 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <!-- Drop 3 (x=105) -->
    <path d="M105,120 C103,126 101,130 101,133 C101,136 103,138 105,138 C107,138 109,136 109,133 C109,130 107,126 105,120 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <!-- Drop 4 (x=130) -->
    <path d="M130,126 C128,132 126,136 126,139 C126,142 128,144 130,144 C132,144 134,142 134,139 C134,136 132,132 130,126 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
