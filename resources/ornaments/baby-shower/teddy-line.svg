<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <!-- Cute plush nursery teddy bear with stitched accents and bow tie -->
  <g class="teddy-line" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Soft Shadow Silhouette -->
    <ellipse cx="120" cy="202" rx="64" ry="48" fill="{{c3}}" opacity="0.25"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <circle cx="70" cy="62" r="24" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="2.5"/>
    <circle cx="70" cy="62" r="14" fill="{{c3}}" opacity="0.5"/>
    <path d="M62 62 A8 8 0 0 1 78 62" stroke="{{c1}}" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- Right Ear -->
    <circle cx="170" cy="62" r="24" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="2.5"/>
    <circle cx="170" cy="62" r="14" fill="{{c3}}" opacity="0.5"/>
    <path d="M162 62 A8 8 0 0 1 178 62" stroke="{{c1}}" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- Head -->
    <ellipse cx="120" cy="98" rx="52" ry="46" fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>
    
    <!-- Snout Muzzle -->
    <ellipse cx="120" cy="112" rx="24" ry="18" fill="{{c2}}" opacity="0.35" stroke="{{c1}}" stroke-width="1.8"/>
    <!-- Cute Triangle Nose -->
    <path d="M114 104 C114 102 126 102 126 104 C126 108 120 114 120 114 C120 114 114 108 114 104 Z" fill="{{c1}}"/>
    <!-- Smiling Mouth -->
    <path d="M120 114 L120 120" stroke="{{c1}}" stroke-width="2"/>
    <path d="M112 120 C114 125 120 125 120 120 C120 125 126 125 128 120" stroke="{{c1}}" stroke-width="2" fill="none"/>

    <!-- Sweet Eyes with Highlights -->
    <ellipse cx="98" cy="94" rx="4.5" ry="6" fill="{{c1}}"/>
    <circle cx="96" cy="92" r="1.8" fill="#FFFFFF"/>
    <ellipse cx="142" cy="94" rx="4.5" ry="6" fill="{{c1}}"/>
    <circle cx="140" cy="92" r="1.8" fill="#FFFFFF"/>

    <!-- Soft Cheeks -->
    <ellipse cx="88" cy="112" rx="7" ry="4.5" fill="{{c3}}" opacity="0.6"/>
    <ellipse cx="152" cy="112" rx="7" ry="4.5" fill="{{c3}}" opacity="0.6"/>

    <!-- Forehead stitch detail -->
    <path d="M116 70 L124 70" stroke="{{c2}}" stroke-width="1.5"/>
    <path d="M118 67 L118 73" stroke="{{c2}}" stroke-width="1.5"/>
    <path d="M122 67 L122 73" stroke="{{c2}}" stroke-width="1.5"/>

    <!-- Arms / Paws (sitting forward) -->
    <!-- Left Arm -->
    <path d="M68 142 C50 154 44 180 58 192 C68 200 84 186 86 168 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
    <circle cx="62" cy="180" r="7" fill="{{c2}}" opacity="0.4"/>

    <!-- Right Arm -->
    <path d="M172 142 C190 154 196 180 182 192 C172 200 156 186 154 168 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
    <circle cx="178" cy="180" r="7" fill="{{c2}}" opacity="0.4"/>

    <!-- Body -->
    <path d="M82 138 C72 165 68 210 92 236 C105 248 135 248 148 236 C172 210 168 165 158 138 Z" fill="#FFFFFF" stroke="{{c1}}" stroke-width="3"/>
    
    <!-- Tummy Patch with stitches -->
    <ellipse cx="120" cy="190" rx="28" ry="32" fill="{{c2}}" opacity="0.3" stroke="{{c3}}" stroke-width="1.5" stroke-dasharray="3 4"/>
    <!-- Heart on Tummy -->
    <path d="M120 184 C116 178 108 180 108 188 C108 195 120 203 120 203 C120 203 132 195 132 188 C132 180 124 178 120 184 Z" fill="{{c1}}" opacity="0.75"/>

    <!-- Legs / Feet pads -->
    <!-- Left Foot -->
    <ellipse cx="78" cy="236" rx="22" ry="16" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
    <ellipse cx="78" cy="236" rx="14" ry="10" fill="{{c3}}" opacity="0.5"/>
    <circle cx="70" cy="228" r="2.5" fill="{{c1}}"/>
    <circle cx="78" cy="225" r="2.5" fill="{{c1}}"/>
    <circle cx="86" cy="228" r="2.5" fill="{{c1}}"/>

    <!-- Right Foot -->
    <ellipse cx="162" cy="236" rx="22" ry="16" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2.5"/>
    <ellipse cx="162" cy="236" rx="14" ry="10" fill="{{c3}}" opacity="0.5"/>
    <circle cx="154" cy="228" r="2.5" fill="{{c1}}"/>
    <circle cx="162" cy="225" r="2.5" fill="{{c1}}"/>
    <circle cx="170" cy="228" r="2.5" fill="{{c1}}"/>

    <!-- Bow Tie around neck -->
    <g class="bowtie">
      <path d="M120 142 L106 134 C100 130 96 138 100 146 L120 142 Z" fill="{{c1}}"/>
      <path d="M120 142 L134 134 C140 130 144 138 140 146 L120 142 Z" fill="{{c1}}"/>
      <circle cx="120" cy="142" r="4" fill="{{c2}}"/>
    </g>

    <!-- Floating starlight -->
    <path d="M36 80 Q36 86 42 86 Q36 86 36 92 Q36 86 30 86 Q36 86 36 80 Z" fill="{{c2}}"/>
    <path d="M204 88 Q204 94 210 94 Q204 94 204 100 Q204 94 198 94 Q204 94 204 88 Z" fill="{{c3}}"/>
    <circle cx="44" cy="136" r="2" fill="{{c1}}"/>
    <circle cx="196" cy="136" r="2" fill="{{c1}}"/>
  </g>
</svg>
