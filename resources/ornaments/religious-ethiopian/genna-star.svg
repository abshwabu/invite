<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Radiant Halo Circles (Center 110, 110) -->
    <circle cx="110" cy="110" r="92" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.4" />
    <circle cx="110" cy="110" r="72" stroke="{{c2}}" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.5" />
    <circle cx="110" cy="110" r="48" fill="{{c3}}" opacity="0.25" />

    <!-- Radiant Cardinal Ray Beams (c2) -->
    <g stroke="{{c2}}" stroke-width="1.2" opacity="0.7">
      <line x1="110" y1="12" x2="110" y2="4" />
      <line x1="110" y1="208" x2="110" y2="216" />
      <line x1="12" y1="110" x2="4" y2="110" />
      <line x1="208" y1="110" x2="216" y2="110" />
      <!-- Diagonal Rays -->
      <line x1="38" y1="38" x2="32" y2="32" />
      <line x1="182" y1="38" x2="188" y2="32" />
      <line x1="38" y1="182" x2="32" y2="188" />
      <line x1="182" y1="182" x2="188" y2="188" />
    </g>

    <!-- 8-POINTED MULTIFACETED GENNA STAR (Center 110, 110) -->
    <!-- Primary Cardinal Spikes (Longer rays extending to radius 95) -->
    <!-- Top Spike (110, 15) -->
    <polygon points="110,15 118,78 110,110" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="110,15 102,78 110,110" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Bottom Spike (110, 205) -->
    <polygon points="110,205 118,142 110,110" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="110,205 102,142 110,110" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Right Spike (205, 110) -->
    <polygon points="205,110 142,102 110,110" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="205,110 142,118 110,110" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Left Spike (15, 110) -->
    <polygon points="15,110 78,102 110,110" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="15,110 78,118 110,110" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Secondary Diagonal Spikes (Medium rays extending to radius 68) -->
    <!-- Top-Right Spike (158, 62) -->
    <polygon points="158,62 125,82 110,110" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    <polygon points="158,62 138,95 110,110" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />

    <!-- Bottom-Right Spike (158, 158) -->
    <polygon points="158,158 138,125 110,110" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    <polygon points="158,158 125,138 110,110" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />

    <!-- Bottom-Left Spike (62, 158) -->
    <polygon points="62,158 95,138 110,110" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    <polygon points="62,158 82,125 110,110" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />

    <!-- Top-Left Spike (62, 62) -->
    <polygon points="62,62 82,95 110,110" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
    <polygon points="62,62 95,82 110,110" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1" />

    <!-- Central Radiant Rosette (Center 110, 110) -->
    <circle cx="110" cy="110" r="28" fill="{{c1}}" stroke="{{c3}}" stroke-width="1.8" />
    <circle cx="110" cy="110" r="20" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Inner Ethiopian Cross Motif in Rosette Core -->
    <polygon points="110,95 114,106 125,110 114,114 110,125 106,114 95,110 106,106" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
    <circle cx="110" cy="110" r="4.5" fill="{{c1}}" />
    <circle cx="110" cy="110" r="2" fill="{{c2}}" />

    <!-- Finial Diamond Pearls on Star Tips -->
    <polygon points="110,8 113,12 110,16 107,12" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="110,212 113,208 110,204 107,208" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="212,110 208,113 204,110 208,107" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="8,110 12,113 16,110 12,107" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />

    <!-- Floating starlight pearls -->
    <circle cx="140" cy="45" r="2" fill="{{c1}}" />
    <circle cx="80" cy="45" r="2" fill="{{c1}}" />
    <circle cx="175" cy="140" r="2" fill="{{c1}}" />
    <circle cx="45" cy="140" r="2" fill="{{c1}}" />
  </g>
</svg>
