<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top continuous framing rails -->
    <path d="M0,3 L120,3" stroke="{{c1}}" stroke-width="1.6" />
    <path d="M0,6 L120,6" stroke="{{c2}}" stroke-width="0.8" stroke-dasharray="2,2" />

    <!-- Bottom continuous framing rails -->
    <path d="M0,34 L120,34" stroke="{{c2}}" stroke-width="0.8" stroke-dasharray="2,2" />
    <path d="M0,37 L120,37" stroke="{{c1}}" stroke-width="1.6" />

    <!-- Horizontal Connecting Straps between Crosses (Period = 40) -->
    <!-- Link between Cross 1 (x=20) and Cross 2 (x=60) at x=32..48 -->
    <rect x="32" y="17" width="16" height="6" rx="2" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
    <circle cx="40" cy="20" r="1.8" fill="{{c2}}" />

    <!-- Link between Cross 2 (x=60) and Cross 3 (x=100) at x=72..88 -->
    <rect x="72" y="17" width="16" height="6" rx="2" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
    <circle cx="80" cy="20" r="1.8" fill="{{c2}}" />

    <!-- Link wrap-around between Cross 3 (x=100) and Cross 1 (x=20 of next tile) -->
    <!-- Left edge link at x=0..8 -->
    <path d="M0,17 L8,17 L8,23 L0,23" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
    <circle cx="0" cy="20" r="1.8" fill="{{c2}}" />
    <!-- Right edge link at x=112..120 -->
    <path d="M120,17 L112,17 L112,23 L120,23" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
    <circle cx="120" cy="20" r="1.8" fill="{{c2}}" />

    <!-- 3 LALIBELA CROSSES (Period 40: centers at x=20, x=60, x=100, y=20) -->

    <!-- Cross 1 (Center x=20, y=20) -->
    <g transform="translate(20, 20)">
      <!-- Cross Arms with Flared Trefoils -->
      <!-- Vertical Mast -->
      <path d="M-4,-12 L4,-12 L4,12 L-4,12 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
      <!-- Horizontal Beam -->
      <path d="M-12,-4 L12,-4 L12,4 L-12,4 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
      <!-- Center Core Pierced Window -->
      <polygon points="0,-3 3,0 0,3 -3,0" fill="{{c2}}" stroke="{{c3}}" stroke-width="0.8" />

      <!-- Trefoil Terminal Finials -->
      <!-- Top -->
      <circle cx="0" cy="-13" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-3" cy="-11" r="1.5" fill="{{c3}}" />
      <circle cx="3" cy="-11" r="1.5" fill="{{c3}}" />
      <!-- Bottom -->
      <circle cx="0" cy="13" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-3" cy="11" r="1.5" fill="{{c3}}" />
      <circle cx="3" cy="11" r="1.5" fill="{{c3}}" />
      <!-- Left -->
      <circle cx="-13" cy="0" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-11" cy="-3" r="1.5" fill="{{c3}}" />
      <circle cx="-11" cy="3" r="1.5" fill="{{c3}}" />
      <!-- Right -->
      <circle cx="13" cy="0" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="11" cy="-3" r="1.5" fill="{{c3}}" />
      <circle cx="11" cy="3" r="1.5" fill="{{c3}}" />

      <!-- Diagonal Corner Openwork Rings -->
      <circle cx="-7" cy="-7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="7" cy="-7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="-7" cy="7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="7" cy="7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
    </g>

    <!-- Cross 2 (Center x=60, y=20) -->
    <g transform="translate(60, 20)">
      <path d="M-4,-12 L4,-12 L4,12 L-4,12 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M-12,-4 L12,-4 L12,4 L-12,4 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
      <polygon points="0,-3 3,0 0,3 -3,0" fill="{{c2}}" stroke="{{c3}}" stroke-width="0.8" />

      <circle cx="0" cy="-13" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-3" cy="-11" r="1.5" fill="{{c3}}" />
      <circle cx="3" cy="-11" r="1.5" fill="{{c3}}" />
      <circle cx="0" cy="13" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-3" cy="11" r="1.5" fill="{{c3}}" />
      <circle cx="3" cy="11" r="1.5" fill="{{c3}}" />
      <circle cx="-13" cy="0" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-11" cy="-3" r="1.5" fill="{{c3}}" />
      <circle cx="-11" cy="3" r="1.5" fill="{{c3}}" />
      <circle cx="13" cy="0" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="11" cy="-3" r="1.5" fill="{{c3}}" />
      <circle cx="11" cy="3" r="1.5" fill="{{c3}}" />

      <circle cx="-7" cy="-7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="7" cy="-7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="-7" cy="7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="7" cy="7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
    </g>

    <!-- Cross 3 (Center x=100, y=20) -->
    <g transform="translate(100, 20)">
      <path d="M-4,-12 L4,-12 L4,12 L-4,12 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M-12,-4 L12,-4 L12,4 L-12,4 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
      <polygon points="0,-3 3,0 0,3 -3,0" fill="{{c2}}" stroke="{{c3}}" stroke-width="0.8" />

      <circle cx="0" cy="-13" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-3" cy="-11" r="1.5" fill="{{c3}}" />
      <circle cx="3" cy="-11" r="1.5" fill="{{c3}}" />
      <circle cx="0" cy="13" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-3" cy="11" r="1.5" fill="{{c3}}" />
      <circle cx="3" cy="11" r="1.5" fill="{{c3}}" />
      <circle cx="-13" cy="0" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-11" cy="-3" r="1.5" fill="{{c3}}" />
      <circle cx="-11" cy="3" r="1.5" fill="{{c3}}" />
      <circle cx="13" cy="0" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="11" cy="-3" r="1.5" fill="{{c3}}" />
      <circle cx="11" cy="3" r="1.5" fill="{{c3}}" />

      <circle cx="-7" cy="-7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="7" cy="-7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="-7" cy="7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
      <circle cx="7" cy="7" r="1.8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.6" />
    </g>
  </g>
</svg>
