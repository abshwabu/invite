<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Continuous Guard Stripe Borders (Top & Bottom) -->
    <path d="M0,3 L120,3" stroke="{{c1}}" stroke-width="1.8" />
    <path d="M0,6 L120,6" stroke="{{c2}}" stroke-width="1" stroke-dasharray="2,2" />
    <path d="M0,8 L120,8" stroke="{{c1}}" stroke-width="1" />

    <path d="M0,32 L120,32" stroke="{{c1}}" stroke-width="1" />
    <path d="M0,34 L120,34" stroke="{{c2}}" stroke-width="1" stroke-dasharray="2,2" />
    <path d="M0,37 L120,37" stroke="{{c1}}" stroke-width="1.8" />

    <!-- 4 Continuous Chevron Diamond Units (Period = 30: 0..30, 30..60, 60..90, 90..120) -->
    <!-- Unit 1 (Center x=15) -->
    <polygon points="15,8 30,20 15,32 0,20" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.5" />
    <polygon points="15,11 26,20 15,29 4,20" fill="{{c2}}" opacity="0.75" stroke="{{c3}}" stroke-width="1" />
    <polygon points="15,14 22,20 15,26 8,20" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="0.8" />
    <circle cx="15" cy="20" r="2.2" fill="{{c1}}" />

    <!-- Unit 2 (Center x=45) -->
    <polygon points="45,8 60,20 45,32 30,20" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.5" />
    <polygon points="45,11 56,20 45,29 34,20" fill="{{c2}}" opacity="0.75" stroke="{{c3}}" stroke-width="1" />
    <polygon points="45,14 52,20 45,26 38,20" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="0.8" />
    <circle cx="45" cy="20" r="2.2" fill="{{c1}}" />

    <!-- Unit 3 (Center x=75) -->
    <polygon points="75,8 90,20 75,32 60,20" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.5" />
    <polygon points="75,11 86,20 75,29 64,20" fill="{{c2}}" opacity="0.75" stroke="{{c3}}" stroke-width="1" />
    <polygon points="75,14 82,20 75,26 68,20" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="0.8" />
    <circle cx="75" cy="20" r="2.2" fill="{{c1}}" />

    <!-- Unit 4 (Center x=105) -->
    <polygon points="105,8 120,20 105,32 90,20" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.5" />
    <polygon points="105,11 116,20 105,29 94,20" fill="{{c2}}" opacity="0.75" stroke="{{c3}}" stroke-width="1" />
    <polygon points="105,14 112,20 105,26 98,20" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="0.8" />
    <circle cx="105" cy="20" r="2.2" fill="{{c1}}" />

    <!-- Triangular Teeth Fill in spaces between diamonds -->
    <!-- Top triangles at x=30, x=60, x=90 -->
    <polygon points="24,8 30,13 36,8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="54,8 60,13 66,8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="84,8 90,13 96,8" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <!-- Top edges at x=0 and x=120 (split triangle for seamless wrap) -->
    <polygon points="0,8 6,8 0,13" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="120,8 114,8 120,13" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />

    <!-- Bottom triangles at x=30, x=60, x=90 -->
    <polygon points="24,32 30,27 36,32" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="54,32 60,27 66,32" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="84,32 90,27 96,32" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <!-- Bottom edges at x=0 and x=120 -->
    <polygon points="0,32 6,32 0,27" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
    <polygon points="120,32 114,32 120,27" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
  </g>
</svg>
