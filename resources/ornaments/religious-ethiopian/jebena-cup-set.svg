<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Jebena pot: x=95; Cini cups on right: x=175 and x=205 -->

    <!-- JEBENA STRAW RING STAND (Matot / woven ring below rounded base) -->
    <ellipse cx="95" cy="192" rx="36" ry="12" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="2" />
    <ellipse cx="95" cy="192" rx="28" ry="8" fill="{{c2}}" opacity="0.75" stroke="{{c3}}" stroke-width="1.2" />
    <path d="M68,192 C74,202 116,202 122,192" stroke="{{c3}}" stroke-width="1" stroke-dasharray="2,2" />

    <!-- JEBENA CLAY POT BODY -->
    <!-- Spherical Belly (Center x=95, y=145, radius=42) -->
    <circle cx="95" cy="145" r="42" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="2.5" />
    <!-- Clay Burnished Highlights (c2 & c3 tone) -->
    <path d="M72,122 C84,115 110,118 122,132 C132,144 130,165 118,175" stroke="{{c2}}" stroke-width="2" opacity="0.8" />
    <path d="M66,135 C72,128 85,126 95,130" stroke="{{c3}}" stroke-width="1.4" />

    <!-- Traditional Clay Incised Neck Bands (Tilet-style incised scratch markings) -->
    <path d="M80,112 C90,116 100,116 110,112" stroke="{{c3}}" stroke-width="1.4" />
    <path d="M82,106 C90,110 100,110 108,106" stroke="{{c2}}" stroke-width="1.2" />

    <!-- Slender Elegant Neck (x=95, y=55 to 105) -->
    <path d="M88,105 L84,55 L106,55 L102,105 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="2" />
    <path d="M90,102 L87,58 L103,58 L100,102 Z" fill="{{c2}}" opacity="0.4" stroke="{{c3}}" stroke-width="0.8" />

    <!-- Flared Neck Rim (y=48 to 55) -->
    <ellipse cx="95" cy="55" rx="14" ry="4.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.6" />

    <!-- Straw Neck Stopper (Tifat / woven plug at top) -->
    <path d="M89,52 C89,40 101,40 101,52 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.4" />
    <line x1="95" y1="36" x2="95" y2="44" stroke="{{c1}}" stroke-width="1.6" />
    <circle cx="95" cy="35" r="2.5" fill="{{c2}}" />

    <!-- Graceful Pouring Spout (Left side: emerges from belly at x=65, y=130 and curves to 26, 85) -->
    <path d="M68,135 C52,130 35,115 28,88 C34,88 45,95 62,118 Z" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="2" />
    <!-- Spout Opening Rim -->
    <ellipse cx="28" cy="87" rx="4" ry="7" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.4" />

    <!-- Jebena Handle (Right side: arching from neck at x=104, y=70 to belly at x=135, y=140) -->
    <path d="M104,70 C135,65 155,100 135,140" stroke="{{c1}}" stroke-width="4.5" />
    <path d="M104,70 C132,68 150,100 135,138" stroke="{{c2}}" stroke-width="1.8" />

    <!-- TWO CINI CUPS (Traditional handleless coffee cups with ceramic saucers) -->
    <!-- Table / Rekebot Surface Baseline -->
    <line x1="140" y1="202" x2="235" y2="202" stroke="{{c1}}" stroke-width="1.8" />
    <line x1="145" y1="206" x2="230" y2="206" stroke="{{c2}}" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Cini Cup 1 (Front / Left: Center x=170, y=170 to 202) -->
    <!-- Saucer plate -->
    <ellipse cx="170" cy="200" rx="20" ry="5.5" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.4" />
    <!-- Ceramic Cup Body -->
    <path d="M156,172 L158,194 C158,198 182,198 182,194 L184,172 Z" fill="{{c3}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.6" />
    <!-- Cup Rim & Black Coffee Surface -->
    <ellipse cx="170" cy="172" rx="14" ry="4" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
    <ellipse cx="170" cy="172" rx="10" ry="2.5" fill="{{c2}}" opacity="0.6" />
    <!-- Red/Gold decorative band on Cini porcelain -->
    <path d="M157,180 C162,183 178,183 183,180" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Cini Cup 2 (Right: Center x=208, y=170 to 202) -->
    <!-- Saucer plate -->
    <ellipse cx="208" cy="200" rx="20" ry="5.5" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.4" />
    <!-- Ceramic Cup Body -->
    <path d="M194,172 L196,194 C196,198 220,198 220,194 L222,172 Z" fill="{{c3}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.6" />
    <!-- Cup Rim & Black Coffee Surface -->
    <ellipse cx="208" cy="172" rx="14" ry="4" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.2" />
    <ellipse cx="208" cy="172" rx="10" ry="2.5" fill="{{c2}}" opacity="0.6" />
    <!-- Decorative band -->
    <path d="M195,180 C200,183 216,183 221,180" stroke="{{c1}}" stroke-width="1.2" />

    <!-- AROMATIC STEAM / INCENSE SMOKE (Rising in curls from spout & cups) -->
    <!-- Steam from Jebena Spout (28, 85) -->
    <path d="M26,82 C16,68 22,52 32,45 C42,38 38,22 30,14" stroke="{{c2}}" stroke-width="1.4" stroke-linecap="round" opacity="0.75" />
    <path d="M30,80 C22,68 28,54 36,48 C44,42 42,28 36,20" stroke="{{c3}}" stroke-width="1" opacity="0.6" stroke-dasharray="2,3" />

    <!-- Steam from Cini Cups (x=170 & 208) -->
    <path d="M170,165 C164,150 172,138 178,128 C184,118 178,105 172,95" stroke="{{c2}}" stroke-width="1.2" opacity="0.7" />
    <path d="M208,165 C214,150 206,138 200,128 C194,118 200,105 206,95" stroke="{{c2}}" stroke-width="1.2" opacity="0.7" />

    <!-- Roasted Coffee Beans scattered on tray -->
    <ellipse cx="146" cy="195" rx="3.5" ry="2.2" fill="{{c1}}" stroke="{{c1}}" stroke-width="0.8" />
    <line x1="144" y1="195" x2="148" y2="195" stroke="{{c3}}" stroke-width="0.6" />

    <ellipse cx="228" cy="196" rx="3.5" ry="2.2" fill="{{c1}}" stroke="{{c1}}" stroke-width="0.8" />
    <line x1="226" y1="196" x2="230" y2="196" stroke="{{c3}}" stroke-width="0.6" />
  </g>
</svg>
