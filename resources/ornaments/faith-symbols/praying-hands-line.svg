<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Radiant Halo Circle behind hands (Center 90, 80) -->
    <circle cx="90" cy="80" r="58" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.45" />
    <circle cx="90" cy="80" r="42" stroke="{{c2}}" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.5" />
    <circle cx="90" cy="80" r="28" fill="{{c3}}" opacity="0.2" />

    <!-- Radiant soft light rays (c2) -->
    <line x1="90" y1="20" x2="90" y2="10" stroke="{{c2}}" stroke-width="1.2" opacity="0.6" />
    <line x1="130" y1="36" x2="138" y2="28" stroke="{{c2}}" stroke-width="1.2" opacity="0.6" />
    <line x1="50" y1="36" x2="42" y2="28" stroke="{{c2}}" stroke-width="1.2" opacity="0.6" />
    <line x1="145" y1="75" x2="155" y2="75" stroke="{{c2}}" stroke-width="1.2" opacity="0.6" />
    <line x1="35" y1="75" x2="25" y2="75" stroke="{{c2}}" stroke-width="1.2" opacity="0.6" />

    <!-- Sleeve Cuffs at Base (Bottom: 90, 220) -->
    <!-- Left Sleeve Cuff -->
    <path d="M42,225 C45,195 56,180 68,175 C75,182 82,190 85,225 Z" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.6" />
    <path d="M48,225 C52,198 60,186 68,182" stroke="{{c3}}" stroke-width="1" />
    <!-- Right Sleeve Cuff -->
    <path d="M138,225 C135,195 124,180 112,175 C105,182 98,190 95,225 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.6" />
    <path d="M132,225 C128,198 120,186 112,182" stroke="{{c3}}" stroke-width="1" />

    <!-- Wrist & Palm Bases -->
    <path d="M68,175 C72,160 76,145 78,135" stroke="{{c1}}" stroke-width="2" />
    <path d="M112,175 C108,160 104,145 102,135" stroke="{{c1}}" stroke-width="2" />

    <!-- Hands clasped together in prayer -->
    <!-- Background Right Hand (c3/c2 shadow) -->
    <g fill="{{c2}}" opacity="0.45" stroke="{{c1}}" stroke-width="1.2">
      <!-- Right Index Finger Tip -->
      <path d="M92,35 C98,38 106,48 104,78 C102,96 102,120 102,135" />
      <!-- Right Middle Finger Tip -->
      <path d="M90,26 C96,28 102,36 102,56" />
      <!-- Right Ring Finger -->
      <path d="M98,52 C104,58 108,70 108,90" />
      <!-- Right Little Finger -->
      <path d="M106,75 C112,84 116,98 116,115" />
    </g>

    <!-- Foreground Left Hand & Fingers (c1 outline & fill) -->
    <!-- Palms touching at center line x=90 -->
    <!-- Left Hand Silhouette -->
    <path d="M78,135 C76,120 74,98 78,74 C80,62 82,48 88,28 C89,24 92,24 93,28 C95,45 95,68 94,92 C94,115 90,132 85,150" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="2" />

    <!-- Finger Separation Curves and Knuckles -->
    <!-- Middle Finger Line (Longest center finger) -->
    <path d="M88,28 C86,45 84,65 82,88" stroke="{{c3}}" stroke-width="1.2" />
    <!-- Index Finger -->
    <path d="M84,40 C80,56 78,76 78,98" stroke="{{c1}}" stroke-width="1.4" />
    <!-- Ring Finger -->
    <path d="M82,75 C78,92 76,110 76,125" stroke="{{c1}}" stroke-width="1.3" />
    <!-- Little Finger (Pinky) -->
    <path d="M76,105 C70,120 68,135 70,152" stroke="{{c1}}" stroke-width="1.4" />

    <!-- Thumbs crossed in front of palms -->
    <!-- Left Thumb -->
    <path d="M82,122 C84,112 88,106 94,108 C100,110 102,118 100,128 C96,138 90,146 84,152" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.6" />
    <!-- Right Thumb tucking behind -->
    <path d="M96,112 C98,118 98,126 94,134" stroke="{{c3}}" stroke-width="1.2" />

    <!-- Knuckle crease marks -->
    <path d="M84,52 C86,54 88,54 90,52" stroke="{{c3}}" stroke-width="0.8" />
    <path d="M82,70 C84,72 86,72 88,70" stroke="{{c3}}" stroke-width="0.8" />
    <path d="M80,92 C82,94 84,94 86,92" stroke="{{c3}}" stroke-width="0.8" />

    <!-- Gentle prayer shimmer sparkles -->
    <circle cx="90" cy="16" r="1.8" fill="{{c1}}" />
    <circle cx="104" cy="22" r="1.3" fill="{{c2}}" />
    <circle cx="76" cy="22" r="1.3" fill="{{c2}}" />
  </g>
</svg>
