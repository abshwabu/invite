<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Radiant Halo Ring (Center 100, 100) -->
    <circle cx="100" cy="100" r="82" stroke="{{c3}}" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.4" />
    <circle cx="100" cy="100" r="70" stroke="{{c2}}" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />

    <!-- Crescent Moon (Embracing from left/outer side) -->
    <!-- Outer Arc: center=(90, 100), radius=68; Inner Arc: center=(108, 100), radius=55 -->
    <path d="M112,38 C75,40 45,67 45,100 C45,133 75,160 112,162 C78,154 62,130 62,100 C62,70 78,46 112,38 Z" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="2" />

    <!-- Inner Crescent Soft Shading Layer (c2) -->
    <path d="M106,44 C76,48 54,72 54,100 C54,128 76,152 106,156 C80,148 68,126 68,100 C68,74 80,52 106,44 Z" fill="{{c2}}" opacity="0.5" stroke="{{c3}}" stroke-width="0.8" />

    <!-- Crescent Horn Finial Accents -->
    <circle cx="112" cy="38" r="2.2" fill="{{c3}}" />
    <circle cx="112" cy="162" r="2.2" fill="{{c3}}" />

    <!-- 8-Pointed Geometric Star embraced inside crescent (Center 124, 100) -->
    <!-- Two overlapping squares (0 deg and 45 deg) with faceted points -->
    <g transform="translate(124, 100)">
      <!-- Outer diamond points -->
      <!-- Square 1 (orthogonal) -->
      <polygon points="0,-32 23,-23 32,0 23,23 0,32 -23,23 -32,0 -23,-23" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.6" />
      <!-- Star facets (alternating c2 and c3 for 3D geometric depth) -->
      <!-- Top spike -->
      <polygon points="0,-32 0,0 23,-23" fill="{{c2}}" opacity="0.8" />
      <polygon points="0,-32 0,0 -23,-23" fill="{{c3}}" opacity="0.6" />
      <!-- Right spike -->
      <polygon points="32,0 0,0 23,-23" fill="{{c2}}" opacity="0.8" />
      <polygon points="32,0 0,0 23,23" fill="{{c3}}" opacity="0.6" />
      <!-- Bottom spike -->
      <polygon points="0,32 0,0 23,23" fill="{{c2}}" opacity="0.8" />
      <polygon points="0,32 0,0 -23,23" fill="{{c3}}" opacity="0.6" />
      <!-- Left spike -->
      <polygon points="-32,0 0,0 -23,-23" fill="{{c2}}" opacity="0.8" />
      <polygon points="-32,0 0,0 -23,23" fill="{{c3}}" opacity="0.6" />

      <!-- Inner Central 8-Point Rosette -->
      <circle cx="0" cy="0" r="12" fill="{{c1}}" stroke="{{c3}}" stroke-width="1" />
      <circle cx="0" cy="0" r="7" fill="{{c2}}" />
      <circle cx="0" cy="0" r="3" fill="{{c3}}" />
    </g>

    <!-- Floating celestial spark dots -->
    <circle cx="155" cy="55" r="1.8" fill="{{c1}}" />
    <circle cx="165" cy="135" r="1.8" fill="{{c1}}" />
    <circle cx="172" cy="95" r="1.4" fill="{{c2}}" />
    <circle cx="82" cy="72" r="1.5" fill="{{c3}}" />
    <circle cx="82" cy="128" r="1.5" fill="{{c3}}" />
  </g>
</svg>
