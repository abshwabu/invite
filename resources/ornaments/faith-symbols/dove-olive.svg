<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Radiant Halo / Aura (Center 115, 95) -->
    <ellipse cx="115" cy="95" rx="72" ry="54" fill="{{c3}}" opacity="0.22" stroke="{{c2}}" stroke-width="0.8" stroke-dasharray="2,3" />

    <!-- Far Wing (Background wing: c3/c2) -->
    <g>
      <path d="M105,100 C92,70 75,42 48,28 C56,48 64,72 74,94 C82,106 94,115 102,118" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M48,28 C58,36 65,48 64,58" stroke="{{c1}}" stroke-width="0.9" />
      <path d="M56,48 C64,58 72,70 70,80" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- Olive Sprig carried in beak (30, 95) -->
    <g transform="translate(32, 92)">
      <!-- Olive stem -->
      <path d="M0,0 C-12,5 -22,15 -28,28 C-32,38 -28,48 -24,55" stroke="{{c1}}" stroke-width="1.6" />
      <!-- Olive Leaves -->
      <g transform="translate(-14, 12) rotate(-20)">
        <path d="M0,0 C-10,-6 -20,-2 -22,6 C-14,10 -4,6 0,0 Z" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="0.9" />
      </g>
      <g transform="translate(-22, 26) rotate(35)">
        <path d="M0,0 C-12,-6 -22,-2 -24,6 C-15,10 -5,6 0,0 Z" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="0.9" />
      </g>
      <g transform="translate(-26, 42) rotate(-15)">
        <path d="M0,0 C-10,-6 -20,-2 -22,6 C-14,10 -4,6 0,0 Z" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="0.9" />
      </g>
      <!-- Tiny Olives -->
      <circle cx="-16" cy="18" r="2.5" fill="{{c1}}" />
      <circle cx="-24" cy="34" r="2.2" fill="{{c2}}" />
    </g>

    <!-- Dove Body and Head (Gliding gracefully to the left) -->
    <!-- Head at (45, 90), Tail at (195, 125) -->
    <path d="M48,92 C44,88 38,90 32,92 C38,95 42,98 48,96 C56,98 64,96 72,92 C82,88 94,86 105,92 C125,102 145,115 172,125 C162,130 148,132 135,130 C118,128 100,122 88,114 C76,108 62,106 52,102 Z" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="2" />

    <!-- Dove Eye and Beak -->
    <polygon points="32,92 24,94 32,96" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <circle cx="42" cy="92" r="1.6" fill="{{c3}}" />

    <!-- Near Wing (Large graceful wing sweeping upward to right) -->
    <g>
      <!-- Wing main body (c2) -->
      <path d="M102,94 C116,68 138,36 176,18 C164,44 148,72 130,96 C120,110 110,115 102,112 Z" fill="{{c2}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.8" />
      <!-- Wing inner covert feathers (c1/c3) -->
      <path d="M106,95 C116,78 128,58 148,44 C140,62 132,82 118,98 Z" fill="{{c1}}" opacity="0.35" stroke="{{c1}}" stroke-width="1.2" />

      <!-- Primary feather ribs -->
      <path d="M176,18 C166,32 156,48 158,62" stroke="{{c1}}" stroke-width="1.1" />
      <path d="M165,40 C155,54 146,68 148,80" stroke="{{c1}}" stroke-width="1.1" />
      <path d="M152,62 C144,74 136,88 138,98" stroke="{{c1}}" stroke-width="1" />
    </g>

    <!-- Tail Feathers (Fanning softly to the right) -->
    <g>
      <path d="M165,124 C185,132 205,142 220,148 C206,140 192,134 176,128 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M168,126 C190,138 212,152 225,160 C210,150 194,142 178,132 Z" fill="{{c1}}" opacity="0.85" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M170,128 C188,144 206,162 216,172 C204,158 190,148 178,136 Z" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.2" />
    </g>

    <!-- Divine rays / stardust -->
    <circle cx="168" cy="30" r="1.6" fill="{{c1}}" />
    <circle cx="178" cy="48" r="1.3" fill="{{c2}}" />
    <circle cx="140" cy="18" r="1.5" fill="{{c3}}" />
    <circle cx="95" cy="55" r="1.2" fill="{{c2}}" />
  </g>
</svg>
