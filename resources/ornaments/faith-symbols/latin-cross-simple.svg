<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Radiant Sunburst behind the intersection (90, 85) -->
    <circle cx="90" cy="85" r="46" stroke="{{c3}}" stroke-width="0.9" stroke-dasharray="2,3" opacity="0.5" />
    <circle cx="90" cy="85" r="32" stroke="{{c2}}" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.6" />

    <!-- Radiant Ray Beams (c2, c1) -->
    <g stroke="{{c2}}" stroke-width="1.2" opacity="0.6">
      <line x1="90" y1="42" x2="90" y2="30" />
      <line x1="120" y1="55" x2="130" y2="45" />
      <line x1="133" y1="85" x2="145" y2="85" />
      <line x1="120" y1="115" x2="130" y2="125" />
      <line x1="90" y1="128" x2="90" y2="140" />
      <line x1="60" y1="115" x2="50" y2="125" />
      <line x1="47" y1="85" x2="35" y2="85" />
      <line x1="60" y1="55" x2="50" y2="45" />
    </g>

    <!-- Stepped Pedestal Base (Bottom: 90, 240) -->
    <path d="M50,250 L130,250 L126,242 L54,242 Z" fill="{{c1}}" stroke="{{c1}}" stroke-width="1.6" />
    <path d="M60,242 L120,242 L116,234 L64,234 Z" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.4" />
    <path d="M72,234 L108,234 L105,226 L75,226 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Latin Cross Body: Beveled 3D Facets -->
    <!-- Vertical Mast: x=76 to 104, y=20 to 226 -->
    <!-- Horizontal Crossbeam: x=34 to 146, y=71 to 99 -->
    <!-- Intersection box: x=76 to 104, y=71 to 99, center=(90, 85) -->

    <!-- Left / Upper Bevel Facets (Light side: c2) -->
    <!-- Top arm left half -->
    <polygon points="76,20 90,20 90,85 76,71" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Left arm upper half -->
    <polygon points="34,71 90,85 76,71" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.2" />
    <polygon points="34,71 34,85 90,85" fill="{{c2}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Right arm upper half -->
    <polygon points="90,85 104,71 146,71 146,85" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Bottom arm left half -->
    <polygon points="76,99 90,85 90,226 76,226" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Right / Lower Bevel Facets (Shadow side: c3 / c1) -->
    <!-- Top arm right half -->
    <polygon points="90,20 104,20 104,71 90,85" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Left arm lower half -->
    <polygon points="34,85 34,99 76,99 90,85" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Right arm lower half -->
    <polygon points="90,85 146,85 146,99 104,99" fill="{{c1}}" opacity="0.9" stroke="{{c1}}" stroke-width="1.2" />
    <!-- Bottom arm right half -->
    <polygon points="90,85 104,99 104,226 90,226" fill="{{c1}}" opacity="0.95" stroke="{{c1}}" stroke-width="1.2" />

    <!-- Outer Profile Stroke Contour -->
    <path d="M76,226 L76,99 L34,99 L34,71 L76,71 L76,20 L104,20 L104,71 L146,71 L146,99 L104,99 L104,226 Z" stroke="{{c1}}" stroke-width="2.2" />

    <!-- Central Ridge Bevel Lines -->
    <line x1="90" y1="20" x2="90" y2="226" stroke="{{c3}}" stroke-width="1" />
    <line x1="34" y1="85" x2="146" y2="85" stroke="{{c3}}" stroke-width="1" />
    <!-- Center Jewel Facet -->
    <polygon points="90,80 95,85 90,90 85,85" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
    <circle cx="90" cy="85" r="2" fill="{{c1}}" />
  </g>
</svg>
