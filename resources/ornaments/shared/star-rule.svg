<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" fill="none">
  <!-- Celestial starlight divider with faceted 8-point star and tapered rule rays -->
  <g class="star-rule" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center coordinate: (200, 20) -->

    <!-- Left Tapered Rule Line -->
    <line x1="20" y1="20" x2="140" y2="20" stroke="{{c1}}" stroke-width="2"/>
    <line x1="40" y1="20" x2="140" y2="20" stroke="{{c2}}" stroke-width="1"/>
    <!-- Left Satellite Sparkle at x=155 -->
    <path d="M155 12 Q155 20 163 20 Q155 20 155 28 Q155 20 147 20 Q155 20 155 12 Z" fill="{{c2}}"/>
    <circle cx="172" cy="20" r="2.5" fill="{{c3}}"/>
    <circle cx="184" cy="20" r="3.2" fill="{{c1}}"/>

    <!-- Right Tapered Rule Line -->
    <line x1="260" y1="20" x2="380" y2="20" stroke="{{c1}}" stroke-width="2"/>
    <line x1="260" y1="20" x2="360" y2="20" stroke="{{c2}}" stroke-width="1"/>
    <!-- Right Satellite Sparkle at x=245 -->
    <path d="M245 12 Q245 20 253 20 Q245 20 245 28 Q245 20 237 20 Q245 20 245 12 Z" fill="{{c2}}"/>
    <circle cx="228" cy="20" r="2.5" fill="{{c3}}"/>
    <circle cx="216" cy="20" r="3.2" fill="{{c1}}"/>

    <!-- Center Hero 8-point Faceted Star -->
    <g class="center-star">
      <!-- Outer Soft Glow Corona -->
      <circle cx="200" cy="20" r="14" fill="{{c2}}" opacity="0.2"/>
      
      <!-- 8-Point Star Geometry -->
      <!-- Cardinal points (larger) -->
      <polygon points="200,2 204,16 218,20 204,24 200,38 196,24 182,20 196,16" fill="{{c1}}" stroke="{{c2}}" stroke-width="1.5"/>
      <!-- Diagonal points (smaller) -->
      <polygon points="200,8 203,17 212,11 204,20 209,29 201,23 192,27 197,18" fill="{{c2}}" opacity="0.8"/>
      
      <!-- Central Brilliant Pearl -->
      <circle cx="200" cy="20" r="3.5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1"/>
      <circle cx="200" cy="20" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Outer Terminal Diamonds on rule ends -->
    <polygon points="20,20 24,17 28,20 24,23" fill="{{c1}}"/>
    <polygon points="380,20 376,17 372,20 376,23" fill="{{c1}}"/>
  </g>
</svg>
