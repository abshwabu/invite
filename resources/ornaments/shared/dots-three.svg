<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 30" fill="none">
  <!-- Minimalist luxury three-dot divider with fine flanking tapered rule lines -->
  <g class="dots-three" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center coordinate: (180, 15) -->

    <!-- Left Tapered Rule Line -->
    <line x1="20" y1="15" x2="140" y2="15" stroke="{{c1}}" stroke-width="2"/>
    <line x1="45" y1="15" x2="135" y2="15" stroke="{{c2}}" stroke-width="1"/>
    <!-- Left end terminal -->
    <circle cx="20" cy="15" r="2" fill="{{c1}}"/>

    <!-- Right Tapered Rule Line -->
    <line x1="220" y1="15" x2="340" y2="15" stroke="{{c1}}" stroke-width="2"/>
    <line x1="225" y1="15" x2="315" y2="15" stroke="{{c2}}" stroke-width="1"/>
    <!-- Right end terminal -->
    <circle cx="340" cy="15" r="2" fill="{{c1}}"/>

    <!-- Central Trio of Pearls (Dots Three) -->
    <!-- Left Dot: (160, 15) -->
    <circle cx="160" cy="15" r="8" fill="{{c2}}" opacity="0.2"/>
    <circle cx="160" cy="15" r="5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5"/>
    <circle cx="160" cy="15" r="2" fill="#FFFFFF" opacity="0.8"/>

    <!-- Center Hero Dot: (180, 15) -->
    <circle cx="180" cy="15" r="11" fill="{{c2}}" opacity="0.25"/>
    <circle cx="180" cy="15" r="7.5" fill="{{c1}}" stroke="{{c2}}" stroke-width="2"/>
    <circle cx="180" cy="15" r="3" fill="#FFFFFF"/>

    <!-- Right Dot: (200, 15) -->
    <circle cx="200" cy="15" r="8" fill="{{c2}}" opacity="0.2"/>
    <circle cx="200" cy="15" r="5" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5"/>
    <circle cx="200" cy="15" r="2" fill="#FFFFFF" opacity="0.8"/>

    <!-- Micro Accent Diamonds flanking the dots -->
    <polygon points="146,15 149,13 152,15 149,17" fill="{{c3}}"/>
    <polygon points="208,15 211,13 214,15 211,17" fill="{{c3}}"/>
  </g>
</svg>
