<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 30" fill="none">
  <!-- Sophisticated modern hairline divider with center geometric gap and tick accents -->
  <g class="thin-line-gap" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center coordinate: (190, 15) -->

    <!-- Left Hairline Rule -->
    <line x1="20" y1="15" x2="165" y2="15" stroke="{{c1}}" stroke-width="1.8"/>
    <!-- Left Parallel Accent Line -->
    <line x1="60" y1="18" x2="160" y2="18" stroke="{{c2}}" stroke-width="1" stroke-dasharray="3 4"/>
    <!-- Left Gap Stop Tick -->
    <line x1="165" y1="10" x2="165" y2="20" stroke="{{c1}}" stroke-width="2"/>
    <circle cx="165" cy="15" r="2" fill="{{c2}}"/>

    <!-- Right Hairline Rule -->
    <line x1="215" y1="15" x2="360" y2="15" stroke="{{c1}}" stroke-width="1.8"/>
    <!-- Right Parallel Accent Line -->
    <line x1="220" y1="18" x2="320" y2="18" stroke="{{c2}}" stroke-width="1" stroke-dasharray="3 4"/>
    <!-- Right Gap Stop Tick -->
    <line x1="215" y1="10" x2="215" y2="20" stroke="{{c1}}" stroke-width="2"/>
    <circle cx="215" cy="15" r="2" fill="{{c2}}"/>

    <!-- Central Geometric Break / Motif in the Gap (x=165 to x=215) -->
    <!-- Outer Precision Ring -->
    <circle cx="190" cy="15" r="10" fill="#FFFFFF" stroke="{{c1}}" stroke-width="2"/>
    <circle cx="190" cy="15" r="7" stroke="{{c2}}" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- Center Diamond / Node inside the ring -->
    <polygon points="190,10 195,15 190,20 185,15" fill="{{c1}}" stroke="{{c2}}" stroke-width="1"/>
    <circle cx="190" cy="15" r="1.5" fill="#FFFFFF"/>

    <!-- Outer Terminal End Ticks -->
    <line x1="20" y1="11" x2="20" y2="19" stroke="{{c1}}" stroke-width="1.5"/>
    <line x1="360" y1="11" x2="360" y2="19" stroke="{{c1}}" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="1.8" fill="{{c3}}"/>
    <circle cx="360" cy="15" r="1.8" fill="{{c3}}"/>
  </g>
</svg>
