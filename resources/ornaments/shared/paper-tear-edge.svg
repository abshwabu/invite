<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" fill="none">
  <!-- Realistic deckled torn paper edge with fibrous paper fringe and shadow layer -->
  <g class="paper-tear-edge" stroke-linecap="round" stroke-linejoin="round">
    <!-- Drop Shadow of the Torn Paper Edge -->
    <path d="M 0 0 
      H 400 
      V 24 
      C 385 28 375 22 360 26 
      C 345 30 335 38 320 34 
      C 305 30 295 24 280 27 
      C 265 30 255 36 240 32 
      C 225 28 215 22 200 25 
      C 185 28 175 36 160 33 
      C 145 30 135 24 120 27 
      C 105 30 95 38 80 34 
      C 65 30 55 22 40 25 
      C 25 28 15 34 0 30 Z" 
      fill="{{c3}}" opacity="0.35"/>

    <!-- Exposed Inner Rag Fiber Layer (Deckle Underlayer) -->
    <path d="M 0 0 
      H 400 
      V 20 
      C 388 25 376 19 362 23 
      C 348 27 336 34 322 31 
      C 308 28 296 21 282 24 
      C 268 27 256 33 242 29 
      C 228 25 216 19 202 22 
      C 188 25 176 32 162 29 
      C 148 26 136 20 122 23 
      C 108 26 96 34 82 30 
      C 68 26 56 19 42 22 
      C 28 25 16 30 0 26 Z" 
      fill="{{c2}}" opacity="0.45"/>

    <!-- Main Front Torn Paper Sheet -->
    <path d="M 0 0 
      H 400 
      V 16 
      C 390 20 378 14 365 18 
      C 350 22 338 29 325 26 
      C 310 23 298 17 285 20 
      C 270 23 258 29 245 25 
      C 230 21 218 15 205 18 
      C 190 21 178 28 165 25 
      C 150 22 138 16 125 19 
      C 110 22 98 29 85 25 
      C 70 21 58 15 45 18 
      C 30 21 18 26 0 22 Z" 
      fill="#FFFFFF" stroke="{{c1}}" stroke-width="1.8"/>

    <!-- Fine Raw Fiber Tufts / Feathering along the tear lip -->
    <g stroke="{{c1}}" stroke-width="1" opacity="0.6">
      <line x1="25" y1="20" x2="27" y2="25"/>
      <line x1="55" y1="18" x2="57" y2="23"/>
      <line x1="90" y1="26" x2="92" y2="31"/>
      <line x1="130" y1="20" x2="132" y2="25"/>
      <line x1="170" y1="26" x2="173" y2="31"/>
      <line x1="210" y1="19" x2="212" y2="24"/>
      <line x1="250" y1="26" x2="252" y2="31"/>
      <line x1="290" y1="19" x2="293" y2="24"/>
      <line x1="330" y1="27" x2="333" y2="32"/>
      <line x1="370" y1="19" x2="373" y2="24"/>
    </g>

    <!-- Secondary subtle deckle flecks -->
    <circle cx="48" cy="22" r="1" fill="{{c2}}"/>
    <circle cx="112" cy="24" r="1.2" fill="{{c2}}"/>
    <circle cx="185" cy="23" r="1" fill="{{c2}}"/>
    <circle cx="265" cy="25" r="1.2" fill="{{c2}}"/>
    <circle cx="345" cy="24" r="1" fill="{{c2}}"/>
  </g>
</svg>
