<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" fill="none">
  <!-- Circular luxury medallion frame with laurel wreath ring and corner anchor flourishes -->
  <g class="circle-frame" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center coordinate: (170, 170) -->

    <!-- Four Corner Anchor Flourishes -->
    <!-- Top-Left Corner (170, 170) towards (20, 20) -->
    <g class="flourish-tl">
      <path d="M30 30 C70 30 110 50 130 90" stroke="{{c2}}" stroke-width="1.8" fill="none"/>
      <path d="M30 30 C30 70 50 110 90 130" stroke="{{c2}}" stroke-width="1.8" fill="none"/>
      <circle cx="30" cy="30" r="4.5" fill="{{c1}}"/>
      <polygon points="55,55 60,50 65,55 60,60" fill="{{c3}}"/>
    </g>

    <!-- Top-Right Corner -->
    <g class="flourish-tr">
      <path d="M310 30 C270 30 230 50 210 90" stroke="{{c2}}" stroke-width="1.8" fill="none"/>
      <path d="M310 30 C310 70 290 110 250 130" stroke="{{c2}}" stroke-width="1.8" fill="none"/>
      <circle cx="310" cy="30" r="4.5" fill="{{c1}}"/>
      <polygon points="285,55 280,50 275,55 280,60" fill="{{c3}}"/>
    </g>

    <!-- Bottom-Left Corner -->
    <g class="flourish-bl">
      <path d="M30 310 C70 310 110 290 130 250" stroke="{{c2}}" stroke-width="1.8" fill="none"/>
      <path d="M30 310 C30 270 50 230 90 210" stroke="{{c2}}" stroke-width="1.8" fill="none"/>
      <circle cx="30" cy="310" r="4.5" fill="{{c1}}"/>
      <polygon points="55,285 60,280 65,285 60,290" fill="{{c3}}"/>
    </g>

    <!-- Bottom-Right Corner -->
    <g class="flourish-br">
      <path d="M310 310 C270 310 230 290 210 250" stroke="{{c2}}" stroke-width="1.8" fill="none"/>
      <path d="M310 310 C310 270 290 230 250 210" stroke="{{c2}}" stroke-width="1.8" fill="none"/>
      <circle cx="310" cy="310" r="4.5" fill="{{c1}}"/>
      <polygon points="285,285 280,280 275,285 280,290" fill="{{c3}}"/>
    </g>

    <!-- Outer Concentric Circular Border (Radius 145) -->
    <circle cx="170" cy="170" r="145" stroke="{{c1}}" stroke-width="3" fill="none"/>

    <!-- Laurel Beaded Wreath Ring (Radius 135) with 24 orbiting pearls -->
    <circle cx="170" cy="170" r="135" stroke="{{c2}}" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
    <g fill="{{c1}}">
      <circle cx="170" cy="35" r="4"/>
      <circle cx="204" cy="40" r="3"/>
      <circle cx="236" cy="54" r="3"/>
      <circle cx="266" cy="74" r="3"/>
      <circle cx="286" cy="104" r="3"/>
      <circle cx="300" cy="136" r="3"/>
      <circle cx="305" cy="170" r="4"/>
      <circle cx="300" cy="204" r="3"/>
      <circle cx="286" cy="236" r="3"/>
      <circle cx="266" cy="266" r="3"/>
      <circle cx="236" cy="286" r="3"/>
      <circle cx="204" cy="300" r="3"/>
      <circle cx="170" cy="305" r="4"/>
      <circle cx="136" cy="300" r="3"/>
      <circle cx="104" cy="286" r="3"/>
      <circle cx="74" cy="266" r="3"/>
      <circle cx="54" cy="236" r="3"/>
      <circle cx="40" cy="204" r="3"/>
      <circle cx="35" cy="170" r="4"/>
      <circle cx="40" cy="136" r="3"/>
      <circle cx="54" cy="104" r="3"/>
      <circle cx="74" cy="74" r="3"/>
      <circle cx="104" cy="54" r="3"/>
      <circle cx="136" cy="40" r="3"/>
    </g>

    <!-- Intermediate Smooth Ring (Radius 122) -->
    <circle cx="170" cy="170" r="122" stroke="{{c2}}" stroke-width="2.2" fill="none"/>

    <!-- Inner Hairline Ring (Radius 114) -->
    <circle cx="170" cy="170" r="114" stroke="{{c3}}" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>

    <!-- Cardinal Diamond Accents -->
    <polygon points="170,20 174,25 170,30 166,25" fill="{{c2}}"/>
    <polygon points="320,170 315,174 310,170 315,166" fill="{{c2}}"/>
    <polygon points="170,320 174,315 170,310 166,315" fill="{{c2}}"/>
    <polygon points="20,170 25,174 30,170 25,166" fill="{{c2}}"/>
  </g>
</svg>
