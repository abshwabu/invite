<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <!-- Vintage admission ticket frame with concave corner scallops and perforated stub line -->
  <g class="ticket-frame" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Ticket Contour with Inward Circular Concave Notches on 4 Corners -->
    <!-- Bounds: 20 to 300 x, 20 to 420 y. Corner notch radius = 24 -->
    <path d="M 44 20 
      H 276 
      A 24 24 0 0 0 300 44 
      V 396 
      A 24 24 0 0 0 276 420 
      H 44 
      A 24 24 0 0 0 20 396 
      V 44 
      A 24 24 0 0 0 44 20 Z" 
      stroke="{{c1}}" stroke-width="3" fill="none"/>

    <!-- Inset Border (Inset 8px) -->
    <path d="M 50 28 
      H 270 
      A 18 18 0 0 0 292 50 
      V 390 
      A 18 18 0 0 0 270 412 
      H 50 
      A 18 18 0 0 0 28 390 
      V 50 
      A 18 18 0 0 0 50 28 Z" 
      stroke="{{c2}}" stroke-width="1.8" fill="none"/>

    <!-- Innermost Dotted Security Hairline -->
    <path d="M 56 34 
      H 264 
      A 14 14 0 0 0 286 56 
      V 384 
      A 14 14 0 0 0 264 406 
      H 56 
      A 14 14 0 0 0 34 384 
      V 56 
      A 14 14 0 0 0 56 34 Z" 
      stroke="{{c3}}" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>

    <!-- Perforated Stub Tear Line across y=320 -->
    <!-- Side Notches at (20, 320) and (300, 320) -->
    <line x1="28" y1="320" x2="292" y2="320" stroke="{{c1}}" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="28" cy="320" r="3.5" fill="{{c2}}"/>
    <circle cx="292" cy="320" r="3.5" fill="{{c2}}"/>

    <!-- Vintage Corner Rivet Medallions -->
    <!-- Top-Left Corner (20, 20) -->
    <g class="rivet-tl">
      <circle cx="20" cy="20" r="7" stroke="{{c2}}" stroke-width="1.5" fill="{{c1}}"/>
      <circle cx="20" cy="20" r="2.5" fill="{{c2}}"/>
      <path d="M36 36 L42 42" stroke="{{c3}}" stroke-width="1.5"/>
    </g>

    <!-- Top-Right Corner (300, 20) -->
    <g class="rivet-tr">
      <circle cx="300" cy="20" r="7" stroke="{{c2}}" stroke-width="1.5" fill="{{c1}}"/>
      <circle cx="300" cy="20" r="2.5" fill="{{c2}}"/>
      <path d="M284 36 L278 42" stroke="{{c3}}" stroke-width="1.5"/>
    </g>

    <!-- Bottom-Left Corner (20, 420) -->
    <g class="rivet-bl">
      <circle cx="20" cy="420" r="7" stroke="{{c2}}" stroke-width="1.5" fill="{{c1}}"/>
      <circle cx="20" cy="420" r="2.5" fill="{{c2}}"/>
      <path d="M36 404 L42 398" stroke="{{c3}}" stroke-width="1.5"/>
    </g>

    <!-- Bottom-Right Corner (300, 420) -->
    <g class="rivet-br">
      <circle cx="300" cy="420" r="7" stroke="{{c2}}" stroke-width="1.5" fill="{{c1}}"/>
      <circle cx="300" cy="420" r="2.5" fill="{{c2}}"/>
      <path d="M284 404 L278 398" stroke="{{c3}}" stroke-width="1.5"/>
    </g>

    <!-- Top & Bottom Midpoint Stars -->
    <polygon points="160,24 162,28 166,28 163,30 164,34 160,32 156,34 157,30 154,28 158,28" fill="{{c2}}"/>
    <polygon points="160,412 162,416 166,416 163,418 164,422 160,420 156,422 157,418 154,416 158,416" fill="{{c2}}"/>

    <!-- Stub Guilloche / Micro-Detail Marks in bottom stub -->
    <g stroke="{{c3}}" stroke-width="1" opacity="0.5">
      <line x1="50" y1="360" x2="65" y2="375"/>
      <line x1="58" y1="360" x2="73" y2="375"/>
      <line x1="66" y1="360" x2="81" y2="375"/>
      
      <line x1="240" y1="360" x2="255" y2="375"/>
      <line x1="248" y1="360" x2="263" y2="375"/>
      <line x1="256" y1="360" x2="271" y2="375"/>
    </g>

    <!-- Stub Medallion Star in Center of Stub -->
    <circle cx="160" cy="370" r="14" stroke="{{c2}}" stroke-width="1.5" fill="none"/>
    <polygon points="160,362 162,367 167,367 163,370 165,375 160,372 155,375 157,370 153,367 158,367" fill="{{c1}}"/>
  </g>
</svg>
