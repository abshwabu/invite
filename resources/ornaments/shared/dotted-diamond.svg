<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" fill="none">
  <!-- Classic elegant horizontal divider with faceted diamond and graduated dots -->
  <g class="dotted-diamond" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Point: (200, 20) -->

    <!-- Left Tapered Rule Line -->
    <line x1="20" y1="20" x2="130" y2="20" stroke="{{c1}}" stroke-width="1.8"/>
    <line x1="40" y1="20" x2="130" y2="20" stroke="{{c2}}" stroke-width="1"/>

    <!-- Right Tapered Rule Line -->
    <line x1="270" y1="20" x2="380" y2="20" stroke="{{c1}}" stroke-width="1.8"/>
    <line x1="270" y1="20" x2="360" y2="20" stroke="{{c2}}" stroke-width="1"/>

    <!-- Left Graduated Dots (Ascending toward center) -->
    <circle cx="142" cy="20" r="1.8" fill="{{c3}}"/>
    <circle cx="154" cy="20" r="2.8" fill="{{c2}}"/>
    <circle cx="168" cy="20" r="4.0" fill="{{c1}}"/>
    <!-- Outer flanking diamond -->
    <polygon points="182,20 186,16 190,20 186,24" fill="{{c2}}"/>

    <!-- Center Hero Faceted Diamond -->
    <polygon points="200,6 214,20 200,34 186,20" fill="{{c1}}" stroke="{{c2}}" stroke-width="2"/>
    <!-- Inner Diamond Facet -->
    <polygon points="200,10 209,20 200,30 191,20" fill="{{c2}}" opacity="0.6"/>
    <!-- Center Pearl -->
    <circle cx="200" cy="20" r="3" fill="#FFFFFF"/>
    <!-- North/South/East/West facet lines -->
    <line x1="200" y1="6" x2="200" y2="34" stroke="{{c3}}" stroke-width="1" opacity="0.6"/>
    <line x1="186" y1="20" x2="214" y2="20" stroke="{{c3}}" stroke-width="1" opacity="0.6"/>

    <!-- Right Graduated Dots (Mirror of left) -->
    <polygon points="214,20 218,16 222,20 218,24" fill="{{c2}}"/>
    <circle cx="232" cy="20" r="4.0" fill="{{c1}}"/>
    <circle cx="246" cy="20" r="2.8" fill="{{c2}}"/>
    <circle cx="258" cy="20" r="1.8" fill="{{c3}}"/>

    <!-- Subtle End Ticks -->
    <circle cx="20" cy="20" r="2.2" fill="{{c1}}"/>
    <circle cx="380" cy="20" r="2.2" fill="{{c1}}"/>
  </g>
</svg>
