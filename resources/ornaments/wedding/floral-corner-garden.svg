<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main stem with thorny cubic curves -->
    <path d="M220,18 C160,28 70,60 26,160 C18,180 16,210 18,230" stroke="{{c1}}" stroke-width="3" />
    <path d="M180,32 C135,46 65,88 34,168" stroke="{{c2}}" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.7" />

    <!-- Corner Blossom: Layered Garden Rose -->
    <g transform="translate(48, 52)">
      <!-- Outer Petals (c3 shadow/soft) -->
      <path d="M-8,-26 C12,-38 42,-34 52,-18 C62,-2 58,26 40,38 C22,50 -10,48 -24,32 C-38,16 -28,-14 -8,-26 Z" fill="{{c3}}" opacity="0.4" stroke="{{c1}}" stroke-width="1.2" />
      <!-- Mid Petals (c2 accent) -->
      <path d="M2,-18 C18,-26 38,-20 42,-8 C46,4 40,22 28,28 C16,34 -4,30 -14,18 C-24,6 -14,-10 2,-18 Z" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M-6,-12 C8,-20 26,-16 30,-6 C34,4 28,16 18,20 C8,24 -8,20 -14,10 C-20,0 -20,-4 -6,-12 Z" fill="{{c1}}" opacity="0.2" />
      <!-- Inner Rose Petals Spiral (c1 main) -->
      <path d="M6,-6 C16,-10 24,-6 24,0 C24,6 18,12 10,12 C2,12 -4,8 -4,2 C-4,-4 2,-8 8,-8 C14,-8 18,-4 18,0" stroke="{{c1}}" stroke-width="1.8" />
      <circle cx="10" cy="1" r="2.5" fill="{{c1}}" />
    </g>

    <!-- Secondary Flower: Budding Blossom -->
    <g transform="translate(136, 32)">
      <path d="M0,0 C12,-14 28,-12 34,0 C40,12 28,26 14,24 C0,22 -12,14 0,0 Z" fill="{{c2}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M6,2 C14,-6 24,-4 26,4 C28,12 20,20 12,18 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
      <circle cx="15" cy="8" r="2" fill="{{c1}}" />
    </g>

    <!-- Side Bud -->
    <g transform="translate(24, 150)">
      <path d="M0,0 C-10,10 -8,26 4,30 C16,34 26,22 20,10 Z" fill="{{c2}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M2,6 C-4,14 -2,22 6,24 C14,26 20,18 16,10 Z" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
      <path d="M-2,20 C-6,30 -4,38 4,44" stroke="{{c1}}" stroke-width="1.5" />
    </g>

    <!-- Serrated Rose Leaves with Veins -->
    <!-- Leaf 1 (Top right) -->
    <g transform="translate(170, 20) rotate(-15)">
      <path d="M0,0 C18,-18 45,-12 55,5 C42,20 18,18 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.4" />
      <path d="M0,0 C20,-2 38,2 55,5" stroke="{{c1}}" stroke-width="1" />
      <path d="M18,-2 L24,-8 M32,1 L38,-5 M24,3 L20,8 M38,4 L36,10" stroke="{{c1}}" stroke-width="0.8" opacity="0.8" />
    </g>

    <!-- Leaf 2 (Mid outer) -->
    <g transform="translate(80, 75) rotate(40)">
      <path d="M0,0 C16,-16 40,-10 48,6 C36,18 15,15 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.3" />
      <path d="M0,0 C16,-2 32,2 48,6" stroke="{{c1}}" stroke-width="1" />
      <path d="M14,-2 L20,-7 M28,1 L34,-4 M18,3 L15,8 M30,4 L28,9" stroke="{{c1}}" stroke-width="0.75" />
    </g>

    <!-- Leaf 3 (Lower stem) -->
    <g transform="translate(18, 185) rotate(75)">
      <path d="M0,0 C15,-14 36,-8 44,5 C32,16 14,14 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.3" />
      <path d="M0,0 C15,-2 30,2 44,5" stroke="{{c1}}" stroke-width="1" />
    </g>

    <!-- Small Berries and tendrils -->
    <path d="M100,50 Q120,70 115,95" stroke="{{c1}}" stroke-width="1.2" />
    <circle cx="115" cy="98" r="3.5" fill="{{c1}}" />
    <circle cx="126" cy="85" r="2.8" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
    <circle cx="106" cy="80" r="2.5" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />

    <path d="M55,120 Q70,140 60,165" stroke="{{c1}}" stroke-width="1.2" />
    <circle cx="60" cy="168" r="3.2" fill="{{c1}}" />
    <circle cx="70" cy="155" r="2.6" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
  </g>
</svg>
