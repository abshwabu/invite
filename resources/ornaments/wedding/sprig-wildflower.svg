<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 300">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Slender Main Stem -->
    <path d="M75,285 C80,210 70,130 80,25" stroke="{{c1}}" stroke-width="2.2" />

    <!-- Terminal Top Florets -->
    <g transform="translate(80, 22)">
      <circle cx="0" cy="0" r="3" fill="{{c1}}" />
      <path d="M0,-8 L0,8 M-8,0 L8,0 M-6,-6 L6,6 M-6,6 L6,-6" stroke="{{c2}}" stroke-width="1.2" />
    </g>

    <!-- Side Blossom Tier 1 -->
    <g transform="translate(68, 65)">
      <path d="M12,0 C-5,-2 -15,5 -20,12" stroke="{{c1}}" stroke-width="1.2" />
      <circle cx="-20" cy="12" r="5" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1" />
      <circle cx="-20" cy="12" r="2" fill="{{c1}}" />
    </g>
    <g transform="translate(82, 85)">
      <path d="M-2,0 C12,-2 22,5 26,10" stroke="{{c1}}" stroke-width="1.2" />
      <circle cx="26" cy="10" r="4.5" fill="{{c3}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
      <circle cx="26" cy="10" r="1.8" fill="{{c1}}" />
    </g>

    <!-- Side Blossom Tier 2 -->
    <g transform="translate(70, 130)">
      <path d="M10,0 C-10,-4 -22,6 -28,15" stroke="{{c1}}" stroke-width="1.3" />
      <!-- Star Floret -->
      <polygon points="-28,7 -26,13 -20,15 -26,17 -28,23 -30,17 -36,15 -30,13" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="-28" cy="15" r="2.2" fill="{{c1}}" />
    </g>
    <g transform="translate(80, 160)">
      <path d="M0,0 C14,-2 26,6 32,16" stroke="{{c1}}" stroke-width="1.3" />
      <polygon points="32,8 34,14 40,16 34,18 32,24 30,18 24,16 30,14" fill="{{c3}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="32" cy="16" r="2.2" fill="{{c1}}" />
    </g>

    <!-- Grassy Slender Leaves -->
    <g transform="translate(74, 110)">
      <path d="M0,0 C-18,5 -32,25 -38,45 C-32,32 -18,15 0,0" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
    </g>
    <g transform="translate(76, 175)">
      <path d="M0,0 C20,8 35,30 40,55 C34,38 20,20 0,0" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1" />
    </g>
    <g transform="translate(74, 230)">
      <path d="M0,0 C-22,10 -38,32 -42,60 C-36,40 -20,22 0,0" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1" />
    </g>
  </g>
</svg>
