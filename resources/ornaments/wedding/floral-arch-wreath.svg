      <path d="M0,0 L38,0" stroke="{{c1}}" stroke-width="0.8" />
    </g>
    <g transform="translate(485, 78) rotate(48)">
      <path d="M0,0 C14,-16 32,-10 36,0 C26,12 10,10 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
