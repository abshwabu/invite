    <g transform="translate(115, 78) rotate(-48)">
      <path d="M0,0 C-14,-16 -32,-10 -36,0 C-26,12 -10,10 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
