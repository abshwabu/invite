    </g>

    <!-- Delicate accent berry clusters -->
    <circle cx="205" cy="46" r="3" fill="{{c1}}" />
    <circle cx="215" cy="54" r="2.4" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
    <circle cx="395" cy="46" r="3" fill="{{c1}}" />
    <circle cx="385" cy="54" r="2.4" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
