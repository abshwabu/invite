    <path d="M40,160 C120,40 220,15 300,15 C380,15 480,40 560,160" stroke="{{c1}}" stroke-width="2.6" />
    <path d="M70,175 C145,65 230,32 300,32 C370,32 455,65 530,175" stroke="{{c3}}" stroke-width="1.2" opacity="0.6" stroke-dasharray="3,3" />

    <!-- Center Blossom Composition -->
    <g transform="translate(300, 20)">
