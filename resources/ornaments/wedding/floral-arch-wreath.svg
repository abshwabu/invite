    <g transform="translate(370, 22) rotate(15)">
      <path d="M0,0 C15,-18 35,-14 42,0 C30,14 12,12 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 L42,0" stroke="{{c1}}" stroke-width="0.8" />
