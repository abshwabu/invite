      <path d="M-22,-4 C-26,-24 -6,-32 10,-28 C26,-32 40,-16 36,0 C42,16 28,32 10,34 C-8,36 -24,24 -26,8 Z" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.3" />
      <path d="M-14,-2 C-16,-16 -2,-22 8,-18 C18,-22 28,-12 24,0 C28,12 18,22 8,24 C-4,26 -14,18 -16,6 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
