    </g>

    <!-- Symmetrical Eucalyptus and Laurel Leaves -->
    <!-- Left Flank -->
    <g transform="translate(230, 22) rotate(-15)">
      <path d="M0,0 C-15,-18 -35,-14 -42,0 C-30,14 -12,12 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 L-42,0" stroke="{{c1}}" stroke-width="0.8" />
    </g>
    <g transform="translate(170, 42) rotate(-30)">
