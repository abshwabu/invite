<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 300">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gentle S-Curved Main Stem -->
    <path d="M70,285 C80,210 95,140 75,70 C70,50 65,30 65,15" stroke="{{c1}}" stroke-width="2.5" />
    <path d="M72,240 C85,180 92,120 78,72" stroke="{{c3}}" stroke-width="1.2" opacity="0.6" stroke-dasharray="2,3" />

    <!-- Alternating Olive Leaf Pairs -->
    <!-- Pair 1 (Near tip) -->
    <g transform="translate(65, 30)">
      <path d="M0,0 C-15,-15 -25,-5 -28,8 C-20,18 -8,12 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C12,-16 28,-12 32,2 C25,14 10,12 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>

    <!-- Pair 2 -->
    <g transform="translate(74, 85)">
      <path d="M0,0 C-18,-18 -34,-10 -38,5 C-26,18 -10,14 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C15,-18 36,-12 40,4 C30,16 12,14 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>

    <!-- Pair 3 -->
    <g transform="translate(85, 145)">
      <path d="M0,0 C-20,-18 -38,-8 -42,8 C-28,20 -10,15 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C18,-18 40,-10 45,6 C34,18 14,15 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>

    <!-- Pair 4 -->
    <g transform="translate(82, 210)">
      <path d="M0,0 C-18,-16 -35,-6 -38,10 C-25,20 -8,15 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C16,-16 36,-8 40,8 C28,18 10,15 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>

    <!-- Ripe Olives (c1 main with highlight) -->
    <g transform="translate(68, 65)">
      <line x1="0" y1="0" x2="-8" y2="10" stroke="{{c1}}" stroke-width="1" />
      <ellipse cx="-11" cy="17" rx="5" ry="7" fill="{{c1}}" stroke="{{c2}}" stroke-width="0.8" transform="rotate(-15 -11 17)" />
      <circle cx="-13" cy="14" r="1.5" fill="{{c3}}" />
    </g>
    <g transform="translate(88, 125)">
      <line x1="0" y1="0" x2="8" y2="10" stroke="{{c1}}" stroke-width="1" />
      <ellipse cx="12" cy="17" rx="5.5" ry="7.5" fill="{{c1}}" stroke="{{c2}}" stroke-width="0.8" transform="rotate(15 12 17)" />
      <circle cx="10" cy="14" r="1.5" fill="{{c3}}" />
    </g>
    <g transform="translate(76, 185)">
      <line x1="0" y1="0" x2="-10" y2="8" stroke="{{c1}}" stroke-width="1" />
      <ellipse cx="-14" cy="15" rx="5" ry="7" fill="{{c1}}" stroke="{{c2}}" stroke-width="0.8" transform="rotate(-20 -14 15)" />
    </g>
  </g>
</svg>
