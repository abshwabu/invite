<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ring (Slightly tilted) -->
    <g transform="translate(85, 105) rotate(-15)">
      <!-- Outer & Inner Ring Bevels -->
      <ellipse cx="0" cy="0" rx="42" ry="42" stroke="{{c1}}" stroke-width="6" />
      <ellipse cx="0" cy="0" rx="42" ry="42" stroke="{{c2}}" stroke-width="2" opacity="0.8" />
      <ellipse cx="0" cy="0" rx="36" ry="36" stroke="{{c3}}" stroke-width="1.5" />
    </g>

    <!-- Right Ring (With Solitaire Diamond) -->
    <g transform="translate(135, 105) rotate(15)">
      <ellipse cx="0" cy="0" rx="42" ry="42" stroke="{{c1}}" stroke-width="6" />
      <ellipse cx="0" cy="0" rx="42" ry="42" stroke="{{c2}}" stroke-width="2" opacity="0.8" />
      <ellipse cx="0" cy="0" rx="36" ry="36" stroke="{{c3}}" stroke-width="1.5" />

      <!-- Diamond Setting Prongs -->
      <path d="M-10,-42 L-6,-49 L6,-49 L10,-42" stroke="{{c1}}" stroke-width="2.5" fill="{{c2}}" />

      <!-- Faceted Solitaire Diamond -->
      <!-- Table & Crown -->
      <polygon points="0,-68 -14,-54 14,-54" fill="{{c2}}" stroke="{{c1}}" stroke-width="1.5" />
      <polygon points="-14,-54 -8,-49 8,-49 14,-54" fill="{{c3}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.5" />
      <!-- Pavilion facets -->
      <polygon points="0,-68 -5,-54 5,-54" fill="{{c3}}" stroke="{{c1}}" stroke-width="1" />
    </g>

    <!-- Sparkle Rays around Diamond -->
    <g transform="translate(142, 45)">
      <line x1="0" y1="-14" x2="0" y2="-6" stroke="{{c1}}" stroke-width="2" />
      <line x1="0" y1="6" x2="0" y2="14" stroke="{{c1}}" stroke-width="2" />
      <line x1="-14" y1="0" x2="-6" y2="0" stroke="{{c1}}" stroke-width="2" />
      <line x1="6" y1="0" x2="14" y2="0" stroke="{{c1}}" stroke-width="2" />
      <circle cx="0" cy="0" r="2.5" fill="{{c2}}" />
    </g>
  </g>
</svg>
