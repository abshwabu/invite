<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Beveled Oval Frame -->
    <ellipse cx="170" cy="205" rx="100" ry="135" stroke="{{c1}}" stroke-width="2.5" />
    <ellipse cx="170" cy="205" rx="106" ry="141" stroke="{{c3}}" stroke-width="1.2" opacity="0.6" stroke-dasharray="3,4" />
    <ellipse cx="170" cy="205" rx="94" ry="129" stroke="{{c2}}" stroke-width="1.5" />

    <!-- Left Laurel Wreath Branch (6 Leaf Clusters) -->
    <g transform="translate(170, 205)">
      <!-- Left side stems -->
      <path d="M-8,-145 C-75,-140 -130,-70 -130,0 C-130,70 -75,140 -8,145" stroke="{{c1}}" stroke-width="2.2" />

      <!-- Leaves along left branch -->
      <g transform="translate(-50, -135) rotate(-20)">
        <path d="M0,0 C-14,-12 -26,-6 -28,8 C-18,14 -8,8 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(-105, -95) rotate(-45)">
        <path d="M0,0 C-14,-14 -28,-8 -30,6 C-20,14 -8,10 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(-132, -30) rotate(-75)">
        <path d="M0,0 C-15,-14 -30,-8 -32,6 C-22,14 -8,10 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(-132, 35) rotate(-105)">
        <path d="M0,0 C-15,-14 -30,-8 -32,6 C-22,14 -8,10 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(-105, 95) rotate(-135)">
        <path d="M0,0 C-14,-14 -28,-8 -30,6 C-20,14 -8,10 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(-50, 135) rotate(-160)">
        <path d="M0,0 C-14,-12 -26,-6 -28,8 C-18,14 -8,8 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1" />
      </g>

      <!-- Right side stems (mirrored) -->
      <path d="M8,-145 C75,-140 130,-70 130,0 C130,70 75,140 8,145" stroke="{{c1}}" stroke-width="2.2" />

      <!-- Leaves along right branch -->
      <g transform="translate(50, -135) rotate(20)">
        <path d="M0,0 C14,-12 26,-6 28,8 C18,14 8,8 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(105, -95) rotate(45)">
        <path d="M0,0 C14,-14 28,-8 30,6 C20,14 8,10 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(132, -30) rotate(75)">
        <path d="M0,0 C15,-14 30,-8 32,6 C22,14 8,10 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(132, 35) rotate(105)">
        <path d="M0,0 C15,-14 30,-8 32,6 C22,14 8,10 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(105, 95) rotate(135)">
        <path d="M0,0 C14,-14 28,-8 30,6 C20,14 8,10 0,0 Z" fill="{{c2}}" opacity="0.7" stroke="{{c1}}" stroke-width="1" />
      </g>
      <g transform="translate(50, 135) rotate(160)">
        <path d="M0,0 C14,-12 26,-6 28,8 C18,14 8,8 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1" />
      </g>
    </g>

    <!-- Bottom Bow Tie Ribbon -->
    <g transform="translate(170, 350)">
      <path d="M0,0 C-12,-16 -32,-12 -34,4 C-36,16 -14,14 0,0 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.4" />
      <path d="M0,0 C12,-16 32,-12 34,4 C36,16 14,14 0,0 Z" fill="{{c2}}" opacity="0.8" stroke="{{c1}}" stroke-width="1.4" />
      <circle cx="0" cy="2" r="5" fill="{{c1}}" />
      <path d="M-3,5 C-10,22 -20,40 -26,48" stroke="{{c1}}" stroke-width="1.8" />
      <path d="M3,5 C10,22 20,40 26,48" stroke="{{c1}}" stroke-width="1.8" />
    </g>

    <!-- Top Crown Tiara Crest -->
    <g transform="translate(170, 56)">
      <circle cx="0" cy="0" r="4" fill="{{c1}}" />
      <circle cx="-16" cy="6" r="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <circle cx="16" cy="6" r="3" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
      <path d="M-24,12 C-12,4 12,4 24,12" stroke="{{c1}}" stroke-width="1.5" />
    </g>
  </g>
</svg>
