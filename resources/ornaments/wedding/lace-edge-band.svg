<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Continuous top edge header bands -->
    <path d="M0,3 L120,3" stroke="{{c1}}" stroke-width="1.5" />
    <path d="M0,6 L120,6" stroke="{{c2}}" stroke-width="0.8" stroke-dasharray="2,2" />
    <path d="M0,9 L120,9" stroke="{{c1}}" stroke-width="1" />

    <!-- 4 repeating scallops with period 30: 0..30, 30..60, 60..90, 90..120 -->
    <!-- Scallop outer arches -->
    <path d="M0,9 C5,30 25,30 30,9 C35,30 55,30 60,9 C65,30 85,30 90,9 C95,30 115,30 120,9" stroke="{{c1}}" stroke-width="1.4" />

    <!-- Scallop inner arches with soft fill -->
    <path d="M2,9 C6,26 24,26 28,9 Z" fill="{{c3}}" opacity="0.4" stroke="{{c2}}" stroke-width="0.9" />
    <path d="M32,9 C36,26 54,26 58,9 Z" fill="{{c3}}" opacity="0.4" stroke="{{c2}}" stroke-width="0.9" />
    <path d="M62,9 C66,26 84,26 88,9 Z" fill="{{c3}}" opacity="0.4" stroke="{{c2}}" stroke-width="0.9" />
    <path d="M92,9 C96,26 114,26 118,9 Z" fill="{{c3}}" opacity="0.4" stroke="{{c2}}" stroke-width="0.9" />

    <!-- Picot drops below scallop tips -->
    <path d="M12,24 C12,32 18,32 18,24" stroke="{{c1}}" stroke-width="1" />
    <circle cx="15" cy="35" r="1.8" fill="{{c1}}" />
    <circle cx="15" cy="30" r="1.2" fill="{{c2}}" />

    <path d="M42,24 C42,32 48,32 48,24" stroke="{{c1}}" stroke-width="1" />
    <circle cx="45" cy="35" r="1.8" fill="{{c1}}" />
    <circle cx="45" cy="30" r="1.2" fill="{{c2}}" />

    <path d="M72,24 C72,32 78,32 78,24" stroke="{{c1}}" stroke-width="1" />
    <circle cx="75" cy="35" r="1.8" fill="{{c1}}" />
    <circle cx="75" cy="30" r="1.2" fill="{{c2}}" />

    <path d="M102,24 C102,32 108,32 108,24" stroke="{{c1}}" stroke-width="1" />
    <circle cx="105" cy="35" r="1.8" fill="{{c1}}" />
    <circle cx="105" cy="30" r="1.2" fill="{{c2}}" />

    <!-- Inner lace eyelet rosettes inside each scallop -->
    <!-- Rosette 1 (cx=15) -->
    <circle cx="15" cy="17" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
    <circle cx="15" cy="12.5" r="1" fill="{{c1}}" />
    <circle cx="15" cy="21.5" r="1" fill="{{c1}}" />
    <circle cx="10.5" cy="17" r="1" fill="{{c1}}" />
    <circle cx="19.5" cy="17" r="1" fill="{{c1}}" />

    <!-- Rosette 2 (cx=45) -->
    <circle cx="45" cy="17" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
    <circle cx="45" cy="12.5" r="1" fill="{{c1}}" />
    <circle cx="45" cy="21.5" r="1" fill="{{c1}}" />
    <circle cx="40.5" cy="17" r="1" fill="{{c1}}" />
    <circle cx="49.5" cy="17" r="1" fill="{{c1}}" />

    <!-- Rosette 3 (cx=75) -->
    <circle cx="75" cy="17" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
    <circle cx="75" cy="12.5" r="1" fill="{{c1}}" />
    <circle cx="75" cy="21.5" r="1" fill="{{c1}}" />
    <circle cx="70.5" cy="17" r="1" fill="{{c1}}" />
    <circle cx="79.5" cy="17" r="1" fill="{{c1}}" />

    <!-- Rosette 4 (cx=105) -->
    <circle cx="105" cy="17" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.7" />
    <circle cx="105" cy="12.5" r="1" fill="{{c1}}" />
    <circle cx="105" cy="21.5" r="1" fill="{{c1}}" />
    <circle cx="100.5" cy="17" r="1" fill="{{c1}}" />
    <circle cx="109.5" cy="17" r="1" fill="{{c1}}" />

    <!-- Junction diamonds between scallops (x=0/120, x=30, x=60, x=90) -->
    <path d="M30,7 L32,9 L30,11 L28,9 Z" fill="{{c1}}" />
    <path d="M60,7 L62,9 L60,11 L58,9 Z" fill="{{c1}}" />
    <path d="M90,7 L92,9 L90,11 L88,9 Z" fill="{{c1}}" />
    <!-- At x=0 and x=120, split diamonds to seamlessly join when tiled -->
    <path d="M0,7 L2,9 L0,11 Z" fill="{{c1}}" />
    <path d="M120,7 L118,9 L120,11 Z" fill="{{c1}}" />
  </g>
</svg>
