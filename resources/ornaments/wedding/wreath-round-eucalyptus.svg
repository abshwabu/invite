<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Double Circular Vine Base -->
    <circle cx="200" cy="200" r="140" stroke="{{c1}}" stroke-width="2.5" />
    <circle cx="200" cy="200" r="146" stroke="{{c3}}" stroke-width="1.2" opacity="0.6" stroke-dasharray="3,4" />

    <!-- Eucalyptus Round Leaves Around Ring (12 pairs) -->
    <!-- Top -->
    <g transform="translate(200, 60)">
      <path d="M0,0 C-12,-16 -30,-12 -32,2 C-34,16 -18,22 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C12,-16 30,-12 32,2 C34,16 18,22 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>
    <!-- 2 o'clock -->
    <g transform="translate(290, 110) rotate(45)">
      <path d="M0,0 C-10,-18 -26,-15 -28,0 C-30,15 -14,20 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C10,-18 26,-15 28,0 C30,15 14,20 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>
    <!-- 3 o'clock -->
    <g transform="translate(340, 200) rotate(90)">
      <path d="M0,0 C-10,-18 -26,-15 -28,0 C-30,15 -14,20 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C10,-18 26,-15 28,0 C30,15 14,20 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>
    <!-- 4 o'clock -->
    <g transform="translate(290, 290) rotate(135)">
      <path d="M0,0 C-10,-18 -26,-15 -28,0 C-30,15 -14,20 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C10,-18 26,-15 28,0 C30,15 14,20 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>
    <!-- 8 o'clock -->
    <g transform="translate(110, 290) rotate(-135)">
      <path d="M0,0 C-10,-18 -26,-15 -28,0 C-30,15 -14,20 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C10,-18 26,-15 28,0 C30,15 14,20 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>
    <!-- 9 o'clock -->
    <g transform="translate(60, 200) rotate(-90)">
      <path d="M0,0 C-10,-18 -26,-15 -28,0 C-30,15 -14,20 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C10,-18 26,-15 28,0 C30,15 14,20 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>
    <!-- 10 o'clock -->
    <g transform="translate(110, 110) rotate(-45)">
      <path d="M0,0 C-10,-18 -26,-15 -28,0 C-30,15 -14,20 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M0,0 C10,-18 26,-15 28,0 C30,15 14,20 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
    </g>

    <!-- Seed pods around ring -->
    <circle cx="250" cy="70" r="3.5" fill="{{c1}}" />
    <circle cx="330" cy="150" r="3.5" fill="{{c1}}" />
    <circle cx="320" cy="250" r="3.5" fill="{{c1}}" />
    <circle cx="150" cy="70" r="3.5" fill="{{c1}}" />
    <circle cx="70" cy="150" r="3.5" fill="{{c1}}" />
    <circle cx="80" cy="250" r="3.5" fill="{{c1}}" />

    <!-- Ribbon Knot & Bow at Bottom Base -->
    <g transform="translate(200, 340)">
      <!-- Left loop -->
      <path d="M0,0 C-15,-20 -40,-15 -42,5 C-44,20 -18,18 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.5" />
      <!-- Right loop -->
      <path d="M0,0 C15,-20 40,-15 42,5 C44,20 18,18 0,0 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.5" />
      <!-- Knot -->
      <ellipse cx="0" cy="2" rx="7" ry="5" fill="{{c1}}" />
      <!-- Tails -->
      <path d="M-4,5 C-12,25 -25,45 -35,55" stroke="{{c1}}" stroke-width="2" />
      <path d="M4,5 C12,25 25,45 35,55" stroke="{{c1}}" stroke-width="2" />
    </g>
  </g>
</svg>
