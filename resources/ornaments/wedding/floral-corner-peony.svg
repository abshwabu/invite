<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Curved trailing vine -->
    <path d="M225,25 C150,20 60,65 25,150 C18,175 18,205 20,225" stroke="{{c1}}" stroke-width="2.6" />
    <path d="M190,38 C130,48 55,90 32,170" stroke="{{c3}}" stroke-width="1.2" opacity="0.6" />

    <!-- Big Center Ruffled Peony -->
    <g transform="translate(68, 68)">
      <!-- Base Outer Petals (c3) -->
      <path d="M-40,-15 C-45,-45 -10,-55 15,-48 C40,-55 60,-30 55,-5 C65,20 45,50 15,55 C-15,58 -45,40 -48,15 Z" fill="{{c3}}" opacity="0.35" stroke="{{c1}}" stroke-width="1.3" />
      <!-- Mid Ruffled Petals (c2) -->
      <path d="M-30,-8 C-32,-30 -8,-38 10,-32 C30,-38 45,-20 40,-2 C48,16 32,38 10,40 C-10,42 -30,30 -32,10 Z" fill="{{c2}}" opacity="0.6" stroke="{{c1}}" stroke-width="1.2" />
      <!-- Overlapping Petal Swirls -->
      <path d="M-15,-20 C-5,-30 15,-28 25,-18 C35,-8 32,10 20,22 C8,32 -10,28 -20,18 C-30,8 -25,-10 -15,-20 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M-8,-12 C0,-20 18,-18 22,-8 C26,2 20,16 10,20 C0,24 -12,18 -14,8 Z" fill="{{c2}}" opacity="0.75" stroke="{{c1}}" stroke-width="1.2" />
      <path d="M-2,-5 C4,-10 14,-8 16,-2 C18,4 12,12 6,14 C0,16 -6,12 -8,6 Z" fill="{{c1}}" opacity="0.3" />
      <path d="M2,0 C6,-4 12,-2 12,2 C12,6 8,8 4,8" stroke="{{c1}}" stroke-width="1.8" />
      <!-- Stamens -->
      <line x1="2" y1="-8" x2="0" y2="-12" stroke="{{c1}}" stroke-width="1" />
      <circle cx="0" cy="-13" r="1.5" fill="{{c1}}" />
      <line x1="10" y1="-7" x2="14" y2="-11" stroke="{{c1}}" stroke-width="1" />
      <circle cx="15" cy="-12" r="1.5" fill="{{c1}}" />
      <line x1="14" y1="2" x2="19" y2="2" stroke="{{c1}}" stroke-width="1" />
      <circle cx="20" cy="2" r="1.5" fill="{{c1}}" />
    </g>

    <!-- Side Leaves and Foliage -->
    <!-- Top-Right Foliage Cluster -->
    <g transform="translate(150, 28) rotate(-10)">
      <path d="M0,0 C15,-20 40,-15 50,0 C38,15 15,12 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.3" />
      <path d="M0,0 C18,-5 35,-2 50,0" stroke="{{c1}}" stroke-width="0.9" />
      <path d="M15,-5 L22,-11 M30,-3 L36,-8 M22,3 L18,8" stroke="{{c1}}" stroke-width="0.75" />
    </g>
    <g transform="translate(160, 38) rotate(25)">
      <path d="M0,0 C12,-15 32,-10 40,0 C30,12 12,10 0,0 Z" fill="{{c3}}" opacity="0.5" stroke="{{c1}}" stroke-width="1.1" />
    </g>

    <!-- Lower Stem Foliage -->
    <g transform="translate(30, 165) rotate(65)">
      <path d="M0,0 C16,-18 42,-12 50,2 C38,16 15,14 0,0 Z" fill="{{c2}}" opacity="0.65" stroke="{{c1}}" stroke-width="1.3" />
      <path d="M0,0 C16,-4 32,-1 50,2" stroke="{{c1}}" stroke-width="0.9" />
    </g>

    <!-- Delicate Curled Tendril -->
    <path d="M125,50 C140,75 130,95 110,90 C95,85 100,70 112,72" stroke="{{c1}}" stroke-width="1.2" />
    <circle cx="112" cy="72" r="2.2" fill="{{c2}}" stroke="{{c1}}" stroke-width="0.8" />
  </g>
</svg>
